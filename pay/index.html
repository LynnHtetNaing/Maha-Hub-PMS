<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Maha Hub — Secure payment</title>
<meta name="description" content="Pay your hotel securely with Maha Hub Payment Link. Foundation sample — no live bank charge.">
<link rel="icon" type="image/png" sizes="48x48" href="../icons/favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#184D3A;--green2:#0F3627;--gold:#C8942D;--gold2:#E2B45A;--ivory:#F7F3EA;
  --ink:#1d2a33;--mut:#5d6b75;--line:#d5cbb8;--card:#fff;--ok:#17603a;--bad:#b3261e;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:15px/1.45 "Noto Sans",system-ui,sans-serif;color:var(--ink);background:
  radial-gradient(900px 420px at 12% -8%,rgba(200,148,45,.18),transparent 55%),
  linear-gradient(165deg,#e8efe9 0%,var(--ivory) 45%,#e2e8e4 100%)}
a{color:var(--green)}button,input,select{font:inherit}
.banner{background:var(--green2);color:#dce8e1;font-size:12px;padding:9px 14px;text-align:center;border-bottom:1px solid rgba(200,148,45,.4)}
.banner b{color:var(--gold2)}
.wrap{width:min(520px,92vw);margin:28px auto 48px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand img{width:42px;height:42px;object-fit:contain}
.brand b{font-family:Cinzel,Georgia,serif;letter-spacing:.12em;color:var(--green2);font-size:15px}
.brand span{display:block;font-size:11px;color:var(--mut);letter-spacing:.04em;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 14px 36px rgba(15,54,39,.08)}
.h1{font-family:Cinzel,Georgia,serif;font-size:1.45rem;margin:0 0 4px;color:var(--green2)}
.sub{color:var(--mut);margin:0 0 16px;font-size:13.5px;line-height:1.5}
.amt{font-family:Cinzel,Georgia,serif;font-size:2rem;color:var(--green);margin:0 0 4px}
.meta{display:grid;gap:6px;margin:0 0 18px;padding:12px;background:#f6f2ea;border-radius:8px;font-size:13px}
.meta div{display:flex;justify-content:space-between;gap:10px}.meta b{font-weight:700;color:var(--ink)}
.f{display:grid;gap:5px;margin-bottom:12px;font-size:12px;font-weight:700;color:#44535d}
.f input{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 12px;background:#fff;font-weight:500;color:var(--ink)}
.f input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:0;border-radius:8px;padding:13px 16px;font-weight:700;cursor:pointer;width:100%;background:linear-gradient(180deg,#e2b45a,#c8942d);color:#1e1606;border:1px solid #b07e20}
.btn:hover{filter:brightness(1.04)}.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--bad);font-weight:700;font-size:13px;min-height:1.2em;margin:0 0 8px}
.okbox{background:#e8f6ee;border:1px solid #b7dfc4;border-radius:10px;padding:16px;color:var(--ok)}
.warn{background:#fff8e8;border:1px solid #e6d3a8;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#8b5e3c;margin:14px 0 0;line-height:1.45}
.empty{padding:28px 8px;text-align:center;color:var(--mut)}
.foot{margin-top:16px;text-align:center;font-size:12px;color:var(--mut)}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="banner"><b>Maha Hub Payment Link</b> · Foundation sample — no live bank charge. Card number is tokenized; CVC is never stored.</div>
<main class="wrap" id="app"><div class="empty">Loading payment link…</div></main>
<script>
const DBKEY='mahahub.v5';
const $= (s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);
const linkId=(params.get('id')||params.get('link')||location.hash.replace(/^#/,'')||'').trim();

function loadDB(){
  try{const raw=localStorage.getItem(DBKEY);if(!raw)return null;return JSON.parse(raw)}catch(e){return null}
}
function saveDB(db){try{db.savedAt=Date.now();localStorage.setItem(DBKEY,JSON.stringify(db));return true}catch(e){return false}}
function findLink(db,id){
  if(!db||!db.hotels||!id)return null;
  for(const h of Object.values(db.hotels)){
    const list=h.payLinks||[];
    const hit=list.find(x=>x.id===id);
    if(hit)return {hotel:h,link:hit};
  }
  return null;
}
function money(n,cur){
  try{return new Intl.NumberFormat(undefined,{style:'currency',currency:cur||'THB',maximumFractionDigits:2}).format(+n||0)}
  catch(e){return ((+n||0).toFixed(2))+' '+(cur||'')}
}
function onlyDigits(s){return String(s||'').replace(/\D/g,'')}
function formatPan(v){const d=onlyDigits(v).slice(0,19);return d.replace(/(\d{4})(?=\d)/g,'$1 ').trim()}
function formatExp(v){const d=onlyDigits(v).slice(0,4);if(d.length<=2)return d;return d.slice(0,2)+'/'+d.slice(2)}
function luhn(pan){
  let sum=0,alt=false;
  for(let i=pan.length-1;i>=0;i--){let n=+pan[i];if(alt){n*=2;if(n>9)n-=9}sum+=n;alt=!alt}
  return pan.length>=12&&sum%10===0;
}
function brandOf(pan){
  if(/^4/.test(pan))return 'VISA';
  if(/^(5[1-5]|2[2-7])/.test(pan))return 'MASTER';
  if(/^3[47]/.test(pan))return 'AMEX';
  if(/^35/.test(pan))return 'JCB';
  if(/^62/.test(pan))return 'UNIONPAY';
  return 'CARD';
}
function tokenOf(pan,exp){
  let h=0;const s=pan+'|'+exp+'|maha-demo';
  for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;
  return 'tok_demo_'+Math.abs(h).toString(36)+'_'+pan.slice(-4);
}
function paintMissing(msg){
  $('#app').innerHTML=`<div class="brand"><img src="../icons/maha-mark-sq.png" alt=""><div><b>MAHA HUB</b><span>Secure payment</span></div></div>
    <div class="card"><h1 class="h1">Link not found</h1><p class="sub">${esc(msg)}</p>
    <p class="sub">Ask the hotel to send a new payment link from Maha Hub → Billing → Payment links.</p></div>`;
}
function paintPaid(hotel,link){
  $('#app').innerHTML=`<div class="brand"><img src="../icons/maha-mark-sq.png" alt=""><div><b>MAHA HUB</b><span>Secure payment</span></div></div>
    <div class="card">
      <div class="okbox"><b>Payment recorded</b><div style="margin-top:6px;font-weight:500">Thank you. ${esc(hotel.set.name)} received this payment request as paid (demo).</div></div>
      <div class="meta mt" style="margin-top:14px">
        <div><span>Amount</span><b>${esc(money(link.amount,link.cur||hotel.set.cur))}</b></div>
        <div><span>Card</span><b>${esc((link.card&&link.card.brand)||'CARD')} •••• ${esc(link.card&&link.card.last4||'')}</b></div>
        <div><span>Reference</span><b>${esc(link.id)}</b></div>
      </div>
      <div class="warn">Foundation sample only. No money moved through a bank or card network. Full card number and CVC were not kept.</div>
    </div>
    <p class="foot">Powered by Maha Hub · Padauk Hospitality Technology and Academy</p>`;
}
function paintForm(hotel,link){
  const cur=link.cur||hotel.set.cur||'THB';
  $('#app').innerHTML=`<div class="brand"><img src="../icons/maha-mark-sq.png" alt=""><div><b>MAHA HUB</b><span>Secure payment</span></div></div>
    <div class="card">
      <h1 class="h1">Pay ${esc(hotel.set.name)}</h1>
      <p class="sub">Complete this secure form to send card details for your stay. This is a Maha Hub foundation sample.</p>
      <div class="amt">${esc(money(link.amount,cur))}</div>
      <div class="meta">
        <div><span>Guest</span><b>${esc(link.guest||'—')}</b></div>
        ${link.rsvn?`<div><span>Reservation</span><b>${esc(link.rsvn)}</b></div>`:''}
        ${link.note?`<div><span>Note</span><b>${esc(link.note)}</b></div>`:''}
        <div><span>Link</span><b>${esc(link.id)}</b></div>
      </div>
      <form id="payForm" autocomplete="on">
        <label class="f"><span>Cardholder name</span><input id="holder" name="ccname" autocomplete="cc-name" placeholder="Name on card" required></label>
        <label class="f"><span>Card number</span><input id="pan" name="cardnumber" inputmode="numeric" autocomplete="cc-number" placeholder="•••• •••• •••• ••••" required></label>
        <div class="row2">
          <label class="f"><span>Expiry (MM/YY)</span><input id="exp" name="cc-exp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" required></label>
          <label class="f"><span>CVC</span><input id="cvc" name="cvc" inputmode="numeric" autocomplete="cc-csc" placeholder="•••" maxlength="4" required></label>
        </div>
        <div class="err" id="err" role="alert"></div>
        <button class="btn" type="submit" id="go">Pay ${esc(money(link.amount,cur))}</button>
      </form>
      <div class="warn">Demo vault: we keep brand, last 4 digits, expiry and a token only. CVC is checked then discarded. No live charge is sent.</div>
    </div>
    <p class="foot">Powered by Maha Hub · Padauk Hospitality Technology and Academy</p>`;

  const panEl=$('#pan'), expEl=$('#exp');
  panEl.addEventListener('input',()=>{panEl.value=formatPan(panEl.value)});
  expEl.addEventListener('input',()=>{expEl.value=formatExp(expEl.value)});
  $('#payForm').onsubmit=(e)=>{
    e.preventDefault();
    const err=$('#err');err.textContent='';
    const holder=$('#holder').value.trim();
    const pan=onlyDigits($('#pan').value);
    const exp=formatExp($('#exp').value);
    const cvc=onlyDigits($('#cvc').value);
    if(holder.length<2){err.textContent='Enter the cardholder name.';return}
    if(!luhn(pan)){err.textContent='Card number is not valid.';return}
    if(!/^\d{2}\/\d{2}$/.test(exp)){err.textContent='Use expiry as MM/YY.';return}
    const mm=+exp.slice(0,2), yy=+exp.slice(3);
    if(mm<1||mm>12){err.textContent='Expiry month is not valid.';return}
    const now=new Date(), y=2000+yy, m=mm-1;
    if(y<now.getFullYear()||(y===now.getFullYear()&&m<now.getMonth())){err.textContent='This card looks expired.';return}
    if(cvc.length<3||cvc.length>4){err.textContent='Enter a valid CVC.';return}

    const db=loadDB();const found=findLink(db,link.id);
    if(!found||found.link.status!=='open'){paintMissing('This payment link is no longer open.');return}
    const brand=brandOf(pan);
    const token=tokenOf(pan,exp);
    // Tokenize: never keep PAN or CVC on the hotel file for this sample flow.
    found.link.status='paid';
    found.link.paidAt=Date.now();
    found.link.card={brand,last4:pan.slice(-4),exp,holder,token};
    found.link.cvcChecked=true;
    found.link.demo=true;
    if(!saveDB(db)){err.textContent='Could not save on this browser. Try again.';return}
    // wipe sensitive fields from the form DOM
    $('#pan').value='';$('#cvc').value='';
    paintPaid(found.hotel,found.link);
  };
}

(function boot(){
  if(!linkId){paintMissing('No payment link id was provided.');return}
  const db=loadDB();
  if(!db){paintMissing('Open Maha Hub on this browser first (same device), then open the payment link again. Demo links use this browser’s hotel file.');return}
  const found=findLink(db,linkId);
  if(!found){paintMissing('No payment link matches “'+linkId+'”.');return}
  if(found.link.status==='paid'){paintPaid(found.hotel,found.link);return}
  if(found.link.status!=='open'){paintMissing('This payment link is '+found.link.status+'.');return}
  if(found.link.expiresAt&&Date.now()>found.link.expiresAt){
    found.link.status='expired';saveDB(db);paintMissing('This payment link has expired.');return
  }
  paintForm(found.hotel,found.link);
})();
</script>
</body>
</html>
