<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Maha Reach — One place for the hotel’s public message.</title>
<meta name="description" content="One place for the hotel’s public message.">
<link rel="icon" id="favicon" href="mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#184D3A;--green2:#0F3627;--gold:#C8942D;--gold2:#E2B45A;--ivory:#F7F3EA;--ink:#1c2421;--mut:#5d6b66;--line:#e2d9c8;--card:#fff;--bg:#f3efe6}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.45 "Noto Sans","Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
input,select,textarea{border:1px solid #d5cbb8;border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0}h1{font-family:"Cinzel",Georgia,serif;font-size:28px;letter-spacing:.04em}h2{font-size:20px}h3{font-size:16px}
.mut{color:var(--mut);font-size:13px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}
.btn{background:var(--green);color:#fff;border:1px solid var(--green);border-radius:8px;padding:8px 14px;font-weight:700}
.btn:hover{background:#12402f}.btn.gold{background:var(--gold);border-color:#a87a1e;color:#1e1606}.btn.ghost{background:#fff;color:var(--green);border-color:#b7c9bf}
.btn.sm{padding:5px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#eee7d8}
.pill.wait{background:#fff1c9;color:#7a5800}.pill.ok{background:#d8f3e4;color:#146c3a}.pill.post{background:#d7e7f8;color:#1a4f86}
.review{background:#1c2421;color:#f7f3ea;padding:8px 16px;font-size:13px}
.review b{color:var(--gold2)}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}
.lart{background:radial-gradient(circle at 30% 20%,#23654b,var(--green2));color:var(--ivory);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;text-align:center;border-right:4px solid var(--gold)}
.mark{font-family:"Cinzel",Georgia,serif;font-size:42px;letter-spacing:.16em;color:var(--gold2);line-height:1.15}
.ltag{max-width:28rem;margin-top:14px;font-size:18px}
.lbox{display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.lform{width:min(420px,100%);display:grid;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:#3d4a45}
.err{color:#a3231a;font-weight:700;min-height:1.2em;font-size:13px}
.demo{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.demo button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.demo button:hover{border-color:var(--gold)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 36px)}
.nav{background:var(--green2);color:#f7f3ea;padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.navbrand{display:flex;align-items:center;gap:8px;padding:6px 10px 14px}
.navbrand img{width:36px;height:36px;border-radius:8px;box-shadow:0 0 0 1.5px rgba(226,180,90,.7)}
.navbrand b{font-family:"Cinzel",Georgia,serif;letter-spacing:.12em;color:var(--gold2);font-size:14px;line-height:1.2}
.logo{width:168px;height:168px;border-radius:28px;box-shadow:0 0 0 3px rgba(226,180,90,.75)}
.marksm{width:42px;height:42px;border-radius:10px;box-shadow:0 0 0 1.5px rgba(200,148,45,.7);flex:none}
.nav button{background:transparent;color:#f7f3ea;border:0;text-align:left;border-radius:8px;padding:9px 10px;font-weight:600}
.nav button.on,.nav button:hover{background:rgba(255,255,255,.08)}
.main{padding:16px 18px 40px;max-width:1100px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.credits{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:grid;gap:10px}
.stat{font-size:32px;font-weight:700;color:var(--green)}
.frame{position:relative;background:#10241c;border-radius:12px;overflow:hidden;aspect-ratio:1;display:grid;place-items:center}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.capbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;background:linear-gradient(transparent,rgba(12,24,20,.82));color:#fff;font-weight:700}
.ai{position:absolute;top:8px;left:8px;background:#fff;color:var(--ink);border-radius:99px;padding:2px 8px;font-size:12px;font-weight:700}
.vframe{width:min(100%,240px);aspect-ratio:9/16;background:#10241c;border-radius:16px;overflow:hidden;position:relative;margin:0 auto}
.vframe img{width:100%;height:100%;object-fit:cover;display:block}
.vframe.play img{animation:drift var(--dur,4s) linear forwards}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.12) translate3d(-3%,-2%,0)}}
@media (prefers-reduced-motion:reduce){.vframe.play img{animation:none}}
.phone{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:280px;display:flex;flex-direction:column}
.phh{padding:8px 10px;font-weight:700;background:#f6f1e6;border-bottom:1px solid var(--line)}
.phb{padding:10px;display:grid;gap:8px}
.bubble{background:#d9f5df;border-radius:12px;padding:8px 10px;white-space:pre-wrap}
pre.copy{white-space:pre-wrap;font:inherit;margin:0}
table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut)}
#modal[hidden]{display:none}#modal{position:fixed;inset:0;background:rgba(16,32,28,.48);display:flex;align-items:center;justify-content:center;padding:18px;z-index:40}
.dialog{background:#fff;border-radius:14px;width:min(460px,100%);padding:18px;border-top:4px solid var(--gold);display:grid;gap:10px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(12px);background:#1c2421;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:60;max-width:92vw;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
.calhead{display:flex;align-items:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--mut);font-weight:700;padding:4px 0}
.day{min-height:92px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:3px;color:inherit;min-width:0;overflow:hidden}
.day:hover{border-color:var(--gold)}
.day .n{font-size:12px;font-weight:700}
.day.pad{visibility:hidden}
.day.today{box-shadow:inset 0 0 0 2px var(--gold)}
.chip{border:0;border-radius:6px;background:#e7f2ec;color:#0f3627;font-size:11px;font-weight:700;padding:2px 4px;text-align:left;width:100%;overflow:hidden}
.chip.post{background:#fff1c9;color:#7a5800}
textarea{resize:vertical;min-height:72px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px}
.pst{font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px}
.pst.on{background:#d8f3e4;color:#146c3a}.pst.off{background:#f6e3c2;color:#8b5e3c}
.bar{height:6px;background:#eee7d8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:88px}
.bars i{display:block;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}
@media (max-width:800px){
  .login,.shell,.grid2,.grid3,.form2,.pgrid{grid-template-columns:1fr}
  .lart{border-right:0;border-bottom:4px solid var(--gold);padding:28px 18px}
  .mark{font-size:32px}
  .shell{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow:auto;padding:8px}
  .navbrand b{display:none}
  .day{min-height:64px}
  .nav button{white-space:nowrap}
  .main{padding:12px}
}
</style>
</head>

function offerBy(id){return offers().find(o=>o.id===id)}
function currentOffer(){return offerBy(ui.offerId)||offers()[0]||null}
function balOf(h){let n=0;(h.ledger||[]).forEach(r=>{if(r.t==='grant'||r.t==='refund')n+=r.amount;if(r.t==='consume')n-=r.amount});return n}
function bal(){return balOf(H())}
function charge(amount,reason,key){
  const h=H();
  if(h.ledger.some(r=>r.key===key))return {ok:true,dup:true,bal:balOf(h)};
  if(balOf(h)<amount)return {ok:false,bal:balOf(h)};
  h.ledger.push({t:'consume',amount,reason,key,at:Date.now()});
  save();
  return {ok:true,dup:false,bal:balOf(h)};
}
function refund(key){
  const h=H();
  const hit=h.ledger.find(r=>r.t==='consume'&&r.key===key);
  if(!hit)return;
  if(h.ledger.some(r=>r.t==='refund'&&r.ref===key))return;
  h.ledger.push({t:'refund',amount:hit.amount,reason:'Returned: '+hit.reason,key:'refund-'+key,ref:key,at:Date.now()});
  save();
}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function ensureMonth(){
  const h=H();if(!h)return;
  const m=monthKey(new Date());
  if(h.ledger.some(r=>r.key==='grant-'+m))return;
  h.ledger.push({t:'grant',amount:300,reason:'Monthly credits for '+m,key:'grant-'+m,at:Date.now()});
  save();
}
function fmtDay(iso,lang){
  const d=new Date(iso+'T00:00:00');
  if(Number.isNaN(d.getTime()))return iso;
  if(lang==='th')return d.getDate()+' '+THM[d.getMonth()]+' '+(d.getFullYear()+543);
  return d.getDate()+' '+ENM[d.getMonth()]+' '+d.getFullYear();
}
function fmtRange(a,b,lang){if(a===b)return fmtDay(a,lang);return fmtDay(a,lang)+' – '+fmtDay(b,lang)}
function clean(text,dont){
  String(dont||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(w=>{
    text=text.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),'').replace(/[ ]{2,}/g,' ');
  });
  return text.trim();
}
function captionEn(o,h){return clean([o.title,o.sold+' — '+o.price,fmtRange(o.from,o.to,'en'),h.name+' in '+h.city+'.','Book: '+o.link].join('\n'),h.dont)}
function captionTh(o,h){
  const lines=[o.titleTh||o.title,(o.soldTh||o.sold)+' — '+o.price,fmtRange(o.from,o.to,'th'),h.name+' '+h.city];

function bufferText(o, service){
  const s=String(service||'').toLowerCase();
  if(s.indexOf('instagram')>=0)return netText(o,'ig');
  if(s.indexOf('facebook')>=0)return netText(o,'fb');
  return netText(o,'fb');
}
let bufferCheck=0;
let bufferKnown=false;
let bufferPainted=false;
let linkedChannels=[];
async function refreshBuffer(){
  const el=document.getElementById('bufferStatus');
  if(!el)return;
  const n=++bufferCheck;
  let data;
  try{
    const res=await fetch('/api/buffer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'status'})});
    data=await res.json();
  }catch(e){
    if(n!==bufferCheck)return;
    bufferKnown=true;
    linkedChannels=[];
    el.textContent='This link is the public preview. The Buffer key stays on the Maha Reach server, so this page cannot add a post to the queue.';
    paintSchedule();
    return;
  }
  if(n!==bufferCheck)return;
  bufferKnown=true;
  if(!data.connected){linkedChannels=[];el.textContent=data.message||'Buffer is not connected on this server.';paintSchedule();return}
  const channels=data.channels||[];
  linkedChannels=channels;
  const org=data.organization||'your Buffer account';
  if(!channels.length){
    el.textContent='Buffer is connected to “'+org+'”. No channel is connected yet. In Buffer, connect Facebook or Instagram, then open Maha Reach again. A draft will auto-post on its calendar date after a channel is linked. LINE is not a Buffer channel.';
    paintSchedule();
    return;
  }
  el.textContent='Buffer is connected to “'+org+'”. A draft with a caption auto-posts on its calendar date. That uses 0 Maha Reach credits.';
  const box=document.getElementById('bufferChannels');
  const o=ui.view==='studio'?currentOffer():null;
  if(!box||!o)return;
  paintSchedule();
  box.innerHTML=channels.map(c=>{
    const done=o.buffer&&o.buffer[c.id];
    const ready=!!bufferText(o,c.service);
    return `<div class="row"><b>${esc(c.displayName||c.name)}</b><span class="pill">${esc(c.service)}</span>${c.paused?'<span class="pill wait">Queue paused</span>':''}<span class="sp"></span><button class="btn sm" type="button" data-act="buffer-queue" data-id="${esc(c.id)}" data-service="${esc(c.service)}" data-name="${esc(c.displayName||c.name)}" ${ready?'':'disabled'}>${done?'In the Buffer queue':'Add to Buffer queue'}</button></div>`;
  }).join('');
}
function askBuffer(channelId,name,service){
  const o=currentOffer();
  const text=bufferText(o,service);
  const box=document.getElementById('modal');
  box.hidden=false;
  box.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><h2>Add to Buffer</h2><p id="confirmText">Add this approved post to ${esc(name)}. Maha Reach credits used: 0. Leave the time empty and Buffer uses the next open slot.</p>
  <label class="f">Publish at, optional<input id="bufferWhen" type="datetime-local"></label>
  <div class="row"><button class="btn" type="button" id="bufferGo">Add to queue</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></div>`;
  document.getElementById('bufferGo').onclick=async()=>{
    const btn=document.getElementById('bufferGo');
    btn.disabled=true;
    const raw=document.getElementById('bufferWhen').value;
    let dueAt='';
    if(raw){
      const when=new Date(raw);
      if(Number.isNaN(when.getTime())||when.getTime()<Date.now()+60000){btn.disabled=false;toast('Choose a time at least a minute from now, or leave it empty.');return}
      dueAt=when.toISOString();
    }
    try{
      const res=await fetch('/api/buffer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'queue',channelId,text,dueAt})});
      const data=await res.json();
      if(!data.ok){closeModal();toast(data.message||'Buffer did not take the post.');return}
      o.buffer=o.buffer||{};
      o.buffer[channelId]={id:data.id||'',dueAt:data.dueAt||dueAt,at:Date.now()};
      const s=String(service||'').toLowerCase();
      if(s.indexOf('facebook')>=0)o.posted.fb=true;
      if(s.indexOf('instagram')>=0)o.posted.ig=true;
      save();closeModal();toast('Added to the Buffer queue. 0 credits used.');render();
    }catch(err){closeModal();toast('Buffer could not be reached.');}
  };
}
function hotelOf(id){return S.hotels.find(h=>h.id===id)||null}
function channelName(id){return {fb:'Facebook',ig:'Instagram',line:'LINE'}[id]||id}
function withUtm(raw,o,channel){
  const base=String(raw||'').trim();
  if(!base)return '';
  const hash=base.split('#');
  const parts=hash[0].split('?');
  const p=new URLSearchParams(parts[1]||'');
  p.set('utm_source','maha-reach');
  p.set('utm_medium',channel||'post');
  p.set('utm_campaign',o.id);
  p.set('utm_content',o.hotelId);
  return parts[0]+'?'+p.toString()+(hash[1]?'#'+hash[1]:'');
}
function destination(o,channel){
  const h=hotelOf(o.hotelId);
  return withUtm((h&&h.bookUrl)||o.link||'',o,channel);
}
function trackerHref(o,channel){
  return location.href.split('#')[0]+'#go/'+encodeURIComponent(o.hotelId)+'/'+encodeURIComponent(o.id)+'/'+channel;
}
function netText(o,net){
  const cap=[o.captions.en,o.captions.th,o.hashtags.en,o.hashtags.th].filter(Boolean).join('\n\n');
  if(!cap)return '';
  return cap+'\n'+trackerHref(o,net);
}

function monthOf(iso){
  const d=iso?new Date(iso+'T00:00:00'):new Date();
  if(Number.isNaN(d.getTime())){const n=new Date();return {y:n.getFullYear(),m:n.getMonth()+1}}
  return {y:d.getFullYear(),m:d.getMonth()+1};
}
function monthMatrix(y,m){
  const first=new Date(y,m-1,1);
  const lead=(first.getDay()+6)%7;
  const days=new Date(y,m,0).getDate();
  const cells=Array(lead).fill(null);
  for(let d=1;d<=days;d++)cells.push(d);
  while(cells.length%7)cells.push(null);
  return cells;
}
function dayOffers(iso){
  return offers().filter(o=>o.from&&o.to&&iso>=o.from&&iso<=o.to||(o.postOn||o.from)===iso);

function paintSchedule(){
  const note=document.getElementById('autoNote');
  const o=currentOffer();
  if(note&&o)note.textContent=scheduleLabel(o);
  if(linkedChannels.length)syncSchedule();
  if(ui.view==='calendar'&&!bufferPainted){bufferPainted=true;render();return}
  bufferPainted=true;
}
let scheduling=false;
async function syncSchedule(){
  if(scheduling||!linkedChannels.length)return;
  scheduling=true;
  try{
    let changed=false;
    for(const o of offers()){
      const caption=[o.captions&&o.captions.en,o.captions&&o.captions.th].filter(Boolean).join('\n\n');
      if(!caption||!o.postOn)continue;
      const key=o.postOn+'T'+(o.postAt||'09:00');
      if(o.auto&&o.auto.key===key&&(o.auto.state==='queued'||o.auto.state==='passed'))continue;
      const due=new Date(o.postOn+'T'+(o.postAt||'09:00'));
      if(Number.isNaN(due.getTime())||due.getTime()<Date.now()+60000){
        o.auto={state:'passed',key,at:Date.now()};changed=true;continue;
      }
      let n=0;
      o.buffer=o.buffer||{};
      for(const c of linkedChannels){
        if(o.buffer[c.id]&&o.buffer[c.id].key===key){n++;continue}
        const res=await fetch('/api/buffer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'queue',channelId:c.id,text:bufferText(o,c.service),dueAt:due.toISOString()})});
        const data=await res.json();
        if(!data.ok)continue;
        o.buffer[c.id]={id:data.id||'',dueAt:data.dueAt||'',key,at:Date.now()};
        const s=String(c.service||'').toLowerCase();
        if(s.indexOf('facebook')>=0)o.posted.fb=true;
        if(s.indexOf('instagram')>=0)o.posted.ig=true;
        n++;
      }
      o.auto={state:n?'queued':'waiting',key,at:Date.now()};
      changed=true;
    }
    if(changed)save();
  }finally{scheduling=false}
}
function scheduleLabel(o){
  const caption=o.captions&&(o.captions.en||o.captions.th);
  if(!caption)return 'Write a caption. Then this date can auto-post.';
  if(!bufferKnown)return 'Checking linked channels…';
  if(o.auto&&o.auto.state==='queued')return 'Queued for the linked channels.';
  if(o.auto&&o.auto.state==='passed')return 'That time has passed. Choose a later date.';
  if(!linkedChannels.length)return 'Waiting for a linked channel. Connect Facebook or Instagram in Buffer.';
  return 'Ready for the linked channels.';
}

function sendGa(h,o,channel){

  window.dataLayer=window.dataLayer||[];
  window.gtag=window.gtag||function(){window.dataLayer.push(arguments)};
  if(!document.querySelector('script[data-ga="'+id+'"]')){
    const s=document.createElement('script');
    s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(id);s.dataset.ga=id;
    document.head.appendChild(s);
    window.gtag('js',new Date());
    window.gtag('config',id,{send_page_view:false});
  }
  window.gtag('event','book_click',{send_to:id,hotel:h.id,offer:o.id,channel:channel});
}

}
function refineTags(text,h){
  let t=clean(String(text||''),h.dont).replace(/[ \t]{2,}/g,' ').trim();
  if(!t)return '';
  if(t.indexOf('#')>=0)return t;
  return t.split(/[^A-Za-z0-9\u0E00-\u0E7F]+/).filter(w=>w.length>1).slice(0,8).map(w=>'#'+w).join(' ');
}
function ask(kind){
  const o=readStudio();
  if(!o)return;
  if((kind==='en'||kind==='th'||kind==='hash')){
    const raw=kind==='en'?o.captions.en:kind==='th'?o.captions.th:(o.hashtags.en||o.hashtags.th);
    if(!String(raw||'').trim()){toast('Write it first. AI only refines your words.');return}
  }
  if(kind==='pic'||kind==='sharp'){
    if(!String(o.picturePrompt||'').trim()){toast('Write the prompt for the picture first.');return}
  }
  const cost=COST[kind], have=bal(), left=have-cost, enough=have>=cost;
  const box=document.getElementById('modal');
  const note=kind==='v4'||kind==='v8'?' This review moves the hotel photo. Gemini Omni Flash makes the live clip from that photo when the key is on the server.':'';
  const picNote=(kind==='pic'||kind==='sharp')?' Your prompt is the instruction. The price and the dates stay on top of the picture.':'';
  const line=enough
    ?('This '+LABEL[kind]+' uses '+money(cost)+'. '+have+' remain now. '+left+' will remain.'+note+picNote)
    :('This '+LABEL[kind]+' needs '+money(cost)+'. You have '+have+'.'+note+picNote);
  box.hidden=false;
  box.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><h2>Confirm</h2><p id="confirmText">${esc(line)}</p>
  <div class="row"><button class="btn" type="button" id="confirmOk" ${enough?'':'disabled'}>Continue</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></div>`;
  const ok=document.getElementById('confirmOk');
  if(ok)ok.onclick=()=>runGen(kind);
}
function runGen(kind){
  const btn=document.getElementById('confirmOk');
  if(btn)btn.disabled=true;
  const o=currentOffer();
  if(!o){closeModal();return}
  const key=kind+':'+o.id+':'+Date.now();
  const res=charge(COST[kind],LABEL[kind],key);
  closeModal();
  if(!res.ok){toast('Not enough credits.');render();return}
  if(res.dup){toast('That request was already charged.');render();return}
  const h=H();
  const finish=()=>{save();render();toast(LABEL[kind]+' used '+COST[kind]+' credits. '+bal()+' remain.');};
  const fail=()=>{refund(key);save();render();toast('That call failed. The credits were returned.');};
  try{
    if(kind==='en'||kind==='th'||kind==='hash'){
      if(kind==='en')o.captions.en=refineCaption(o.captions.en,h);
      if(kind==='th')o.captions.th=refineCaption(o.captions.th,h);
      if(kind==='hash'){o.hashtags.en=refineTags(o.hashtags.en,h);o.hashtags.th=refineTags(o.hashtags.th,h)}
      const empty=kind==='hash'?(!o.hashtags.en&&!o.hashtags.th):(kind==='en'?!o.captions.en:!o.captions.th);
      if(empty){refund(key);save();render();toast('Those words are on the do-not-say list. The credit was returned.');return}
      finish();return;
    }
    if(kind==='v4'||kind==='v8'){
      o.video={seconds:kind==='v4'?4:8,at:Date.now()};
      finish();
      requestAnimationFrame(()=>{const f=document.getElementById('videoFrame');if(f)f.classList.add('play')});
      return;
    }
    if(kind==='pic'||kind==='sharp'){
      const prompt=String(o.picturePrompt||'').trim();
      if(!prompt){refund(key);save();render();toast('Write the prompt for the picture first. The credit was returned.');return}
      makePicture(h,kind==='sharp',prompt).then(out=>{o.picture=out;finish()}).catch(fail);
      return;
    }
    fail();
  }catch(e){fail()}
}
function makePicture(h,sharp,prompt){
  const url=photoUrl(h);
  const size=sharp?1280:1024;
  return new Promise((resolve,reject)=>{
    const canvas=document.createElement('canvas');
    canvas.width=size;canvas.height=size;
    const ctx=canvas.getContext('2d');
    const done=()=>{resolve({url:canvas.toDataURL('image/jpeg',0.86),ai:true,sharp,prompt})};
    if(!url){paintScene(ctx,size,prompt);done();return}
    const img=new Image();
    img.onload=()=>{
      const scale=Math.max(size/img.width,size/img.height);
      const w=img.width*scale,hh=img.height*scale;
      ctx.drawImage(img,(size-w)/2,(size-hh)/2,w,hh);
      const wash=ctx.createLinearGradient(0,size*.72,0,size);
      wash.addColorStop(0,'rgba(16,36,28,0)');
      wash.addColorStop(1,sceneTone(prompt));
      ctx.fillStyle=wash;ctx.fillRect(0,size*.72,size,size*.28);
      done();
    };
    img.onerror=()=>reject(new Error('photo'));
    img.src=url;
  });
}
function sceneTone(prompt){
  const p=String(prompt||'').toLowerCase();
  if(/garden|สวน|lunch|green/.test(p))return 'rgba(80,120,60,.45)';
  if(/night|gold|temple|วัด/.test(p))return 'rgba(80,60,20,.45)';
  return 'rgba(20,50,70,.4)';
}
function paintScene(ctx,size,prompt){
  const p=String(prompt||'').toLowerCase();
  const g=ctx.createLinearGradient(0,0,0,size);
  if(/garden|สวน|lunch|green/.test(p)){g.addColorStop(0,'#d7e6c8');g.addColorStop(1,'#6e9a55')}
  else if(/night|gold|temple|วัด/.test(p)){g.addColorStop(0,'#10241c');g.addColorStop(1,'#c8942d')}
  else {g.addColorStop(0,'#16344a');g.addColorStop(.55,'#e08a55');g.addColorStop(1,'#f3d7a1')}
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#1b3a32';ctx.fillRect(size*.08,size*.58,size*.28,size*.2);
  ctx.fillStyle='#184d3a';ctx.beginPath();ctx.moveTo(size*.05,size*.58);ctx.lineTo(size*.22,size*.4);ctx.lineTo(size*.4,size*.58);ctx.fill();
  ctx.fillStyle='#2c5a66';ctx.fillRect(0,size*.72,size,size*.28);
}
function readOffer(form){
  const g=n=>String(new FormData(form).get(n)||'').trim();
  let from=g('from'),to=g('to');
  if(from&&to&&from>to){const s=from;from=to;to=s}
  return {id:g('id'),title:g('title'),titleTh:g('titleTh'),sold:g('sold'),soldTh:g('soldTh'),price:g('price'),from,to,link:g('link')};
}
function saveOffer(form){
  const v=readOffer(form);
  const err=document.getElementById('offerErr');
  if(!v.title||!v.sold||!v.price||!v.from||!v.to||!v.link){err.textContent='Fill the title, what is sold, the price, the dates, and the link.';return}
  const h=H();
  if(v.id){
    const o=offerBy(v.id);if(!o)return;
    const follow=!o.postOn||o.postOn===o.from;
    Object.assign(o,v);
    if(follow)o.postOn=o.from;
  }else{
    const o=offer('off-'+Date.now(),h.id,v.title,v.titleTh,v.sold,v.soldTh,v.price,v.from,v.to,v.link);
    h.offers.unshift(o);ui.offerId=o.id;ui.editing=o.id;
  }
  save();toast('Offer saved. No credits used.');render();
}
function saveBrand(form){
  const g=n=>String(new FormData(form).get(n)||'').trim();
  const h=H();h.name=g('name')||h.name;h.city=g('city')||h.city;h.voice=g('voice');h.dont=g('dont');
  save();toast('Brand saved.');render();
}
function onUpload(file){
  if(!file)return;
  if(file.size>4e6){toast('Choose a photo under 4 MB.');return}
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const s=Math.min(1,1200/Math.max(img.width,img.height));
      c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const h=H();const id='ph-'+Date.now();
      const url=c.toDataURL('image/jpeg',0.85);
      h.library.push({id,name:file.name||'Upload',url});
      h.photoId=id;
      const o=currentOffer();
      if(o)o.picture={url,ai:false,sharp:false,prompt:''};
      save();toast('Photo added.');render();
    };
    img.onerror=()=>toast('This image could not be read.');
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const act=b.dataset.act;
  if(act==='demo'){signIn(b.dataset.user);return}
  if(act==='provider'){signProvider();return}
  if(act==='prov-back'){leaveHotel();return}
  if(act==='enter'){enterHotel(b.dataset.id);return}
  if(act==='setup'){ui.hotelId=b.dataset.id;ui.view='setup';render();return}
  if(act==='save-book'){saveBook(b.closest('form'));return}
  if(act==='new-prop'){newProperty();return}
  if(act==='visit'){
    const o=currentOffer();
    if(!o)return;
    location.hash='go/'+encodeURIComponent(o.hotelId)+'/'+encodeURIComponent(o.id)+'/'+(b.dataset.net||'fb');
    return;
  }
  if(act==='close-go'){history.pushState(null,'',location.pathname+location.search);render();return}
  if(act==='nav'){ui.view=b.dataset.view;render();return}
  if(act==='signout'){signOut();return}
  if(act==='open'){ui.offerId=b.dataset.id;ui.view='studio';render();return}
  if(act==='edit'){ui.editing=b.dataset.id;ui.offerId=b.dataset.id;render();return}
  if(act==='new'){ui.editing='new';render();return}
  if(act==='gen'){ask(b.dataset.kind);return}
  if(act==='close'){closeModal();return}
  if(act==='play'){const f=document.getElementById('videoFrame');if(!f)return;f.classList.remove('play');void f.offsetWidth;f.classList.add('play');return}
  if(act==='save-caps'){
    const o=readStudio();
    if(!o)return;
    save();toast('Captions saved. No credits used.');return;
  }
  if(act==='schedule'){
    const o=readStudio();
    if(!o)return;
    if(!o.postOn){toast('Choose the date first.');return}
    o.auto=null;
    save();
    render();
    toast(o.captions.en||o.captions.th?'This draft will auto-post on '+fmtDay(o.postOn,'en')+' at '+(o.postAt||'09:00')+'. 0 credits used.':'Date saved. Write a caption before it can post.');
    return;
  }
  if(act==='cal-move'){
    const cur=ui.cal||monthOf();
    const d=new Date(cur.y,cur.m-1+Number(b.dataset.dir),1);
    ui.cal={y:d.getFullYear(),m:d.getMonth()+1};
    render();return;
  }
  if(act==='cal-day'){openDay(b.dataset.date);return}
  if(act==='approve'){
    if(!me().canApprove){toast('The provider has not allowed this sign-in to approve.');return}
    const o=readStudio()||currentOffer();
    if(!o.captions.en||!o.captions.th){toast('Write the Thai and English captions first.');return}
    o.status='approved';o.approvedBy=me().name;o.approvedAt=Date.now();
    save();toast('Approved. No credits used.');render();return;
  }
  if(act==='copy'){
    const o=readStudio()||currentOffer();const text=netText(o,b.dataset.net);
    if(!text)return;
    const done=()=>toast('Copied. No credits used.');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done).catch(()=>{fallbackCopy(text);done()});
    else {fallbackCopy(text);done()}
    return;
  }
  if(act==='buffer-queue'){
    const o=readStudio()||currentOffer();
    if(!o)return;
    if(!bufferText(o,b.dataset.service)){toast('Write the captions first.');return}
    askBuffer(b.dataset.id,b.dataset.name||'that channel',b.dataset.service||'');
    return;
  }
  if(act==='posted'){
    const o=readStudio()||currentOffer();
    if(!netText(o,b.dataset.net)){toast('Write the captions first.');return}
    o.posted[b.dataset.net]=true;save();toast('Marked as posted. No credits used.');render();return;
  }
  if(act==='photo'){H().photoId=b.dataset.id;save();toast('Photo selected.');render();return}
  if(act==='save-offer'){saveOffer(b.closest('form'));return}
  if(act==='save-brand'){saveBrand(b.closest('form'));return}
  if(act==='reset'){localStorage.removeItem(KEY);S=seed();save();ui.offerId=null;toast('Review data reset.');render()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='offerPick'){ui.offerId=e.target.value;render()}
  if(e.target.id==='up'||e.target.id==='upStudio'){onUpload(e.target.files&&e.target.files[0])}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='loginForm'){
    e.preventDefault();
    const fd=new FormData(e.target);
    const u=S.users.find(x=>x.user===String(fd.get('user')||'').trim()&&x.pass===String(fd.get('pass')||''));
    if(!u){document.getElementById('loginErr').textContent='That sign-in does not match.';return}
    signIn(u.id);return;
  }
  if(e.target.id==='offerForm')saveOffer(e.target);
  if(e.target.id==='brandForm')saveBrand(e.target);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',()=>render());
function fallbackCopy(text){
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy')}catch(err){}
  ta.remove();
}
render();
</script>
