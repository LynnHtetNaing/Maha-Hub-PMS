<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Maha Reach — One place for the hotel’s public message.</title>
<meta name="description" content="One place for the hotel’s public message.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#184D3A;--green2:#0F3627;--gold:#C8942D;--gold2:#E2B45A;--ivory:#F7F3EA;--ink:#1c2421;--mut:#5d6b66;--line:#e2d9c8;--card:#fff;--bg:#f3efe6}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.45 "Noto Sans","Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
input,select,textarea{border:1px solid #d5cbb8;border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0}h1{font-family:"Cinzel",Georgia,serif;font-size:28px;letter-spacing:.04em}h2{font-size:20px}h3{font-size:16px}
.mut{color:var(--mut);font-size:13px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}
.btn{background:var(--green);color:#fff;border:1px solid var(--green);border-radius:8px;padding:8px 14px;font-weight:700}
.btn:hover{background:#12402f}.btn.gold{background:var(--gold);border-color:#a87a1e;color:#1e1606}.btn.ghost{background:#fff;color:var(--green);border-color:#b7c9bf}
.btn.sm{padding:5px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#eee7d8}
.pill.wait{background:#fff1c9;color:#7a5800}.pill.ok{background:#d8f3e4;color:#146c3a}.pill.post{background:#d7e7f8;color:#1a4f86}
.review{background:#1c2421;color:#f7f3ea;padding:8px 16px;font-size:13px}
.review b{color:var(--gold2)}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}
.lart{background:radial-gradient(circle at 30% 20%,#23654b,var(--green2));color:var(--ivory);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;text-align:center;border-right:4px solid var(--gold)}
.mark{font-family:"Cinzel",Georgia,serif;font-size:42px;letter-spacing:.16em;color:var(--gold2);line-height:1.15}
.ltag{max-width:28rem;margin-top:14px;font-size:18px}
.lbox{display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.lform{width:min(420px,100%);display:grid;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:#3d4a45}
.err{color:#a3231a;font-weight:700;min-height:1.2em;font-size:13px}
.demo{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.demo button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.demo button:hover{border-color:var(--gold)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 36px)}
.nav{background:var(--green2);color:#f7f3ea;padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.nav .brand{font-family:"Cinzel",Georgia,serif;letter-spacing:.14em;color:var(--gold2);padding:6px 10px 14px;font-size:18px}
.nav button{background:transparent;color:#f7f3ea;border:0;text-align:left;border-radius:8px;padding:9px 10px;font-weight:600}
.nav button.on,.nav button:hover{background:rgba(255,255,255,.08)}
.main{padding:16px 18px 40px;max-width:1100px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.credits{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:grid;gap:10px}
.stat{font-size:32px;font-weight:700;color:var(--green)}
.frame{position:relative;background:#10241c;border-radius:12px;overflow:hidden;aspect-ratio:1;display:grid;place-items:center}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.capbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;background:linear-gradient(transparent,rgba(12,24,20,.82));color:#fff;font-weight:700}
.ai{position:absolute;top:8px;left:8px;background:#fff;color:var(--ink);border-radius:99px;padding:2px 8px;font-size:12px;font-weight:700}
.vframe{width:min(100%,240px);aspect-ratio:9/16;background:#10241c;border-radius:16px;overflow:hidden;position:relative;margin:0 auto}
.vframe img{width:100%;height:100%;object-fit:cover;display:block}
.vframe.play img{animation:drift var(--dur,4s) linear forwards}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.12) translate3d(-3%,-2%,0)}}
@media (prefers-reduced-motion:reduce){.vframe.play img{animation:none}}
.phone{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:280px;display:flex;flex-direction:column}
.phh{padding:8px 10px;font-weight:700;background:#f6f1e6;border-bottom:1px solid var(--line)}
.phb{padding:10px;display:grid;gap:8px}
.bubble{background:#d9f5df;border-radius:12px;padding:8px 10px;white-space:pre-wrap}
pre.copy{white-space:pre-wrap;font:inherit;margin:0}
table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut)}
#modal[hidden]{display:none}#modal{position:fixed;inset:0;background:rgba(16,32,28,.48);display:flex;align-items:center;justify-content:center;padding:18px;z-index:40}
.dialog{background:#fff;border-radius:14px;width:min(460px,100%);padding:18px;border-top:4px solid var(--gold);display:grid;gap:10px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(12px);background:#1c2421;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:60;max-width:92vw;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:800px){
  .login,.shell,.grid2,.grid3,.form2{grid-template-columns:1fr}
  .lart{border-right:0;border-bottom:4px solid var(--gold);padding:28px 18px}
  .mark{font-size:32px}
  .shell{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow:auto;padding:8px}
  .nav .brand{display:none}
  .nav button{white-space:nowrap}
  .main{padding:12px}
}
</style>
</head>
<body>
<div class="review"><b>Review build.</b> Walk the offer, the Thai and English drafts, the picture, the short video, and approval. Records stay in this browser. The paid Gemini call connects on the server later. The price and dates are drawn on top of the photo.</div>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>
<script>
'use strict';
const KEY='mahareach.review.1';
const COST={en:1,th:1,hash:1,pic:10,sharp:20,bare:10,v4:120,v8:240};
const LABEL={en:'English caption',th:'Thai caption',hash:'hashtag set',pic:'default picture',sharp:'sharper picture',bare:'picture with no hotel photo',v4:'4-second video',v8:'8-second video'};
const THM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const ENM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function svgUri(body){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">${body}</svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
const PHOTO={
  terrace:svgUri(`<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16344a"/><stop offset=".5" stop-color="#e08a55"/><stop offset=".8" stop-color="#f3d7a1"/></linearGradient><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c5a66"/><stop offset="1" stop-color="#102830"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#s)"/><circle cx="780" cy="230" r="64" fill="#ffe1a8"/><rect y="640" width="1080" height="440" fill="url(#w)"/><rect x="80" y="500" width="250" height="180" fill="#1b3a32"/><polygon points="60,500 205,360 350,500" fill="#184d3a"/><rect x="160" y="560" width="46" height="120" fill="#f6f1e6"/><rect x="560" y="360" width="360" height="310" rx="4" fill="#f4efe4"/><g fill="#1e3d4a"><rect x="590" y="400" width="78" height="100"/><rect x="700" y="400" width="78" height="100"/><rect x="810" y="400" width="78" height="100"/><rect x="590" y="530" width="78" height="100"/><rect x="700" y="530" width="78" height="100"/></g><rect x="810" y="530" width="78" height="100" fill="#c8942d"/>`),
  garden:svgUri(`<rect width="1080" height="1080" fill="#d7e6c8"/><circle cx="180" cy="220" r="90" fill="#7ea35a"/><circle cx="300" cy="180" r="70" fill="#5e8a48"/><rect x="240" y="430" width="600" height="28" fill="#f7f3ea"/><rect x="270" y="458" width="22" height="160" fill="#8b5e3c"/><rect x="790" y="458" width="22" height="160" fill="#8b5e3c"/><circle cx="820" cy="160" r="50" fill="#f2d48a"/><rect y="760" width="1080" height="320" fill="#6e9a55"/>`)
};

function seed(){
  const m=monthKey(new Date());
  const grant=mm=>[{t:'grant',amount:300,reason:'Monthly credits for '+mm,key:'grant-'+mm,at:Date.now()}];
  return {
    users:[
      {id:'niran',name:'Niran',user:'niran',pass:'draft123',hotelId:'lotus',canApprove:false},
      {id:'mali',name:'Mali',user:'mali',pass:'approve123',hotelId:'lotus',canApprove:true},
      {id:'som',name:'Som',user:'som',pass:'draft123',hotelId:'bansuan',canApprove:false}
    ],
    hotels:[
      hotel('lotus','Lotus Riverside','Bangkok','Calm and specific.','cheap, ถูกที่สุด','ph-terrace',grant(m),[
        {id:'ph-terrace',name:'Terrace at dusk',url:PHOTO.terrace}
      ],offer('off-lotus','lotus','River Suite weekend','ชุดห้องริมแม่น้ำสุดสัปดาห์','Deluxe river suite, breakfast for two','ห้องสวีทริมแม่น้ำ พร้อมอาหารเช้าสองท่าน','4,900 THB','2026-10-10','2026-10-12','https://lotus.example/river-suite')),
      hotel('bansuan','Ban Suan','Chiang Mai','Warm and plain.','cheap, ถูกที่สุด','ph-garden',grant(m),[
        {id:'ph-garden',name:'Garden table',url:PHOTO.garden}
      ],offer('off-suan','bansuan','Garden lunch for two','อาหารกลางวันในสวนสำหรับสองท่าน','A table in the garden, two set lunches','โต๊ะในสวน พร้อมชุดอาหารกลางวันสองที่','890 THB','2026-10-18','2026-10-18','https://bansuan.example/lunch'))
    ]
  };
}
function hotel(id,name,city,voice,dont,photoId,ledger,library,off){
  return {id,name,city,voice,dont,photoId,ledger,library,offers:[off]};
}
function offer(id,hotelId,title,titleTh,sold,soldTh,price,from,to,link){
  return {id,hotelId,title,titleTh,sold,soldTh,price,from,to,link,status:'draft',captions:{en:'',th:''},hashtags:{en:'',th:''},picture:null,video:null,posted:{fb:false,ig:false,line:false},approvedBy:'',approvedAt:0};
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw)}catch(e){}
  const s=seed();localStorage.setItem(KEY,JSON.stringify(s));return s;
}
let S=load();
let session=null;
try{session=JSON.parse(sessionStorage.getItem('mahareach.who')||'null')}catch(e){session=null}
let ui={view:'home',offerId:null};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function me(){return session&&S.users.find(u=>u.id===session.userId)}
function H(){const u=me();return u&&S.hotels.find(h=>h.id===u.hotelId)}
function offers(){const h=H();return h?h.offers:[]}
function offerBy(id){return offers().find(o=>o.id===id)}
function currentOffer(){return offerBy(ui.offerId)||offers()[0]||null}
function balOf(h){let n=0;(h.ledger||[]).forEach(r=>{if(r.t==='grant'||r.t==='refund')n+=r.amount;if(r.t==='consume')n-=r.amount});return n}
function bal(){return balOf(H())}
function charge(amount,reason,key){
  const h=H();
  if(h.ledger.some(r=>r.key===key))return {ok:true,dup:true,bal:balOf(h)};
  if(balOf(h)<amount)return {ok:false,bal:balOf(h)};
  h.ledger.push({t:'consume',amount,reason,key,at:Date.now()});
  save();
  return {ok:true,dup:false,bal:balOf(h)};
}
function refund(key){
  const h=H();
  const hit=h.ledger.find(r=>r.t==='consume'&&r.key===key);
  if(!hit)return;
  if(h.ledger.some(r=>r.t==='refund'&&r.ref===key))return;
  h.ledger.push({t:'refund',amount:hit.amount,reason:'Returned: '+hit.reason,key:'refund-'+key,ref:key,at:Date.now()});
  save();
}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function ensureMonth(){
  const h=H();if(!h)return;
  const m=monthKey(new Date());
  if(h.ledger.some(r=>r.key==='grant-'+m))return;
  h.ledger.push({t:'grant',amount:300,reason:'Monthly credits for '+m,key:'grant-'+m,at:Date.now()});
  save();
}
function fmtDay(iso,lang){
  const d=new Date(iso+'T00:00:00');
  if(Number.isNaN(d.getTime()))return iso;
  if(lang==='th')return d.getDate()+' '+THM[d.getMonth()]+' '+(d.getFullYear()+543);
  return d.getDate()+' '+ENM[d.getMonth()]+' '+d.getFullYear();
}
function fmtRange(a,b,lang){if(a===b)return fmtDay(a,lang);return fmtDay(a,lang)+' – '+fmtDay(b,lang)}
function clean(text,dont){
  String(dont||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(w=>{
    text=text.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),'').replace(/[ ]{2,}/g,' ');
  });
  return text.trim();
}
function captionEn(o,h){return clean([o.title,o.sold+' — '+o.price,fmtRange(o.from,o.to,'en'),h.name+' in '+h.city+'.','Book: '+o.link].join('\n'),h.dont)}
function captionTh(o,h){
  const lines=[o.titleTh||o.title,(o.soldTh||o.sold)+' — '+o.price,fmtRange(o.from,o.to,'th'),h.name+' '+h.city];
  if(!o.titleTh&&!o.soldTh)lines.push('ข้อความนี้ใช้ภาษาที่โรงแรมพิมพ์ในข้อเสนอ');
  lines.push('จอง: '+o.link);
  return clean(lines.join('\n'),h.dont);
}
function tagsEn(o,h){
  const words=(o.title+' '+h.city).split(/[^A-Za-z0-9]+/).filter(w=>w.length>2).slice(0,3);
  return clean(words.map(w=>'#'+w).join(' ')+' #HotelOffer',h.dont);
}
function tagsTh(o,h){
  const city=h.city==='Bangkok'?' #กรุงเทพ':h.city==='Chiang Mai'?' #เชียงใหม่':'';
  return clean('#โรงแรม #ข้อเสนอ'+city,h.dont);
}
function photoUrl(h){const p=(h.library||[]).find(x=>x.id===h.photoId);return p?p.url:''}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2800)}
function closeModal(){document.getElementById('modal').hidden=true;document.getElementById('modal').innerHTML=''}
function when(at){const d=new Date(at);return d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}

function render(){
  const app=document.getElementById('app');
  if(!me()){app.innerHTML=loginHtml();return}
  ensureMonth();
  app.innerHTML=shellHtml();
}
function loginHtml(){
  return `<div class="login"><section class="lart"><div class="mark">MAHA<br>REACH</div><p class="ltag">One place for the hotel’s public message.</p><p class="mut" style="color:#e7dcc4">Thailand · Thai and English</p></section>
  <section class="lbox"><form class="card lform" id="loginForm"><h2>Sign in</h2><p class="mut">A drafter writes. Approval is on only for a person the provider has allowed.</p>
  <label class="f">User<input name="user" autocomplete="username" required></label>
  <label class="f">Password<input name="pass" type="password" autocomplete="current-password" required></label>
  <div class="err" id="loginErr"></div><button class="btn" type="submit">Sign in</button>
  <div class="demo"><span class="mut">Staff demos</span>
  <button type="button" data-act="demo" data-user="niran"><b>niran</b> · draft123 · Lotus Riverside · drafts only</button>
  <button type="button" data-act="demo" data-user="mali"><b>mali</b> · approve123 · Lotus Riverside · may approve</button>
  <button type="button" data-act="demo" data-user="som"><b>som</b> · draft123 · Ban Suan · another hotel</button>
  </div></form></section></div>`;
}
function shellHtml(){
  const u=me(),h=H(),views=[['home','Home'],['offers','Offers'],['studio','Studio'],['calendar','Calendar'],['brand','Brand'],['library','Library'],['credits','Credits'],['team','Team']];
  return `<div class="shell"><nav class="nav"><div class="brand">MAHA REACH</div>${views.map(v=>`<button type="button" data-act="nav" data-view="${v[0]}" class="${ui.view===v[0]?'on':''}">${v[1]}</button>`).join('')}</nav>
  <div class="main"><div class="top"><div><b>${esc(h.name)}</b><div class="mut">${esc(h.city)} · ${esc(u.name)}</div></div><span class="sp"></span>
  <button class="credits" type="button" data-act="nav" data-view="credits" id="bal">${bal()} credits</button>
  <button class="btn ghost sm" type="button" data-act="signout">Sign out</button></div>${viewHtml()}</div></div>`;
}
function viewHtml(){
  if(ui.view==='offers')return offersHtml();
  if(ui.view==='studio')return studioHtml();
  if(ui.view==='calendar')return calendarHtml();
  if(ui.view==='brand')return brandHtml();
  if(ui.view==='library')return libraryHtml();
  if(ui.view==='credits')return creditsHtml();
  if(ui.view==='team')return teamHtml();
  return homeHtml();
}
function homeHtml(){
  const h=H(),list=offers();
  const waiting=list.filter(o=>o.status==='draft');
  return `<div class="stack"><div class="card"><h2>What is waiting</h2><p class="stat" id="waitCount">${waiting.length}</p><p class="mut">Drafts still need approval before anyone can mark them posted.</p></div>
  <div class="grid2">${list.map(o=>`<article class="card stack"><div class="row"><h3>${esc(o.title)}</h3><span class="pill ${o.status==='approved'?'ok':'wait'}">${esc(o.status)}</span></div><p>${esc(o.sold)} · ${esc(o.price)}</p><p class="mut">${esc(fmtRange(o.from,o.to,'en'))}</p><div class="row"><button class="btn sm" type="button" data-act="open" data-id="${esc(o.id)}">Open in studio</button></div></article>`).join('')}</div>
  <div class="card"><h3>Accounts</h3><p>Facebook, Instagram, and LINE are ready to copy. A real send waits until each platform approves Maha Reach. LINE’s own fee, when a send exists, is the hotel’s bill.</p><p class="mut" id="homeHotel">${esc(h.name)} only. Another hotel’s offers are not on this screen.</p></div></div>`;
}
function offersHtml(){
  const o=currentOffer();
  const blank={id:'',title:'',titleTh:'',sold:'',soldTh:'',price:'',from:'',to:'',link:'',status:'draft'};
  const f=ui.editing==='new'?blank:(offerBy(ui.editing)||o||blank);
  return `<div class="grid2"><div class="stack"><h2>Offers</h2>${offers().map(x=>`<button class="card" type="button" data-act="edit" data-id="${esc(x.id)}" style="text-align:left"><b>${esc(x.title)}</b><div class="mut">${esc(x.price)} · ${esc(x.status)}</div></button>`).join('')}<button class="btn ghost" type="button" data-act="new">New offer</button></div>
  <form class="card stack" id="offerForm"><h2>${f.id?'Edit offer':'New offer'}</h2><input type="hidden" name="id" value="${esc(f.id)}">
  <div class="form2"><label class="f">Title<input name="title" required value="${esc(f.title)}"></label><label class="f">Title in Thai<input name="titleTh" value="${esc(f.titleTh||'')}"></label>
  <label class="f">What is being sold<input name="sold" required value="${esc(f.sold||'')}"></label><label class="f">What is being sold, in Thai<input name="soldTh" value="${esc(f.soldTh||'')}"></label>
  <label class="f">Public price<input name="price" required value="${esc(f.price||'')}"></label><label class="f">Booking link<input name="link" type="url" required value="${esc(f.link||'')}"></label>
  <label class="f">From<input name="from" type="date" required value="${esc(f.from||'')}"></label><label class="f">To<input name="to" type="date" required value="${esc(f.to||'')}"></label></div>
  <p class="mut">Public offer only. There is no field for a guest, a reservation, a folio, or a card.</p>
  <div class="err" id="offerErr"></div><button class="btn" type="button" data-act="save-offer">Save offer</button></form></div>`;
}
function studioHtml(){
  const o=currentOffer();
  if(!o)return `<div class="card"><h2>Studio</h2><p>Save an offer first.</p></div>`;
  ui.offerId=o.id;
  const h=H(),u=me();
  const pic=o.picture;
  const libraryPhoto=photoUrl(h);
  const pictureSrc=(pic&&pic.url)||libraryPhoto;
  const videoSrc=libraryPhoto||(pic&&pic.url)||'';
  return `<div class="stack"><div class="row"><h2>Studio</h2><span class="pill ${o.status==='approved'?'ok':'wait'}" id="status">${esc(o.status)}</span><span class="sp"></span>
  <label class="f">Offer<select id="offerPick" data-act="pick">${offers().map(x=>`<option value="${esc(x.id)}" ${x.id===o.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label></div>
  <div class="grid2"><div class="card stack"><h3>Captions</h3>
  <div class="mut" lang="en" id="capEn">${o.captions.en?`<pre class="copy">${esc(o.captions.en)}</pre>`:'English caption is not written yet.'}</div>
  <div lang="th" id="capTh">${o.captions.th?`<pre class="copy">${esc(o.captions.th)}</pre>`:'ยังไม่มีคำบรรยายภาษาไทย'}</div>
  <p class="mut" id="tags">${esc([o.hashtags.en,o.hashtags.th].filter(Boolean).join(' · ')||'Hashtags are not written yet.')}</p>
  <div class="row"><button class="btn sm" type="button" data-act="gen" data-kind="en">English caption · 1</button><button class="btn sm" type="button" data-act="gen" data-kind="th">Thai caption · 1</button><button class="btn ghost sm" type="button" data-act="gen" data-kind="hash">Hashtags · 1</button></div></div>
  <div class="card stack"><h3>Picture</h3><div class="frame" id="picFrame">${pictureSrc?`<img alt="Offer photograph" src="${esc(pictureSrc)}">`:'<span class="mut">Add a photo in the library.</span>'}${pic&&pic.ai?'<em class="ai">Made by AI</em>':''}${o.price?`<div class="capbar"><span>${esc(o.price)}</span><span>${esc(fmtRange(o.from,o.to,'en'))}</span></div>`:''}</div>
  <p class="mut">The price and the dates sit on top of the photo. They are not painted into it.</p>
  <div class="row"><button class="btn sm" type="button" data-act="gen" data-kind="pic">Default picture · 10</button><button class="btn ghost sm" type="button" data-act="gen" data-kind="sharp">Sharper picture · 20</button><button class="btn ghost sm" type="button" data-act="gen" data-kind="bare">No hotel photo · 10</button></div></div></div>
  <div class="card stack"><div class="row"><h3>Short video</h3><span class="mut">${o.video?esc(o.video.seconds+' seconds, vertical'):'No video yet'}</span></div>
  <div class="vframe" id="videoFrame" style="--dur:${o.video?o.video.seconds:4}s">${videoSrc?`<img alt="" src="${esc(videoSrc)}">`:''}<div class="capbar"><span>${esc(o.price)}</span><span>${o.video?esc(o.video.seconds+'s'):''}</span></div></div>
  <div class="row"><button class="btn sm" type="button" data-act="gen" data-kind="v4">4-second video · 120</button><button class="btn sm gold" type="button" data-act="gen" data-kind="v8">8-second video · 240</button><button class="btn ghost sm" type="button" data-act="play" ${o.video?'':'disabled'}>Play preview</button></div>
  <p class="mut">An 8-second video is 240 of the 300 monthly credits. The screen asks before it runs.</p></div>
  ${previewHtml(o)}
  <div class="card row"><div><b>Approval</b><div class="mut">${u.canApprove?'The provider has allowed you to approve.':'The provider has not allowed this sign-in to approve.'}</div>${o.approvedBy?`<div class="mut">Approved by ${esc(o.approvedBy)}</div>`:''}</div><span class="sp"></span>
  <button class="btn" type="button" id="approveBtn" data-act="approve" ${u.canApprove&&o.status!=='approved'?'':'disabled'}>Approve</button></div></div>`;
}
function previewHtml(o){
  const text=(net)=>netText(o,net);
  const nets=[['fb','Facebook'],['ig','Instagram'],['line','LINE']];
  return `<div class="grid3">${nets.map(([id,name])=>{
    const body=text(id);
    const blocked=o.status!=='approved';
    return `<article class="phone"><div class="phh">${name}</div><div class="phb" id="prev-${id}">${body?`<pre class="copy">${esc(body)}</pre>`:'<p class="mut">Write the captions first.</p>'}${id==='line'&&body?'':' '}
    <div class="row"><button class="btn ghost sm" type="button" data-act="copy" data-net="${id}" ${body?'':'disabled'}>Copy</button>
    <button class="btn sm" type="button" data-act="posted" data-net="${id}" ${body&&!blocked?'':'disabled'}>${o.posted[id]?'Posted':'Mark as posted'}</button></div>
    ${blocked?'<p class="mut">Approve the draft first. Mark as posted stays off.</p>':''}</div></article>`;
  }).join('')}</div>`;
}
function netText(o,net){
  const cap=[o.captions.en,o.captions.th,o.hashtags.en,o.hashtags.th].filter(Boolean).join('\n\n');
  if(!cap)return '';
  if(net==='line')return cap+'\n'+o.link;
  if(net==='ig')return cap;
  return cap+'\n'+o.link;
}
function calendarHtml(){
  const rows=offers();
  if(!rows.length)return `<div class="card"><h2>Calendar</h2><p>No offers yet.</p></div>`;
  return `<div class="stack"><h2>Calendar</h2><div class="card" style="overflow:auto"><table><thead><tr><th>Offer</th><th>Status</th><th>Dates</th><th>Posted</th></tr></thead><tbody>${rows.map(o=>{
    const nets=['fb','ig','line'].filter(n=>o.posted[n]).join(', ')||'—';
    return `<tr><td><button class="btn ghost sm" type="button" data-act="open" data-id="${esc(o.id)}">${esc(o.title)}</button></td><td><span class="pill ${o.status==='approved'?'ok':'wait'}">${esc(o.status)}</span></td><td>${esc(fmtRange(o.from,o.to,'en'))}</td><td>${esc(nets)}</td></tr>`;
  }).join('')}</tbody></table></div><p class="mut">Copy and mark as posted are the publishing steps until Meta approval. This calendar does not send the post.</p></div>`;
}
function brandHtml(){
  const h=H();
  return `<form class="card stack" id="brandForm" style="max-width:640px"><h2>Brand</h2>
  <div class="form2"><label class="f">Property<input name="name" value="${esc(h.name)}" required></label><label class="f">City<input name="city" value="${esc(h.city)}" required></label></div>
  <label class="f">Voice<textarea name="voice" rows="3">${esc(h.voice)}</textarea></label>
  <label class="f">Do not say<input name="dont" value="${esc(h.dont)}"></label>
  <p class="mut">Words in “do not say” are removed from generated captions.</p>
  <button class="btn" type="button" data-act="save-brand">Save brand</button></form>`;
}
function libraryHtml(){
  const h=H();
  return `<div class="stack"><h2>Library</h2><p class="mut">Photos the hotel is allowed to use. The picture and the video start from the selected photo.</p>
  <div class="grid3">${(h.library||[]).map(p=>`<button type="button" class="card" data-act="photo" data-id="${esc(p.id)}" style="padding:8px;text-align:left;border-color:${p.id===h.photoId?'var(--gold)':'var(--line)'}"><img alt="${esc(p.name)}" src="${esc(p.url)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px"><b>${esc(p.name)}</b>${p.id===h.photoId?'<div class="mut">Selected</div>':''}</button>`).join('')}</div>
  <label class="btn ghost" style="width:max-content">Upload a photo<input id="up" type="file" accept="image/*" hidden></label></div>`;
}
function creditsHtml(){
  const h=H();
  let n=0;
  const rows=(h.ledger||[]).map(r=>{if(r.t==='grant'||r.t==='refund')n+=r.amount;if(r.t==='consume')n-=r.amount;return Object.assign({},r,{after:n})});
  return `<div class="stack"><div class="card"><h2>Credits</h2><p class="stat" id="creditStat">${bal()}</p><p class="mut">300 arrive on the first day of the month. Unused monthly credits expire. An extra pack is unset in baht until a real month of model bills exists.</p></div>
  <div class="card" style="overflow:auto"><table><thead><tr><th>Action</th><th>Credits</th></tr></thead><tbody>
  <tr><td>Caption, hashtags, or a translation</td><td>1</td></tr><tr><td>Default picture</td><td>10</td></tr><tr><td>Sharper picture</td><td>20</td></tr>
  <tr><td>4-second vertical video</td><td>120</td></tr><tr><td>8-second vertical video</td><td>240</td></tr>
  <tr><td>Save, approve, copy, mark as posted</td><td>0</td></tr></tbody></table></div>
  <div class="card" style="overflow:auto"><table id="ledger"><thead><tr><th>When</th><th>What</th><th>Change</th><th>Balance</th></tr></thead><tbody>${rows.slice().reverse().map(r=>`<tr><td>${esc(when(r.at))}</td><td>${esc(r.reason)}</td><td>${r.t==='consume'?'−':'+'}${r.amount}</td><td>${r.after}</td></tr>`).join('')}</tbody></table></div>
  <button class="btn ghost" type="button" data-act="reset">Reset this review</button></div>`;
}
function teamHtml(){
  const people=S.users.filter(u=>u.hotelId===H().id);
  return `<div class="stack"><h2>Team</h2><div class="card" style="overflow:auto"><table><thead><tr><th>Person</th><th>Sign-in</th><th>Approval</th></tr></thead><tbody>${people.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.user)}</td><td>${u.canApprove?'Provider has allowed approval':'Draft only'}</td></tr>`).join('')}</tbody></table></div>
  <p class="mut">Approval is a permission the provider turns on for a person. It is not a job title.</p></div>`;
}

function signIn(id){
  const u=S.users.find(x=>x.id===id);
  if(!u)return;
  session={userId:u.id};
  sessionStorage.setItem('mahareach.who',JSON.stringify(session));
  ui={view:'home',offerId:null};
  render();
}
function signOut(){session=null;sessionStorage.removeItem('mahareach.who');closeModal();render()}

function money(n){return n+' credit'+(n===1?'':'s')}
function ask(kind){
  const cost=COST[kind], have=bal(), left=have-cost, enough=have>=cost;
  const box=document.getElementById('modal');
  const note=kind==='v4'||kind==='v8'?' This review moves the hotel photo. Gemini Omni Flash makes the live clip from that photo when the key is on the server.':'';
  const picNote=(kind==='pic'||kind==='sharp'||kind==='bare')?' The offer is drawn on top of the photo.':'';
  const line=enough
    ?('This '+LABEL[kind]+' uses '+money(cost)+'. '+have+' remain now. '+left+' will remain.'+note+picNote)
    :('This '+LABEL[kind]+' needs '+money(cost)+'. You have '+have+'.'+note+picNote);
  box.hidden=false;
  box.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><h2>Confirm</h2><p id="confirmText">${esc(line)}</p>
  <div class="row"><button class="btn" type="button" id="confirmOk" ${enough?'':'disabled'}>Continue</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></div>`;
  const ok=document.getElementById('confirmOk');
  if(ok)ok.onclick=()=>runGen(kind);
}
function runGen(kind){
  const btn=document.getElementById('confirmOk');
  if(btn)btn.disabled=true;
  const o=currentOffer();
  if(!o){closeModal();return}
  const key=kind+':'+o.id+':'+Date.now();
  const res=charge(COST[kind],LABEL[kind],key);
  closeModal();
  if(!res.ok){toast('Not enough credits.');render();return}
  if(res.dup){toast('That request was already charged.');render();return}
  const h=H();
  const finish=()=>{save();render();toast(LABEL[kind]+' used '+COST[kind]+' credits. '+bal()+' remain.');};
  const fail=()=>{refund(key);save();render();toast('That call failed. The credits were returned.');};
  try{
    if(kind==='en'){o.captions.en=captionEn(o,h);finish();return}
    if(kind==='th'){o.captions.th=captionTh(o,h);finish();return}
    if(kind==='hash'){o.hashtags.en=tagsEn(o,h);o.hashtags.th=tagsTh(o,h);finish();return}
    if(kind==='v4'||kind==='v8'){
      o.video={seconds:kind==='v4'?4:8,at:Date.now()};
      finish();
      requestAnimationFrame(()=>{const f=document.getElementById('videoFrame');if(f)f.classList.add('play')});
      return;
    }
    if(kind==='pic'||kind==='sharp'||kind==='bare'){
      makePicture(h,kind==='sharp',kind==='bare').then(out=>{o.picture=out;finish()}).catch(fail);
      return;
    }
    fail();
  }catch(e){fail()}
}
function makePicture(h,sharp,forceAi){
  const url=forceAi?'':photoUrl(h);
  const size=sharp?1280:1024;
  return new Promise((resolve,reject)=>{
    const canvas=document.createElement('canvas');
    canvas.width=size;canvas.height=size;
    const ctx=canvas.getContext('2d');
    if(!url){
      paintScene(ctx,size);
      resolve({url:canvas.toDataURL('image/jpeg',0.86),ai:true,sharp});
      return;
    }
    const img=new Image();
    img.onload=()=>{
      const scale=Math.max(size/img.width,size/img.height);
      const w=img.width*scale,hh=img.height*scale;
      ctx.drawImage(img,(size-w)/2,(size-hh)/2,w,hh);
      resolve({url:canvas.toDataURL('image/jpeg',0.86),ai:false,sharp});
    };
    img.onerror=()=>reject(new Error('photo'));
    img.src=url;
  });
}
function paintScene(ctx,size){
  const g=ctx.createLinearGradient(0,0,0,size);
  g.addColorStop(0,'#16344a');g.addColorStop(.55,'#e08a55');g.addColorStop(1,'#f3d7a1');
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#1b3a32';ctx.fillRect(size*.08,size*.58,size*.28,size*.2);
  ctx.fillStyle='#184d3a';ctx.beginPath();ctx.moveTo(size*.05,size*.58);ctx.lineTo(size*.22,size*.4);ctx.lineTo(size*.4,size*.58);ctx.fill();
  ctx.fillStyle='#2c5a66';ctx.fillRect(0,size*.72,size,size*.28);
}
function readOffer(form){
  const g=n=>String(new FormData(form).get(n)||'').trim();
  let from=g('from'),to=g('to');
  if(from&&to&&from>to){const s=from;from=to;to=s}
  return {id:g('id'),title:g('title'),titleTh:g('titleTh'),sold:g('sold'),soldTh:g('soldTh'),price:g('price'),from,to,link:g('link')};
}
function saveOffer(form){
  const v=readOffer(form);
  const err=document.getElementById('offerErr');
  if(!v.title||!v.sold||!v.price||!v.from||!v.to||!v.link){err.textContent='Fill the title, what is sold, the price, the dates, and the link.';return}
  const h=H();
  if(v.id){
    const o=offerBy(v.id);if(!o)return;
    Object.assign(o,v);
  }else{
    const o=offer('off-'+Date.now(),h.id,v.title,v.titleTh,v.sold,v.soldTh,v.price,v.from,v.to,v.link);
    h.offers.unshift(o);ui.offerId=o.id;ui.editing=o.id;
  }
  save();toast('Offer saved. No credits used.');render();
}
function saveBrand(form){
  const g=n=>String(new FormData(form).get(n)||'').trim();
  const h=H();h.name=g('name')||h.name;h.city=g('city')||h.city;h.voice=g('voice');h.dont=g('dont');
  save();toast('Brand saved.');render();
}
function onUpload(file){
  if(!file)return;
  if(file.size>4e6){toast('Choose a photo under 4 MB.');return}
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const s=Math.min(1,1200/Math.max(img.width,img.height));
      c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const h=H();const id='ph-'+Date.now();
      h.library.push({id,name:file.name||'Upload',url:c.toDataURL('image/jpeg',0.85)});
      h.photoId=id;save();toast('Photo added.');render();
    };
    img.onerror=()=>toast('This image could not be read.');
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const act=b.dataset.act;
  if(act==='demo'){signIn(b.dataset.user);return}
  if(act==='nav'){ui.view=b.dataset.view;render();return}
  if(act==='signout'){signOut();return}
  if(act==='open'){ui.offerId=b.dataset.id;ui.view='studio';render();return}
  if(act==='edit'){ui.editing=b.dataset.id;ui.offerId=b.dataset.id;render();return}
  if(act==='new'){ui.editing='new';render();return}
  if(act==='gen'){ask(b.dataset.kind);return}
  if(act==='close'){closeModal();return}
  if(act==='play'){const f=document.getElementById('videoFrame');if(!f)return;f.classList.remove('play');void f.offsetWidth;f.classList.add('play');return}
  if(act==='approve'){
    if(!me().canApprove){toast('The provider has not allowed this sign-in to approve.');return}
    const o=currentOffer();
    if(!o.captions.en||!o.captions.th){toast('Write the Thai and English captions first.');return}
    o.status='approved';o.approvedBy=me().name;o.approvedAt=Date.now();
    save();toast('Approved. No credits used.');render();return;
  }
  if(act==='copy'){
    const o=currentOffer();const text=netText(o,b.dataset.net);
    if(!text)return;
    const done=()=>toast('Copied. No credits used.');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done).catch(()=>{fallbackCopy(text);done()});
    else {fallbackCopy(text);done()}
    return;
  }
  if(act==='posted'){
    const o=currentOffer();
    if(o.status!=='approved'){toast('Approve the draft first.');return}
    o.posted[b.dataset.net]=true;save();toast('Marked as posted. No credits used.');render();return;
  }
  if(act==='photo'){H().photoId=b.dataset.id;save();toast('Photo selected.');render();return}
  if(act==='save-offer'){saveOffer(b.closest('form'));return}
  if(act==='save-brand'){saveBrand(b.closest('form'));return}
  if(act==='reset'){localStorage.removeItem(KEY);S=seed();save();ui.offerId=null;toast('Review data reset.');render()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='offerPick'){ui.offerId=e.target.value;render()}
  if(e.target.id==='up'){onUpload(e.target.files&&e.target.files[0])}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='loginForm'){
    e.preventDefault();
    const fd=new FormData(e.target);
    const u=S.users.find(x=>x.user===String(fd.get('user')||'').trim()&&x.pass===String(fd.get('pass')||''));
    if(!u){document.getElementById('loginErr').textContent='That sign-in does not match.';return}
    signIn(u.id);return;
  }
  if(e.target.id==='offerForm')saveOffer(e.target);
  if(e.target.id==='brandForm')saveBrand(e.target);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function fallbackCopy(text){
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy')}catch(err){}
  ta.remove();
}
render();
</script>
</body>
