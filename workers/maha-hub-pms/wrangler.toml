# Used when Cloudflare Builds root directory is workers/maha-hub-pms.
# Prefer the repo-root wrangler.toml when the build root is /.

name = "maha-hub-pms"
main = "src/index.js"
compatibility_date = "2025-10-01"

[vars]
# The PMS's own address. Empty = off. At launch: PMS_HOST = "pms.maha-hub.com" and PMS_REDIRECT = "1".
PMS_HOST = ""
PMS_REDIRECT = "0"
MAIN_HOST = "maha-hub.com"

[assets]
directory = "../.."
binding = "ASSETS"

[previews]
