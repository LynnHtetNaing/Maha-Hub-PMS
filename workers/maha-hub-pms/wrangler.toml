# Same Worker as repo-root wrangler.toml (name must stay maha-hub-pms).
# Prefer deploying from the repository root:
#   npx wrangler deploy
#
# This folder exists so Dashboard "Root directory" can be set to
# workers/maha-hub-pms if you do not want the build root at /.

name = "maha-hub-pms"
compatibility_date = "2025-10-01"
main = "src/index.js"

[assets]
directory = "../.."
binding = "ASSETS"
not_found_handling = "single-page-application"
