# Maha Hub — Stripe Checkout Worker (holds STRIPE_SECRET_KEY as a secret)
# Deploy:
#   cd workers/stripe
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler deploy
#
# Optional: STRIPE_PUBLISHABLE_KEY via wrangler secret put

name = "maha-hub-stripe"
main = "src/index.js"
compatibility_date = "2025-10-01"

[vars]
# Public defaults (override in dashboard if needed)
CORS_ORIGIN = "*"
