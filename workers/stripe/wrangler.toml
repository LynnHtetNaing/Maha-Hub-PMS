# Maha Hub — Stripe Checkout Worker (holds STRIPE_SECRET_KEY as a secret)
# Deploy only after reviewing the hardening PR and configuring any additional trusted
# frontend origins in Cloudflare. Never put secret keys in vars or committed files.
#   cd workers/stripe
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler deploy

name = "maha-hub-stripe"
main = "src/index.js"
compatibility_date = "2025-10-01"

[vars]
# Comma-separated exact origins; no wildcard. Include only trusted frontend origins.
CORS_ORIGIN = "https://maha-hub.com,https://www.maha-hub.com"
ALLOWED_RETURN_ORIGINS = "https://maha-hub.com,https://www.maha-hub.com"
