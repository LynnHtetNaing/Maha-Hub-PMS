# Cloudflare Workers Builds: maha-hub-pms
# Worker script + Assets (required when using an ASSETS binding).
# Deploy: npx wrangler deploy

name = "maha-hub-pms"
main = "workers/maha-hub-pms/src/index.js"
compatibility_date = "2025-10-01"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
