# Cloudflare Workers Builds runs `npx wrangler preview` on pull requests.
# That command requires a [previews] block (it may be empty).
# Production deploy: npx wrangler deploy

name = "maha-hub-pms"
main = "workers/maha-hub-pms/src/index.js"
compatibility_date = "2025-10-01"

[vars]
# Every system has its own address and nothing is redirected. "/" opens that system on its own address.
# An empty value switches that address off. Add each address as a Custom Domain on this Worker in Cloudflare.
MAIN_HOST = "solutions.maha-hub.com"
PMS_HOST = "pms.maha-hub.com"
CRM_HOST = "crm.maha-hub.com"
# The CRM email link (crm.maha-hub.com/d/<token>) reads the document from this project. Both values are public (the key is the publishable one).
SUPABASE_URL = "https://wragaoglvksbbgmfjyzp.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_ZBa3rioiS97esdCkJZjuYA_wVArOAnD"
# Reserved for the future hotel Sales (a hotel system with sign-in and switching). Until then the address answers "not available yet".
SALES_HOST = "sales.maha-hub.com"
CONSOLE_HOST = "console.maha-hub.com"
CONNECT_HOST = ""
REACH_HOST = ""
BOOK_HOST = ""

[assets]
# The worker runs first only for these paths, so the PMS address can open the PMS at / ; every other file is served straight from the assets.
# /d/* is the CRM email link to one quotation or MSA (crm.maha-hub.com/d/<token>).
run_worker_first = ["/", "/index.html", "/solutions*", "/d/*"]
directory = "."
binding = "ASSETS"
# Any address that has no file answers with the Maha 404 page (404.html), with a real 404 status.
not_found_handling = "404-page"

[previews]
