# Cloudflare Workers Builds runs `npx wrangler preview` on pull requests.
# That command requires a [previews] block (it may be empty).
# Production deploy: npx wrangler deploy

name = "maha-hub-pms"
main = "workers/maha-hub-pms/src/index.js"
compatibility_date = "2025-10-01"

[vars]
# The PMS own address. Empty = off. Serving pms.maha-hub.com is on; the redirect from the old paths (PMS_REDIRECT) is switched on at launch.
PMS_HOST = "pms.maha-hub.com"
PMS_REDIRECT = "0"
MAIN_HOST = "maha-hub.com"

[assets]
directory = "."
binding = "ASSETS"

[previews]
