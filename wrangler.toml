# Cloudflare Workers Builds GitHub check expects script name: maha-hub-pms
# (Workers Builds: maha-hub-pms on each PR). Deploy once to create the Worker:
#   npx wrangler deploy
# Or Dashboard → Workers & Pages → Create → Worker name: maha-hub-pms
#
# Static Hub is served via Workers Static Assets from this repo root.
# Pages project "maha-hub" (custom domain) is still deployable via:
#   npx wrangler pages deploy . --project-name=maha-hub

name = "maha-hub-pms"
compatibility_date = "2025-10-01"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
