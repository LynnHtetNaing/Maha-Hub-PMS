<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EDC Card Link — Collect card for key-in</title>
<meta name="description" content="Standalone tool: generate a link, guest fills card details, staff keys into EDC machine.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230F3627'/%3E%3Crect x='10' y='18' width='44' height='28' rx='4' fill='%23C8942D'/%3E%3Crect x='10' y='26' width='44' height='8' fill='%230F3627'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15231c;--mut:#5a6b62;--line:#d7e0db;--bg:#eef3f0;--card:#fff;
  --green:#145c45;--green2:#0d3a2c;--gold:#c9963a;--gold2:#e2b45a;
  --ok:#146c3a;--bad:#a3231a;--warn:#8a5a12;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:15px/1.45 "DM Sans",system-ui,sans-serif;color:var(--ink);background:
  radial-gradient(900px 480px at 0% -10%,rgba(201,150,58,.16),transparent 55%),
  linear-gradient(180deg,#f4f7f5 0%,var(--bg) 100%)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
a{color:var(--green)}
.banner{background:var(--green2);color:#dce8e1;font-size:12px;padding:8px 14px;text-align:center;border-bottom:1px solid rgba(201,150,58,.35)}
.banner b{color:var(--gold2)}
.wrap{width:min(980px,94vw);margin:22px auto 40px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--green2);display:grid;place-items:center;color:var(--gold2);font-weight:700;font-size:12px;letter-spacing:.04em}
.brand h1{margin:0;font-family:Fraunces,Georgia,serif;font-size:1.35rem;color:var(--green2)}
.brand p{margin:2px 0 0;font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 10px 28px rgba(13,58,44,.06)}
.card+.card{margin-top:12px}
.h2{margin:0 0 6px;font-family:Fraunces,Georgia,serif;font-size:1.2rem;color:var(--green2)}
.sub{margin:0 0 14px;color:var(--mut);font-size:13.5px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:grid;gap:4px;font-size:12px;font-weight:700;color:#44584e;margin-bottom:10px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fff;font-weight:500}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{appearance:none;border:1px solid transparent;border-radius:8px;padding:10px 14px;font-weight:700}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1e1606;border-color:#b07e20}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.ghost{background:#fff;color:var(--green);border-color:var(--line)}
.btn.danger{background:#fff;color:var(--bad);border-color:#e2b4b0}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-weight:700;font-size:13px;min-height:1.15em}
.ok{color:var(--ok);font-weight:700}
.warn{background:#fff7e8;border:1px solid #ead5a4;color:var(--warn);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.45;margin-top:12px}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th,.table td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
.table th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.pill.wait{background:#fff1c9;color:#7a5800}
.pill.ready{background:#d7e7f8;color:#1a4f86}
.pill.done{background:#d8f3e4;color:#146c3a}
.pill.off{background:#f0e4e4;color:#7a3030}
.amt{font-family:Fraunces,Georgia,serif;font-size:1.8rem;color:var(--green);margin:0 0 8px}
.secret{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0d3a2c;color:#e8f2ec;padding:12px;border-radius:8px;letter-spacing:.04em}
.guest-wrap{width:min(520px,94vw);margin:24px auto 40px}
.empty{color:var(--mut);padding:18px 0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#15231c;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.wrap{margin-top:14px}}
</style>
</head>
<body>
<div class="banner"><b>EDC Card Link</b> · Standalone tool (not Maha Hub PMS). Guest fills card → staff keys into EDC machine. Use only on a trusted device.</div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const DBKEY='edclink.v1';
const $= (s,r=document)=>r.querySelector(s);
const $$= (s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const params=new URLSearchParams(location.search);
const linkId=(params.get('id')||params.get('link')||'').trim();
const wantAdmin=params.has('admin')||location.hash==='#admin'||(!linkId&&params.get('mode')!=='guest');

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function load(){
  try{
    const raw=localStorage.getItem(DBKEY);
    if(!raw)return seed();
    const db=JSON.parse(raw);
    db.links=Array.isArray(db.links)?db.links:[];
    db.set=Object.assign({business:'Hotel Front Desk',cur:'THB',pin:'2468'},db.set||{});
    return db;
  }catch(e){return seed()}
}
function seed(){
  return {version:1,set:{business:'Hotel Front Desk',cur:'THB',pin:'2468'},links:[],logs:[]};
}
function save(db){db.savedAt=Date.now();localStorage.setItem(DBKEY,JSON.stringify(db))}
function money(n,cur){
  try{return new Intl.NumberFormat(undefined,{style:'currency',currency:cur||'THB',maximumFractionDigits:2}).format(+n||0)}
  catch(e){return ((+n||0).toFixed(2))+' '+(cur||'')}
}
function onlyDigits(s){return String(s||'').replace(/\D/g,'')}
function formatPan(v){const d=onlyDigits(v).slice(0,19);return d.replace(/(\d{4})(?=\d)/g,'$1 ').trim()}
function formatExp(v){const d=onlyDigits(v).slice(0,4);return d.length<=2?d:d.slice(0,2)+'/'+d.slice(2)}
function luhn(pan){
  let sum=0,alt=false;
  for(let i=pan.length-1;i>=0;i--){let n=+pan[i];if(alt){n*=2;if(n>9)n-=9}sum+=n;alt=!alt}
  return pan.length>=12&&sum%10===0;
}
function brandOf(pan){
  if(/^4/.test(pan))return 'VISA';
  if(/^(5[1-5]|2[2-7])/.test(pan))return 'MASTER';
  if(/^3[47]/.test(pan))return 'AMEX';
  if(/^35/.test(pan))return 'JCB';
  if(/^62/.test(pan))return 'UNIONPAY';
  return 'CARD';
}
function linkUrl(id){
  const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('id',id);return u.toString();
}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();
}
function when(ts){if(!ts)return '—';const d=new Date(ts);return d.toLocaleString()}
function pill(st){
  return ({waiting:'<span class="pill wait">Waiting guest</span>',submitted:'<span class="pill ready">Ready for EDC</span>',keyed:'<span class="pill done">Keyed</span>',cancelled:'<span class="pill off">Cancelled</span>',expired:'<span class="pill off">Expired</span>'}[st]||esc(st));
}
function log(db,a){db.logs=db.logs||[];db.logs.unshift({at:Date.now(),a});if(db.logs.length>200)db.logs.length=200}

/* ---------- Guest page ---------- */
function renderGuest(){
  const db=load();
  const link=db.links.find(x=>x.id===linkId);
  document.body.innerHTML=`<div class="banner"><b>Secure card form</b> · Your hotel will key this card into their EDC machine. This page only collects the details.</div><div class="guest-wrap" id="root"></div><div class="toast" id="toast"></div>`;
  const root=$('#root');
  if(!link){root.innerHTML=`<div class="card"><h2 class="h2">Link not found</h2><p class="sub">Ask the hotel for a new card-collection link.</p></div>`;return}
  if(link.expiresAt&&Date.now()>link.expiresAt&&link.status==='waiting'){link.status='expired';save(db)}
  if(link.status==='cancelled'||link.status==='expired'){root.innerHTML=`<div class="card"><h2 class="h2">Link unavailable</h2><p class="sub">This link is ${esc(link.status)}. Ask the hotel for a new one.</p></div>`;return}
  if(link.status==='submitted'||link.status==='keyed'){
    root.innerHTML=`<div class="card"><h2 class="h2">Details received</h2><p class="sub">Thank you. ${esc(db.set.business)} has your card details for EDC key-in.</p>
      <div class="amt">${esc(money(link.amount,link.cur||db.set.cur))}</div>
      <p class="sub">Reference: <b>${esc(link.ref||link.id)}</b>${link.card?` · Card •••• ${esc(link.card.last4)}`:''}</p></div>`;
    return;
  }
  root.innerHTML=`<div class="card">
    <p class="sub" style="margin:0 0 4px">${esc(db.set.business)}</p>
    <h2 class="h2">Card details for EDC charge</h2>
    <p class="sub">Fill your card so the hotel can key it into their payment machine (EDC). No automatic online charge is made on this page.</p>
    <div class="amt">${esc(money(link.amount,link.cur||db.set.cur))}</div>
    <p class="sub">${link.guest?`Guest: <b>${esc(link.guest)}</b><br>`:''}${link.ref?`Reference: <b>${esc(link.ref)}</b><br>`:''}${link.note?esc(link.note):''}</p>
    <form id="form">
      <label class="f"><span>Cardholder name</span><input id="holder" autocomplete="cc-name" required placeholder="Name on card"></label>
      <label class="f"><span>Card number</span><input id="pan" inputmode="numeric" autocomplete="cc-number" required placeholder="•••• •••• •••• ••••"></label>
      <div class="grid2">
        <label class="f"><span>Expiry (MM/YY)</span><input id="exp" inputmode="numeric" autocomplete="cc-exp" required placeholder="MM/YY"></label>
        <label class="f"><span>CVC</span><input id="cvc" inputmode="numeric" autocomplete="cc-csc" required maxlength="4" placeholder="•••"></label>
      </div>
      <div class="err" id="err"></div>
      <button class="btn gold" style="width:100%" type="submit">Submit card for EDC key-in</button>
    </form>
    <div class="warn">Submit only on the hotel’s official link. After the hotel keys the charge on their EDC, they should clear sensitive details from this tool.</div>
  </div>`;
  $('#pan').oninput=e=>e.target.value=formatPan(e.target.value);
  $('#exp').oninput=e=>e.target.value=formatExp(e.target.value);
  $('#form').onsubmit=e=>{
    e.preventDefault();
    const err=$('#err');err.textContent='';
    const holder=$('#holder').value.trim();
    const pan=onlyDigits($('#pan').value);
    const exp=formatExp($('#exp').value);
    const cvc=onlyDigits($('#cvc').value);
    if(holder.length<2){err.textContent='Enter the cardholder name.';return}
    if(!luhn(pan)){err.textContent='Card number is not valid.';return}
    if(!/^\d{2}\/\d{2}$/.test(exp)){err.textContent='Use expiry as MM/YY.';return}
    const mm=+exp.slice(0,2),yy=+exp.slice(3),now=new Date(),y=2000+yy;
    if(mm<1||mm>12){err.textContent='Expiry month is not valid.';return}
    if(y<now.getFullYear()||(y===now.getFullYear()&&mm-1<now.getMonth())){err.textContent='This card looks expired.';return}
    if(cvc.length<3||cvc.length>4){err.textContent='Enter a valid CVC.';return}
    const fresh=load();const L=fresh.links.find(x=>x.id===linkId);
    if(!L||L.status!=='waiting'){err.textContent='This link is no longer waiting for a card.';return}
    L.status='submitted';
    L.submittedAt=Date.now();
    L.card={
      brand:brandOf(pan),
      pan,                 // needed for EDC key-in
      last4:pan.slice(-4),
      exp,
      cvc,                 // kept only until staff marks keyed
      holder
    };
    log(fresh,'Guest submitted card for '+L.id+' (•••• '+L.card.last4+')');
    save(fresh);
    $('#pan').value='';$('#cvc').value='';
    renderGuest();
  };
}

/* ---------- Admin ---------- */
let unlocked=sessionStorage.getItem('edclink.ok')==='1';
function renderAdmin(){
  const db=load();
  if(!unlocked){
    document.body.innerHTML=`<div class="banner"><b>EDC Card Link — Staff</b> · Standalone desk for key-in collection</div>
      <div class="guest-wrap"><div class="card">
        <h2 class="h2">Staff unlock</h2>
        <p class="sub">Default PIN is <b>2468</b> (change after unlock). This desk is separate from Maha Hub PMS.</p>
        <label class="f"><span>PIN</span><input id="pin" type="password" inputmode="numeric" autofocus></label>
        <div class="err" id="err"></div>
        <button class="btn gold" style="width:100%" id="go">Unlock</button>
      </div></div><div class="toast" id="toast"></div>`;
    $('#go').onclick=()=>{
      if($('#pin').value!==db.set.pin){$('#err').textContent='PIN is not correct.';return}
      unlocked=true;sessionStorage.setItem('edclink.ok','1');renderAdmin();
    };
    $('#pin').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
    return;
  }

  const links=db.links.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const ready=links.filter(x=>x.status==='submitted');
  document.body.innerHTML=`<div class="banner"><b>EDC Card Link — Staff desk</b> · Create links · view cards · key into EDC · then clear CVC</div>
  <div class="wrap">
    <div class="top">
      <div class="brand"><div class="mark">EDC</div><div><h1>${esc(db.set.business)}</h1><p>Standalone card-collect for EDC key-in</p></div></div>
      <div class="row">
        <button class="btn ghost sm" id="btnSet">Settings</button>
        <button class="btn ghost sm" id="btnLock">Lock</button>
      </div>
    </div>

    <div class="card">
      <h2 class="h2">New collection link</h2>
      <p class="sub">Send this link to the customer. They fill card details. You open the submitted card here and key it into your EDC machine.</p>
      <div class="grid2">
        <label class="f"><span>Guest name</span><input id="g" placeholder="Customer name"></label>
        <label class="f"><span>Amount to key</span><input id="a" type="number" min="0.01" step="0.01" placeholder="0.00"></label>
        <label class="f"><span>Currency</span><input id="c" value="${esc(db.set.cur)}"></label>
        <label class="f"><span>Reference (RSVN / invoice)</span><input id="r" placeholder="Optional"></label>
        <label class="f" style="grid-column:1/-1"><span>Note</span><input id="n" placeholder="e.g. Deposit / balance"></label>
        <label class="f"><span>Link expires</span>
          <select id="x"><option value="24">24 hours</option><option value="72" selected>3 days</option><option value="168">7 days</option><option value="0">No expiry</option></select>
        </label>
      </div>
      <div class="err" id="cerr"></div>
      <div class="row"><button class="btn gold" id="create">Create &amp; copy link</button></div>
    </div>

    ${ready.length?`<div class="card"><h2 class="h2">Ready for EDC key-in (${ready.length})</h2>
      <p class="sub">Open a card, key it into your machine, then mark as keyed (CVC is cleared).</p>
      <div id="readyBox"></div></div>`:''}

    <div class="card">
      <h2 class="h2">All links</h2>
      <div style="overflow:auto">
        <table class="table"><tr><th>Status</th><th>Created</th><th>Guest</th><th>Ref</th><th>Amount</th><th>Card</th><th></th></tr>
        ${links.map(L=>`<tr>
          <td>${pill(L.status)}</td><td>${esc(when(L.createdAt))}</td><td>${esc(L.guest||'—')}</td><td>${esc(L.ref||'—')}</td>
          <td>${esc(money(L.amount,L.cur||db.set.cur))}</td>
          <td>${L.card?esc((L.card.brand||'')+' •••• '+L.card.last4):'—'}</td>
          <td class="row">
            <button class="btn ghost sm" data-copy="${L.id}">Copy link</button>
            ${L.status==='submitted'?`<button class="btn green sm" data-view="${L.id}">Open for EDC</button>`:''}
            ${L.status==='waiting'?`<button class="btn danger sm" data-cancel="${L.id}">Cancel</button>`:''}
            ${L.status==='keyed'&&L.card&&L.card.pan?`<button class="btn danger sm" data-wipe="${L.id}">Wipe card #</button>`:''}
          </td></tr>`).join('')||'<tr><td colspan="7" class="empty">No links yet.</td></tr>'}
        </table>
      </div>
      <div class="warn">PCI note: keep this desk private. After EDC key-in, mark keyed so CVC is removed. Wipe full card numbers when no longer needed. Prefer a PCI-compliant vault/PSP for long-term storage.</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>`;

  if(ready.length){
    $('#readyBox').innerHTML=ready.map(L=>`<div class="card" style="background:#f7faf8;margin-top:8px">
      <div class="row" style="justify-content:space-between"><b>${esc(L.guest||'Guest')}</b>${pill(L.status)}</div>
      <div class="sub" style="margin:6px 0">${esc(money(L.amount,L.cur||db.set.cur))} · ${esc(L.ref||L.id)} · ${esc(L.note||'')}</div>
      <button class="btn green sm" data-view="${L.id}">Show card for key-in</button>
    </div>`).join('');
  }

  $('#create').onclick=()=>{
    const guest=$('#g').value.trim(), amt=+$('#a').value, cur=$('#c').value.trim()||db.set.cur, ref=$('#r').value.trim(), note=$('#n').value.trim(), hrs=+$('#x').value;
    if(!guest){$('#cerr').textContent='Enter guest name.';return}
    if(!(amt>0)){$('#cerr').textContent='Enter amount greater than 0.';return}
    const id='edc'+uid();
    const link={id,guest,amount:Math.round(amt*100)/100,cur,ref,note,status:'waiting',createdAt:Date.now(),submittedAt:null,keyedAt:null,card:null,expiresAt:hrs?Date.now()+hrs*36e5:null};
    const d=load();d.links.unshift(link);log(d,'Created link '+id+' for '+guest);save(d);
    const url=linkUrl(id);copy(url);toast('Link created & copied');
    prompt('Send this link to the customer:',url);
    renderAdmin();
  };
  $$('[data-copy]').forEach(b=>b.onclick=()=>{copy(linkUrl(b.dataset.copy));toast('Copied')});
  $$('[data-cancel]').forEach(b=>b.onclick=()=>{const d=load();const L=d.links.find(x=>x.id===b.dataset.cancel);if(!L||L.status!=='waiting')return;if(!confirm('Cancel this link?'))return;L.status='cancelled';log(d,'Cancelled '+L.id);save(d);renderAdmin()});
  $$('[data-wipe]').forEach(b=>b.onclick=()=>{const d=load();const L=d.links.find(x=>x.id===b.dataset.wipe);if(!L||!L.card)return;if(!confirm('Permanently remove full card number for '+L.id+'?'))return;L.card.pan='';L.card.cvc='';log(d,'Wiped PAN for '+L.id);save(d);toast('Card number wiped');renderAdmin()});
  $$('[data-view]').forEach(b=>b.onclick=()=>showCard(b.dataset.view));
  $('#btnLock').onclick=()=>{unlocked=false;sessionStorage.removeItem('edclink.ok');renderAdmin()};
  $('#btnSet').onclick=()=>{
    const d=load();
    const biz=prompt('Business / hotel name',d.set.business);if(biz===null)return;
    const cur=prompt('Default currency',d.set.cur);if(cur===null)return;
    const pin=prompt('Staff PIN (min 4 chars)',d.set.pin);if(pin===null)return;
    if(String(pin).length<4){toast('PIN too short');return}
    d.set.business=biz.trim()||d.set.business;d.set.cur=(cur||d.set.cur).trim();d.set.pin=String(pin);log(d,'Updated settings');save(d);toast('Settings saved');renderAdmin();
  };
}

function showCard(id){
  const d=load();const L=d.links.find(x=>x.id===id);
  if(!L||!L.card){toast('No card on this link');return}
  const c=L.card;
  const box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:rgba(10,30,22,.55);display:grid;place-items:center;padding:16px;z-index:50';
  box.innerHTML=`<div class="card" style="width:min(480px,96vw)">
    <h2 class="h2">EDC key-in sheet</h2>
    <p class="sub">${esc(L.guest||'')} · <b>${esc(money(L.amount,L.cur||d.set.cur))}</b> · ${esc(L.ref||L.id)}</p>
    <div class="secret">
      <div>Holder: ${esc(c.holder||'—')}</div>
      <div>Brand: ${esc(c.brand||'—')}</div>
      <div style="font-size:1.25rem;margin:8px 0">PAN: ${esc(formatPan(c.pan||('••••'+c.last4)))}</div>
      <div>Exp: ${esc(c.exp||'—')} · CVC: ${esc(c.cvc||'(cleared)')}</div>
    </div>
    <div class="warn">Key these into your EDC / key-in machine now. After a successful charge, mark as keyed — CVC will be deleted.</div>
    <div class="row" style="margin-top:12px">
      <button class="btn green" id="mKeyed">Marked keyed on EDC</button>
      <button class="btn ghost" id="mClose">Close</button>
    </div>
  </div>`;
  document.body.appendChild(box);
  log(d,'Viewed card for EDC key-in '+L.id);save(d);
  $('#mClose',box).onclick=()=>box.remove();
  $('#mKeyed',box).onclick=()=>{
    const fresh=load();const X=fresh.links.find(x=>x.id===id);if(!X||!X.card)return;
    X.status='keyed';X.keyedAt=Date.now();X.card.cvc=''; // never keep CVC after key-in
    log(fresh,'Marked keyed on EDC '+X.id+' — CVC cleared');save(fresh);
    box.remove();toast('Marked keyed · CVC cleared');renderAdmin();
  };
}

/* boot */
if(linkId) renderGuest();
else renderAdmin();
</script>
</body>
</html>
