<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Card payment</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230F3627'/%3E%3Crect x='10' y='18' width='44' height='28' rx='4' fill='%23C8942D'/%3E%3Crect x='10' y='26' width='44' height='8' fill='%230F3627'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15231c;--mut:#5a6b62;--line:#d7e0db;--bg:#eef3f0;--card:#fff;
  --green:#184D3A;--green2:#0A3020;--gold:#D49A38;--gold2:#E8B058;
  --ok:#146c3a;--bad:#a3231a;--warn:#8a5a12;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:15px/1.45 "DM Sans",system-ui,sans-serif;color:var(--ink);background:
  radial-gradient(900px 480px at 0% -10%,rgba(201,150,58,.16),transparent 55%),
  linear-gradient(180deg,#f4f7f5 0%,var(--bg) 100%)}
button,input{font:inherit}button{cursor:pointer}
.guest-wrap{width:min(520px,94vw);margin:28px auto 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 10px 28px rgba(13,58,44,.06)}
.h2{margin:0 0 10px;font-family:Fraunces,Georgia,serif;font-size:1.25rem;color:var(--green2)}
.sub{margin:0 0 12px;color:var(--mut);font-size:13.5px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:grid;gap:4px;font-size:12px;font-weight:700;color:#44584e;margin-bottom:10px}
.f input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fff;font-weight:500}
.f input:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{appearance:none;border:1px solid #b07e20;border-radius:8px;padding:11px 14px;font-weight:700;
  background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1e1606;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--bad);font-weight:700;font-size:13px;min-height:1.15em}
.amt{font-family:Fraunces,Georgia,serif;font-size:1.9rem;color:var(--green);margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#15231c;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="guest-wrap" id="root"><div class="card"><p class="sub">Loading…</p></div></div>
<div class="toast" id="toast"></div>
<script>
const CLOUD_PUBLISHABLE='sb_publishable_ZBa3rioiS97esdCkJZjuYA_wVArOAnD';
const BRIDGE_KEY='mahahub.edc.bridge.v1';
const $= (s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);
const linkId=(params.get('id')||params.get('link')||'').trim();
const hotelCode=(params.get('h')||params.get('hotel')||'').trim();
const cloudUrl=(params.get('cloud')||'').trim().replace(/\/+$/,'');
const stripeHelper=(params.get('stripe')||'').trim().replace(/\/+$/,'');
const packed=(params.get('p')||'').trim();
const paidFlag=params.get('paid')==='1'||params.get('paid')==='true';
const cancelledFlag=params.get('cancelled')==='1'||params.get('cancelled')==='true';
const checkoutSessionId=(params.get('session_id')||params.get('cs')||'').trim();

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function money(n,cur){
  try{return new Intl.NumberFormat(undefined,{style:'currency',currency:cur||'THB',maximumFractionDigits:2}).format(+n||0)}
  catch(e){return ((+n||0).toFixed(2))+' '+(cur||'')}
}
function onlyDigits(s){return String(s||'').replace(/\D/g,'')}
function formatPan(v){const d=onlyDigits(v).slice(0,19);return d.replace(/(\d{4})(?=\d)/g,'$1 ').trim()}
function formatExp(v){const d=onlyDigits(v).slice(0,4);return d.length<=2?d:d.slice(0,2)+'/'+d.slice(2)}
function luhn(pan){
  let sum=0,alt=false;
  for(let i=pan.length-1;i>=0;i--){let n=+pan[i];if(alt){n*=2;if(n>9)n-=9}sum+=n;alt=!alt}
  return pan.length>=12&&sum%10===0;
}
function brandOf(pan){
  if(/^4/.test(pan))return 'VISA';
  if(/^(5[1-5]|2[2-7])/.test(pan))return 'MASTER';
  if(/^3[47]/.test(pan))return 'AMEX';
  if(/^35/.test(pan))return 'JCB';
  if(/^62/.test(pan))return 'UNIONPAY';
  return 'CARD';
}
function bridgeAll(){try{const o=JSON.parse(localStorage.getItem(BRIDGE_KEY)||'{"links":[]}');o.links=Array.isArray(o.links)?o.links:[];return o}catch(e){return {links:[]}}}
function bridgeGet(id){return bridgeAll().links.find(x=>x.id===id)||null}
function bridgePut(link){
  const b=bridgeAll();const i=b.links.findIndex(x=>x.id===link.id);
  if(i>=0)b.links[i]=link;else b.links.unshift(link);
  try{localStorage.setItem(BRIDGE_KEY,JSON.stringify(b))}catch(e){}
  return link;
}
function fromPlainParams(){
  const a=params.get('a');
  if(a==null||a==='')return null;
  const amount=+a;
  if(!(amount>=0))return null;
  return {
    id:linkId||('tmp'+Date.now().toString(36)),
    hotel:hotelCode,status:'waiting',
    guest:(params.get('g')||'').trim(),amount,
    cur:(params.get('c')||'THB').trim()||'THB',
    ref:(params.get('r')||'').trim(),note:(params.get('n')||'').trim(),
    expiresAt:params.get('x')?+params.get('x'):null,
    createdAt:Date.now(),card:null,hasCard:false,fromUrl:true
  };
}
function unpack(p){
  if(!p)return null;
  try{
    let s=p.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    const o=JSON.parse(decodeURIComponent(escape(atob(s))));
    if(!o||!(o.id||o.a!=null))return null;
    return {
      id:o.id||linkId,hotel:o.h||hotelCode,status:'waiting',
      guest:o.g||'',amount:+o.a||0,cur:o.c||'THB',ref:o.r||'',note:o.n||'',
      expiresAt:o.x||null,createdAt:o.at||Date.now(),card:null,hasCard:false,fromPack:true
    };
  }catch(e){return null}
}
async function cloudRpc(name,body){
  if(!cloudUrl)throw new Error('NOCLOUD');
  const headers={'Content-Type':'application/json','apikey':CLOUD_PUBLISHABLE};
  const res=await fetch(cloudUrl+'/rest/v1/rpc/'+name,{method:'POST',headers,body:JSON.stringify(body)});
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch(e){data={message:text}}
  if(!res.ok)throw new Error((data&&(data.message||data.error||data.msg))||('HTTP '+res.status));
  return data;
}
function normalizeLink(raw){
  if(!raw)return null;
  if(raw.meta){
    const m=raw.meta||{};
    return {
      id:raw.id,hotel:raw.hotel||hotelCode,status:raw.status||'waiting',
      guest:m.guest||'',amount:+m.amount||0,cur:m.cur||'THB',ref:m.ref||'',note:m.note||'',
      expiresAt:m.expiresAt||null,card:null,hasCard:!!raw.hasCard
    };
  }
  return {
    id:raw.id,hotel:raw.hotel||hotelCode,status:raw.status||'waiting',
    guest:raw.guest||'',amount:+raw.amount||0,cur:raw.cur||'THB',ref:raw.ref||'',note:raw.note||'',
    expiresAt:raw.expiresAt||null,card:raw.card||null,hasCard:!!raw.card
  };
}
async function loadLink(){
  const plain=fromPlainParams();
  if(plain){
    if(linkId){
      const br=bridgeGet(linkId);
      if(br&&(br.status==='submitted'||br.status==='keyed'||br.status==='paid'||br.card))return normalizeLink(br);
      if(cloudUrl){
        try{
          const res=await cloudRpc('maha_edc_public_get',{id:linkId});
          if(res&&res.ok&&(res.status==='submitted'||res.status==='keyed'||res.status==='paid'||res.hasCard))return normalizeLink(res);
        }catch(e){}
      }
    }
    return plain;
  }
  if(cloudUrl&&linkId){
    try{
      const res=await cloudRpc('maha_edc_public_get',{id:linkId});
      if(res&&res.ok)return normalizeLink(res);
    }catch(e){}
  }
  if(linkId){
    const br=bridgeGet(linkId);
    if(br)return normalizeLink(br);
  }
  return unpack(packed);
}
function rootHtml(html){$('#root').innerHTML=html}
function showMissing(){
  rootHtml(`<div class="card"><h2 class="h2">Link not available</h2><p class="sub">Open the full link from the hotel (Copy link).</p></div>`);
}
function showDone(L, opts){
  const stripe=opts&&opts.stripe;
  rootHtml(`<div class="card"><h2 class="h2">${stripe?'Payment received':'Thank you'}</h2><div class="amt">${esc(money(L.amount,L.cur))}</div>${L.ref?`<p class="sub">${esc(L.ref)}</p>`:''}${stripe?`<p class="sub">3D Secure completed via Stripe.</p>`:''}</div>`);
}
function showBlocked(L){
  rootHtml(`<div class="card"><h2 class="h2">Link unavailable</h2><p class="sub">This link is ${esc(L.status)}.</p></div>`);
}
function showCancelled(){
  rootHtml(`<div class="card"><h2 class="h2">Payment cancelled</h2><p class="sub">No charge was made. Ask the hotel for a new link if you still need to pay.</p></div>`);
}
async function finishSubmit(L, card){
  const id=L.id||linkId;
  if(cloudUrl&&id){
    try{await cloudRpc('maha_edc_public_submit',{id,card})}catch(ex){}
  }
  const local=bridgeGet(id)||Object.assign({},L,{id});
  local.status='submitted';local.submittedAt=Date.now();local.card=card;local.hotel=local.hotel||hotelCode;
  bridgePut(local);
  showDone(L);
}
async function finishStripePaid(L, session){
  const id=L.id||linkId||(session.metadata&&session.metadata.linkId)||'';
  const card=session.card||{brand:'CARD',last4:'',stripe:true};
  if(cloudUrl&&id){
    try{await cloudRpc('maha_edc_public_submit',{id,card:Object.assign({},card,{stripeSessionId:session.id})})}catch(ex){}
  }
  if(id){
    const local=bridgeGet(id)||Object.assign({},L||{},{id,amount:L&&L.amount,cur:L&&L.cur,ref:L&&L.ref,guest:L&&L.guest});
    local.status='paid';local.submittedAt=Date.now();local.card=card;local.stripeSessionId=session.id;
    local.hotel=local.hotel||hotelCode;
    bridgePut(local);
  }
  showDone(L||{amount:(session.amountTotal!=null?session.amountTotal/100:0),cur:(session.currency||'thb').toUpperCase(),ref:''},{stripe:true});
}
async function lookupStripeSession(id){
  if(!stripeHelper||!id)return null;
  try{
    const res=await fetch(stripeHelper+'/api/session/'+encodeURIComponent(id));
    const data=await res.json().catch(()=>({}));
    if(res.ok&&data.ok)return data;
  }catch(e){}
  return null;
}
function showForm(L){
  const meta=[L.guest,L.ref,L.note].filter(Boolean).map(esc).join(' · ');
  rootHtml(`<div class="card">
    <div class="amt">${esc(money(L.amount,L.cur))}</div>
    ${meta?`<p class="sub">${meta}</p>`:''}
    <p class="sub">Enter your card for the hotel. This page does not send a bank OTP — for real 3D Secure the hotel sends a Stripe Checkout link instead.</p>
    <form id="form">
      <label class="f"><span>Cardholder name</span><input id="holder" autocomplete="cc-name" required placeholder="Name on card"></label>
      <label class="f"><span>Card number</span><input id="pan" inputmode="numeric" autocomplete="cc-number" required placeholder="•••• •••• •••• ••••"></label>
      <div class="grid2">
        <label class="f"><span>Expiry (MM/YY)</span><input id="exp" inputmode="numeric" autocomplete="cc-exp" required placeholder="MM/YY"></label>
        <label class="f"><span>CVC</span><input id="cvc" inputmode="numeric" autocomplete="cc-csc" required maxlength="4" placeholder="•••"></label>
      </div>
      <div class="err" id="err"></div>
      <button class="btn" type="submit" id="go">Submit</button>
    </form>
  </div>`);
  $('#pan').oninput=e=>e.target.value=formatPan(e.target.value);
  $('#exp').oninput=e=>e.target.value=formatExp(e.target.value);
  $('#form').onsubmit=async e=>{
    e.preventDefault();
    const err=$('#err');err.textContent='';
    const holder=$('#holder').value.trim();
    const pan=onlyDigits($('#pan').value);
    const exp=formatExp($('#exp').value);
    const cvc=onlyDigits($('#cvc').value);
    if(holder.length<2){err.textContent='Enter the cardholder name.';return}
    if(!luhn(pan)){err.textContent='Card number is not valid.';return}
    if(!/^\d{2}\/\d{2}$/.test(exp)){err.textContent='Use expiry as MM/YY.';return}
    const mm=+exp.slice(0,2),yy=+exp.slice(3),now=new Date(),y=2000+yy;
    if(mm<1||mm>12){err.textContent='Expiry month is not valid.';return}
    if(y<now.getFullYear()||(y===now.getFullYear()&&mm-1<now.getMonth())){err.textContent='This card looks expired.';return}
    if(cvc.length<3||cvc.length>4){err.textContent='Enter a valid CVC.';return}
    const card={brand:brandOf(pan),pan,last4:pan.slice(-4),exp,cvc,holder};
    const btn=$('#go');btn.disabled=true;btn.textContent='Sending…';
    await finishSubmit(L, card);
  };
}

async function boot(){
  if(cancelledFlag){showCancelled();return}

  if(paidFlag||checkoutSessionId){
    const L=await loadLink();
    if(checkoutSessionId){
      const sess=await lookupStripeSession(checkoutSessionId);
      if(sess&&sess.paid){await finishStripePaid(L||{amount:0,cur:'THB'},sess);return}
    }
    if(L){showDone(L,{stripe:true});return}
    rootHtml(`<div class="card"><h2 class="h2">Payment received</h2><p class="sub">Thank you. The hotel can confirm this payment in Stripe.</p></div>`);
    return;
  }

  const L=await loadLink();
  if(!L){showMissing();return}
  if(L.expiresAt&&Date.now()>L.expiresAt&&L.status==='waiting'){L.status='expired'}
  if(L.status==='cancelled'||L.status==='expired'){showBlocked(L);return}
  if(L.status==='submitted'||L.status==='keyed'||L.status==='paid'||L.hasCard){showDone(L,{stripe:L.status==='paid'});return}
  showForm(L);
}
boot();
</script>
</body>
</html>
