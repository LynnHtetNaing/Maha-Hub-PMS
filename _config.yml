# GitHub Pages (Jekyll) publishing rules for maha-hub.com.
# These folders and files are repository internals: they must not be served on the live website.
# The list matches .cfignore and .assetsignore so every host publishes the same set.
exclude:
  - docs
  - supabase
  - tests
  - workers
  - wrangler.toml
  - stripe/README.md
  - book/data
  - book/server.mjs
  - book/test-feeds.mjs
  - connect/data
  - .cursor
  - .github
  - tmp
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
