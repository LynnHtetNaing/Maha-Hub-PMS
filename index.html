let helpLang='en';
VIEWS['help.home']=el=>{
  const lang=helpLang;const arts=HELP.map(a=>({id:a.id,...a[lang]}));
  el.innerHTML=pageHead('Help',`<div class="segs" style="grid-template-columns:repeat(3,auto)">${[['en','English'],['th','ไทย'],['my','မြန်မာ']].map(([k,l])=>`<button type="button" data-hl="${k}" aria-pressed="${lang===k}">${l}</button>`).join('')}</div>`)+
    `<div class="helpgrid"><div class="panel pad helplist">${arts.map(a=>`<button type="button" data-ha="${a.id}">${esc(a.t)}</button>`).join('')}</div>
     <div class="panel pad"><div id="helpBody"><h2>${esc(arts[0].t)}</h2><p>${esc(arts[0].b)}</p></div>
      <h3 class="mt">Ask</h3><div class="row gap"><input id="helpQ" style="flex:1" placeholder="${lang==='th'?'พิมพ์คำถาม':lang==='my'?'မေးခွန်းရိုက်ပါ':'Ask in your own words'}"><button class="btn gold" id="helpGo">Answer</button></div>
      <div id="helpA" class="mt sub">${H.set.geminiKey?'Gemini is available for this hotel, and the pages above still answer without a network.':'Answers come from these pages on this device. Add an optional Gemini key in Hotel Settings if you want a longer answer.'}</div></div></div>`;
  const show=id=>{const a=arts.find(x=>x.id===id)||arts[0];$('#helpBody',el).innerHTML=`<h2>${esc(a.t)}</h2><p>${esc(a.b)}</p>`;$$('[data-ha]',el).forEach(b=>b.classList.toggle('on',b.dataset.ha===a.id))};
  $$('[data-ha]',el).forEach(b=>b.onclick=()=>show(b.dataset.ha));show(arts[0].id);
  $$('[data-hl]',el).forEach(b=>b.onclick=()=>{helpLang=b.dataset.hl;render()});
  $('#helpGo',el).onclick=async()=>{const q=$('#helpQ',el).value.trim();if(!q)return;const words=q.toLowerCase().split(/\s+/).filter(w=>w.length>2);const ranked=HELP.map(a=>{const blob=(a.en.t+' '+a.en.b+' '+a.th.t+' '+a.th.b+' '+a.my.t+' '+a.my.b).toLowerCase();return {a,s:words.reduce((n,w)=>n+(blob.includes(w)?1:0),0)}}).filter(x=>x.s).sort((a,b)=>b.s-a.s);
    const local=ranked.slice(0,3).map(x=>x.a[lang]||x.a.en);
    let html=local.length?local.map(a=>`<p><b>${esc(a.t)}</b><br>${esc(a.b)}</p>`).join(''):'<p>Nothing on these pages matches those words. Try payment, check-out, shift, breakfast, tax or approval.</p>';
    $('#helpA',el).innerHTML=html;
    if(H.set.geminiKey){try{const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+encodeURIComponent(H.set.geminiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'You help hotel staff use Maha Hub PMS. Answer briefly in the same language as the question. Use only this manual:\n'+HELP.map(a=>a[lang].t+': '+a[lang].b).join('\n')+'\n\nQuestion: '+q}]}]})});
      if(res.ok){const data=await res.json();const t=((data.candidates||[])[0]||{}).content;const ans=((t&&t.parts)||[]).map(p=>p.text).join('\n');if(ans)$('#helpA',el).innerHTML=html+'<p><b>Gemini</b><br>'+esc(ans).replace(/\n/g,'<br>')+'</p>'}}catch(e){}}};
};
function lastStayEnd(g){const stays=allBookings().filter(b=>b.guestId===g.id&&['inhouse','confirmed','tentative','out'].includes(b.status));if(stays.some(b=>['inhouse','confirmed','tentative'].includes(b.status)&&b.dep>=H.set.bd))return null;const outs=stays.filter(b=>b.status==='out');if(!outs.length)return null;return outs.map(b=>b.statusDate).sort().pop()}
function purgeGuest(g){g.purged=true;g.last='Purged';g.first='';g.middle='';g.other='';g.email='';g.phone='';g.address='';g.photo='';g.socialId='';g.birthday='';g.remark='';if(g.doc)g.doc={type:'',no:'',place:'',ptype:'',issued:'',expiry:'',visaType:'',visaNo:'',visaPlace:'',visaIssue:'',visaExpiry:'',stayExpiry:''};g.card=null}
VIEWS['prov.cloud']=el=>{
  el.innerHTML=pageHead('Cloud database')+`<div class="panel pad" style="max-width:640px"><p>Supabase is the shared copy of this hotel file. Reservations, folios, shifts, and staff sign-in travel with it. Full card numbers stay in the browser that took the payment and are not uploaded.</p>
    <p class="sub">In the Supabase project, open the SQL editor and run <b>supabase/schema.sql</b> from this site's repository. Then copy the project URL and the anon public key from Project Settings → API.</p>
    ${cloudFormHtml()}
    <div class="btns"><button class="btn gold" id="clGo">Connect</button><button class="btn" id="clPull">Download</button><button class="btn" id="clPush">Upload</button><button class="btn ghost" id="clOff">Disconnect this browser</button></div></div>`;
  fillCloudForm(el);
  $('#clGo',el).onclick=()=>cloudConnect(el);
  $('#clPull',el).onclick=async()=>{try{const r=await cloudPull({render:true});toast(r==='pulled'?'Downloaded the cloud copy':r==='empty'?'The cloud database is still empty':'This browser already has the latest copy')}catch(e){toast('Download did not finish')}};
  $('#clPush',el).onclick=async()=>{try{await cloudPush();fillCloudForm(el);toast('Uploaded to Supabase')}catch(e){const m=String(e.message||'');toast(m.includes('unauthorized')?'Passphrase does not match':'Upload did not finish')}};
  $('#clOff',el).onclick=()=>{localStorage.removeItem(CLOUDKEY);fillCloudForm(el);toast('This browser is disconnected. The cloud copy is still there.')};
};
VIEWS['prov.security']=el=>{
  el.innerHTML=pageHead('Security Center',provHotelPicker())+`<div id="secB"></div>`;
  const paint=()=>{const box=$('#secB',el);if(!box||!H)return;const own=(H.users||[]).filter(u=>u.owner||u.protected);const due=(H.guests||[]).filter(g=>!g.purged).map(g=>({g,end:lastStayEnd(g)})).filter(x=>x.end&&diff(x.end,H.set.bd)>365*2);
    const closed=(H.shifts||[]).filter(s=>s.status==='closed').slice(-12).reverse();
    box.innerHTML=`<div class="cols2"><div class="panel pad"><h3>Auto-lock</h3><p class="sub">After this many quiet minutes the screen asks for the password. The shift stays open. 0 turns it off.</p>
      ${fld('Minutes',`<input id="secIdle" class="n" value="${H.set.idleMin==null?15:H.set.idleMin}">`)}<button class="btn" id="secIdleS">Save</button>
      <h3 class="mt">Approvals for this hotel</h3><div class="featgrid">${[['vatRebate','VAT rebate'],['nonVatRebate','Non-VAT rebate'],['refund','Refund'],['voidPay','Void payment']].map(([k,l])=>`<label class="chk"><input type="checkbox" data-ap="${k}" ${needsApproval(k)?'checked':''}> ${l}</label>`).join('')}</div><button class="btn mt" id="secAp">Save approvals</button></div>
      <div class="panel pad"><h3>Owner account</h3>${own.map(u=>`<p><b>${esc(u.username)}</b> · ${esc(u.position||u.role)} · protected</p>`).join('')||'<p class="sub">No owner is marked yet. The first manager is protected when the hotel file is opened.</p>'}
      <p class="sub">A manager cannot deactivate this account. It stays on the hotel.</p>
      <h3 class="mt">Closed shifts</h3><table class="grid"><tr><th>User</th><th>Shift</th><th>Date</th><th></th></tr>${closed.map(s=>`<tr><td>${esc(s.userName)}</td><td>${esc(s.name)}</td><td>${fd(s.bd)}</td><td>${s.reopenOk?'<span class="pill g">May open again</span>':`<button class="btn sm" data-re="${s.id}">Allow again</button>`}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No closed shift on this file yet.</td></tr>'}</table></div></div>
      <div class="panel mt"><div class="ph">Guest data older than 2 years</div><div class="scroll"><table class="grid"><tr><th>Guest</th><th>Last stay ended</th><th></th></tr>${due.map(x=>`<tr><td>${esc(gName(x.g))}</td><td>${fd(x.end)}</td><td><button class="btn sm ghost" data-pg="${x.g.id}">Purge</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">No guest is past the 2-year keep. Active stays and the two years after the last stay are kept.</td></tr>'}</table></div>
      ${due.length?`<div class="btns"><button class="btn red" id="secAll">Purge all listed</button></div>`:''}</div>
      <div class="panel mt"><div class="ph">Waiting approvals</div>${approvalTable((H.approvals||[]).filter(a=>a.status==='pending'),true)}</div>`;
    $('#secIdleS',box).onclick=()=>{H.set.idleMin=Math.max(0,+$('#secIdle',box).value||0);provLog('Auto-lock '+H.set.idleMin+' min for '+H.code);saveDB();toast('Auto-lock saved')};
    $('#secAp',box).onclick=()=>{H.set.approvals=H.set.approvals||{};$$('[data-ap]',box).forEach(c=>{H.set.approvals[c.dataset.ap]=c.checked});provLog('Approval switches saved for '+H.code);saveDB();toast('Approvals saved')};
    $$('[data-re]',box).forEach(b=>b.onclick=()=>{const s=H.shifts.find(x=>x.id===b.dataset.re);if(!s)return;s.reopenOk=true;provLog('Allowed reopen of '+s.userName+' '+s.name+' '+s.bd+' at '+H.code);saveDB();paint();toast('That shift may be opened again')});
    const purge=g=>{if(!confirm(`Purge personal data for ${gName(g)}? Folio amounts stay. This is not undone.`))return false;purgeGuest(g);provLog('Purged guest data '+g.profileId+' at '+H.code);return true};
    $$('[data-pg]',box).forEach(b=>b.onclick=()=>{const g=H.guests.find(x=>x.id===b.dataset.pg);if(g&&purge(g)){saveDB();paint()}});
    if($('#secAll',box))$('#secAll',box).onclick=()=>{if(!confirm(`Purge personal data for ${due.length} guests? Folio amounts stay.`))return;due.forEach(x=>purgeGuest(x.g));provLog('Purged '+due.length+' guest profiles at '+H.code);saveDB();paint();toast('Listed guests purged')};
    $$('[data-apy]',box).forEach(b=>b.onclick=()=>{const a=H.approvals.find(x=>x.id===b.dataset.apy);if(!a)return;if(applyApproval(a)){a.status='approved';a.decidedAt=Date.now();a.decidedBy=user().name;provLog('Approved '+a.title);saveDB();paint()}});
    $$('[data-apn]',box).forEach(b=>b.onclick=()=>{const a=H.approvals.find(x=>x.id===b.dataset.apn);if(!a)return;a.status='rejected';a.decidedAt=Date.now();a.decidedBy=user().name;provLog('Rejected '+a.title);saveDB();paint()});
  };
  bindPicker(el);const sel=$('#pvH',el);if(sel)sel.addEventListener('change',()=>setTimeout(paint,0));paint();
};
let _idle,_sessTouch=0;
function touchLiveSession(){
  if(!DB||!DB.session)return;
  if(!sessionValid(DB.session)){DB.session=null;H=null;clearLiveSession();saveDB();showLogin('Your session ended. Sign in again.');return}
  const now=Date.now();
  if(now-_sessTouch<30000)return;
  _sessTouch=now;
  stampSession(DB.session);
  writeLiveSession(DB.session);
}
function armIdle(){clearTimeout(_idle);touchLiveSession();if(document.getElementById('idleLock'))return;if(!DB||!DB.session||!H)return;const mins=+(H.set&&H.set.idleMin)||0;if(mins<=0)return;if(DB.session.provider&&!DB.session.inHotel)return;_idle=setTimeout(showIdleLock,mins*60000)}
function showIdleLock(){if(document.getElementById('idleLock')||!DB||!DB.session)return;const d=document.createElement('div');d.id='idleLock';d.className='idlelock';
  d.innerHTML=`<div class="panel pad"><h2>Screen locked</h2><p>Your shift stays open. Type your password to continue as <b>${esc(user().name)}</b>.</p><label class="f"><span>Password</span><input id="idlePw" type="password"></label><div class="err" id="idleE"></div><div class="btns"><button class="btn gold" id="idleGo">Unlock</button></div></div>`;
  document.body.appendChild(d);const go=()=>{const pw=$('#idlePw').value;let ok=false;if(DB.session.provider){const p=DB.providers.find(x=>x.id===DB.session.userId);ok=!!(p&&p.hash===pwHash(p.salt,pw))}else{const u=H&&H.users.find(x=>x.id===DB.session.userId);ok=!!(u&&u.hash===pwHash(u.salt,pw))}
    if(!ok){$('#idleE').textContent='Password is not correct.';return}d.remove();armIdle()};
  $('#idleGo').onclick=go;$('#idlePw').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>{const i=$('#idlePw');i&&i.focus()},40)}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(!document.getElementById('idleLock'))armIdle()}));

/* ================= boot ================= */
window.addEventListener('DOMContentLoaded',()=>{
  loadDB();
  let booted=false;
  const startApp=()=>{if(booted)return;booted=true;ensureMasterProvider();
    if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
    window.addEventListener('storage',e=>{if((e.key!==DBKEY&&e.key!==DBKEY4)||!e.newValue||location.hash==='#reports')return;
      try{const d=JSON.parse(e.newValue);if(!d||!d.savedAt||d.savedAt<=(DB.savedAt||0))return;
        const live=DB.session;DB=migrateDB(d);DB.session=live&&sessionValid(live)?live:null;
        if(DB.session)writeLiveSession(DB.session);else clearLiveSession();
        bindHotel();
        if(!DB.session){showLogin();return}renderShell();render()}catch(err){}});
    if(location.hash==='#reports'){document.body.classList.add('rpmode');renderReports(document.getElementById('app'),false);
      window.addEventListener('storage',e=>{if(e.key===DBKEY||e.key===DBKEY4)loadFresh()});return}
    const finish=()=>{
      applyLiveSession();
      if(DB.session&&H&&(DB.session.provider||curShift())){renderShell();
      if(DB.session.provider&&!DB.session.inHotel)go('prov.home');
      else go(firstHotelView());
      if(location.hash==='#systems'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){} setTimeout(openSystemsSwitcher,40)}}
      else{DB.session=null;H=null;clearLiveSession();saveDB({keepTime:true,nocloud:true});showLogin()}};
    Promise.race([cloudPull().catch(()=>{}),new Promise(r=>setTimeout(r,8000))]).then(finish,finish)};
  setTimeout(startApp,1500);
  hydrateFromIDB().then(startApp,startApp);
});
