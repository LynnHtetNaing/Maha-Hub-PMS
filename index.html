<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maha Hub</title>
<meta name="description" content="Maha Hub. The property system is at /ecosystem.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="theme-color" content="#0A3020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#0A3020;--gold:#E8B058;--ivory:#F7F3EA}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#23654b,var(--green));color:var(--ivory);font:16px/1.5 "Noto Sans",Tahoma,sans-serif}
  main{text-align:center;padding:40px 20px;max-width:32rem}
  img{width:96px;height:96px}
  h1{font-family:"Cinzel",Georgia,serif;font-weight:700;letter-spacing:.12em;font-size:clamp(1.6rem,4vw,2.2rem);margin:18px 0 8px}
  p{margin:0;color:rgba(247,243,234,.88)}
  a{display:inline-block;margin-top:22px;background:linear-gradient(180deg,var(--gold),#D49A38);color:#1e1606;text-decoration:none;font-weight:700;padding:11px 20px;border-radius:6px}
  a:hover{filter:brightness(1.05)}
</style>
</head>
<body>
<main>
  <img src="icons/maha-mark-sq.png" alt="Maha Hub">
  <h1>Maha Hub</h1>
  <p>The website lives here. The property system is on its own path.</p>
  <a href="ecosystem/">Open PMS</a>
</main>
</body>
</html>
