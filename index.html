function ensureMasterProvider(){
  if(!DB) return;
  if(!DB.providers) DB.providers=[];
  let m=DB.providers.find(u=>u.id==='p1');
  let changed=false;
  if(!m){
    m=mkUser('p1','mahaadmin','Maha Administrator','Provider','Maha@2026');
    m.protected=true;
    DB.providers.unshift(m);
    changed=true;
  }else{
    if(m.hash===pwHash(m.salt,'Padauk@2026')){m.salt=newSalt();m.hash=pwHash(m.salt,'Maha@2026');changed=true}
    if(m.username!=='mahaadmin'){m.username='mahaadmin';changed=true}
    if(m.name!=='Maha Administrator'){m.name='Maha Administrator';changed=true}
    if(m.role!=='Provider'){m.role='Provider';changed=true}
    if(!m.protected){m.protected=true;changed=true}
    if(m.active!==true){m.active=true;changed=true}
  }
  if(changed) saveDB();
}
function defaultFeatures(){return {city:true,petty:true,buy:true,roster:true,groups:true,tax:true,help:true,ai:true,dashboard:true,confirm:true}}
function shapeHotel(h){
  if(!h||!h.set)return;
  h.cityLedger=Array.isArray(h.cityLedger)?h.cityLedger:[];
  h.petty=Array.isArray(h.petty)?h.petty:[];
  if(h.pettyFloat==null)h.pettyFloat=0;
  h.suppliers=Array.isArray(h.suppliers)?h.suppliers:[];
  h.purchases=Array.isArray(h.purchases)?h.purchases:[];
  h.groups=Array.isArray(h.groups)?h.groups:[];
  h.roster=Array.isArray(h.roster)?h.roster:[];
  h.approvals=Array.isArray(h.approvals)?h.approvals:[];
  h.mailLog=Array.isArray(h.mailLog)?h.mailLog:[];
  h.taxCopies=Array.isArray(h.taxCopies)?h.taxCopies:[];
  if(!Array.isArray(h.shiftCodes)||!h.shiftCodes.length)h.shiftCodes=[
    {code:'M',name:'Morning',from:'06:00',to:'14:00'},{code:'A',name:'Afternoon',from:'14:00',to:'22:00'},
    {code:'N',name:'Night',from:'22:00',to:'06:00'},{code:'O',name:'Off',from:'',to:''}];
  h.set.features=Object.assign(defaultFeatures(),h.set.features||{});
  const ff=h.set.features;
  if(typeof FEAT_LEGACY!=='undefined')Object.entries(FEAT_LEGACY).forEach(([k,leg])=>{if(ff[leg]===false&&!Object.prototype.hasOwnProperty.call(ff,k))ff[k]=false});
  if(ff['fn.fo.grid']===false){if(!Object.prototype.hasOwnProperty.call(ff,'fn.res.grid'))ff['fn.res.grid']=false;if(!Object.prototype.hasOwnProperty.call(ff,'fn.rm.grid'))ff['fn.rm.grid']=false}
  if(ff['fn.fo.status']===false&&!Object.prototype.hasOwnProperty.call(ff,'fn.inq.status'))ff['fn.inq.status']=false;
  if(ff['fn.inq.forecast']===false&&!Object.prototype.hasOwnProperty.call(ff,'fn.fo.forecast'))ff['fn.fo.forecast']=false;
  if(!h.set.plan&&typeof detectPlan==='function')h.set.plan=detectPlan(ff);
  h.set.approvals=Object.assign({vatRebate:true,nonVatRebate:true,refund:true,voidPay:true},h.set.approvals||{});
  ['aiKey','geminiKey','logo','signature'].forEach(k=>{if(h.set[k]==null)h.set[k]=''});
  if(h.set.idleMin==null)h.set.idleMin=15;
  if(h.set.bfAdult==null)h.set.bfAdult=h.set.cur==='MMK'?4000:150;
  if(!h.set.confirmTpl)h.set.confirmTpl='Dear {{guest}},\n\nYour stay at {{hotel}} is confirmed.\nReservation {{rsvn}}\nArrival {{arr}}    Departure {{dep}}\nRoom {{room}} ({{type}}) · {{nights}} night(s)\nGuests {{adults}} adult(s), {{children}} child(ren)\n\nWe look forward to welcoming you.\n\n{{signature}}';
  h.set.google=Object.assign({
    enabled:false,lat:'',lng:'',countryCode:'',category:'hotel',amenities:[],cancelPolicy:'',photoUrl:'',brand:'Maha Booking',bookBaseUrl:''
  },h.set.google||{});
  if(!Array.isArray(h.set.google.amenities))h.set.google.amenities=[];
  h.set.systems=Object.assign({reach:false,connect:false},h.set.systems||{});
  h.set.rules=Object.assign({},DEFAULT_RULES,h.set.rules||{});
  (h.rateCodes||[]).forEach(r=>{if(r.meal==='ABF'&&(r.bfAdult==null||r.bfAdult===''))r.bfAdult=h.set.bfAdult});
  (h.companies||[]).forEach(c=>{if(c.creditLimit==null)c.creditLimit=0});
  h.amend=h.amend||[];h.audits=h.audits||[];h.logs=h.logs||[];h.invoices=h.invoices||[];
  h.edcLinks=Array.isArray(h.edcLinks)?h.edcLinks:[];
  if(h.users&&h.users.length&&!h.users.some(u=>u.owner)){const m=h.users.find(u=>u.role==='Manager')||h.users[0];m.owner=true;m.protected=true}
}
function migrateDB(db){
  if(!db||!db.hotels||(db.version||0)<4) return seedDB();
  Object.values(db.hotels).forEach(h=>{shapeHotel(h);if(typeof ensureDummyBooking==='function')ensureDummyBooking(h)});
  db.providers=db.providers||[];db.provLog=db.provLog||[];db.version=5;
  return db;
}
function bindHotel(){H=(DB.session&&DB.session.hotel&&DB.hotels[DB.session.hotel])?DB.hotels[DB.session.hotel]:null}
function readLiveSession(){
  try{
    const raw=sessionStorage.getItem(SESSKEY);
    if(!raw)return null;
    const se=JSON.parse(raw);
    return se&&typeof se==='object'?se:null;
  }catch(e){return null}
}
function writeLiveSession(se){
  try{
    if(!se){sessionStorage.removeItem(SESSKEY);return}
    sessionStorage.setItem(SESSKEY,JSON.stringify(se));
  }catch(e){}
}
function clearLiveSession(){try{sessionStorage.removeItem(SESSKEY)}catch(e){}}
function stampSession(se){
  if(!se)return null;
  const now=Date.now();
  if(!se.at)se.at=now;
  se.last=now;
  return se;
}
function applyLiveSession(){
  if(!DB)return;
  /* Never trust a persisted DB.session — only this browser tab session. */
  const live=readLiveSession();
  if(live&&sessionValid(live)){DB.session=live;writeLiveSession(live)}
  else{DB.session=null;clearLiveSession()}
  bindHotel();
}
function loadDB(){
  let raw=null;
  try{raw=localStorage.getItem(DBKEY)||localStorage.getItem(DBKEY4)}catch(e){raw=null}
  let parsed=null;if(raw){try{parsed=JSON.parse(raw)}catch(e){parsed=null}}
  DB=parsed?migrateDB(parsed):seedDB();
  /* Drop any leftover session that was saved into the hotel file before this change. */
  DB.session=null;
  applyLiveSession();
}
function idbOpen(){return new Promise((res,rej)=>{
  if(!window.indexedDB){rej(new Error('no idb'));return}
  const r=indexedDB.open('mahahub-pms',1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
})}
function idbReq(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function idbGet(store,key){const d=await idbOpen();return idbReq(d.transaction(store,'readonly').objectStore(store).get(key))}
async function idbSet(store,key,val){const d=await idbOpen();return idbReq(d.transaction(store,'readwrite').objectStore(store).put(val,key))}
async function hydrateFromIDB(){
  try{const saved=await idbGet('kv','main');
    if(saved&&saved.hotels&&(saved.savedAt||0)>((DB&&DB.savedAt)||0)){DB=migrateDB(saved);DB.session=null;applyLiveSession()}}catch(e){}
}
async function listSnaps(){try{const d=await idbOpen();const all=await idbReq(d.transaction('snaps','readonly').objectStore('snaps').getAll());return (all||[]).filter(x=>x&&x.db).sort((a,b)=>b.at-a.at)}catch(e){return []}}
async function trimSnaps(){
  try{const d=await idbOpen();const keys=await idbReq(d.transaction('snaps','readonly').objectStore('snaps').getAllKeys());
    keys.sort();const extra=keys.slice(0,Math.max(0,keys.length-14));if(!extra.length)return;
    const tx=d.transaction('snaps','readwrite');extra.forEach(k=>tx.objectStore('snaps').delete(k));await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}
}
let _saveQ=0;
function saveDB(opt){
  if(!DB)return;
  DB.version=5;
  if(!(opt&&opt.keepTime)) DB.savedAt=Date.now();
  if(DB.session)stampSession(DB.session);
  /* Persist hotel data without the signed-in session so a closed browser cannot reopen logged-in. */
  const keep=DB.session;DB.session=null;
  let raw='';
  try{raw=JSON.stringify(DB)}catch(e){DB.session=keep;toast('This browser storage is full. Download a backup, then remove large guest photos.');return}
  DB.session=keep;
  if(keep)writeLiveSession(keep);else clearLiveSession();
  try{localStorage.setItem(DBKEY,raw)}catch(e){toast('This browser storage is full. Download a backup, then remove large guest photos.')}
  let copy=null;try{copy=JSON.parse(raw)}catch(e){copy=null}
  const n=++_saveQ,stamp=DB.savedAt,day=iso(new Date());
  if(copy)idbSet('kv','main',copy).then(()=>{if(n!==_saveQ)return;return idbGet('kv','snapDay')}).then(prev=>{
    if(n!==_saveQ||prev===day)return;
    return idbSet('snaps','s'+stamp,{at:stamp,day,db:copy}).then(()=>idbSet('kv','snapDay',day)).then(trimSnaps);
  }).catch(()=>{});
  if(!(opt&&opt.nocloud)&&!_cloudApplying) scheduleCloudPush();
}

let _cloudApplying=false,_cloudT=0,_cloudErrAt=0;
function cloudCfg(){try{return JSON.parse(localStorage.getItem(CLOUDKEY)||'null')}catch(e){return null}}
function saveCloudCfg(c){localStorage.setItem(CLOUDKEY,JSON.stringify(c))}
function cloudUrl(raw){const u=String(raw||'').trim().replace(/\/+$/,'');return (/^https:\/\/[a-z0-9.-]+\.[a-z]{2,}(?::\d+)?$/i.test(u)||/^http:\/\/127\.0\.0\.1:\d+$/i.test(u))?u:''}
function cloudStrip(db){
  const o=JSON.parse(JSON.stringify(db));
  delete o.session;delete o.cardVault;
  const walk=v=>{if(!v||typeof v!=='object')return;if(Array.isArray(v)){v.forEach(walk);return}delete v.pan;delete v.cvc;delete v.cvv;Object.keys(v).forEach(k=>walk(v[k]))};
  walk(o);return o;
}
function sessionValid(se){
  if(!se||!DB)return false;
  const now=Date.now();
  const started=+se.at||0;
  const last=+se.last||started||0;
  if(!started||(now-started)>SESSION_MAX_MS)return false;
  if(last&&(now-last)>SESSION_MAX_MS)return false;
  if(se.provider)return (DB.providers||[]).some(p=>p.id===se.userId&&p.active!==false);
  const h=DB.hotels&&DB.hotels[se.hotel];if(!h)return false;
  const u=(h.users||[]).find(x=>x.id===se.userId);if(!u||u.active===false)return false;
  if(se.shiftId&&!(h.shifts||[]).some(s=>s.id===se.shiftId&&s.status==='open'))return false;
  return true;
}
async function cloudRpc(name,body){
  const c=cloudCfg();if(!c||!c.url||!c.anon)throw new Error('NOCFG');
  const headers={'Content-Type':'application/json','apikey':c.anon};
  if(!/^sb_/.test(c.anon)) headers.Authorization='Bearer '+c.anon;
  const res=await fetch(c.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+name,{method:'POST',headers,body:JSON.stringify(body)});
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch(e){data={message:text}}
  if(!res.ok)throw new Error((data&&(data.message||data.error||data.msg))||('HTTP '+res.status));
  return data;
}
function markCloudCursor(ms){const c=cloudCfg()||{};c.cursor=ms;c.syncedAt=Date.now();saveCloudCfg(c)}
function adoptCloud(payload,remoteAt,opt){
  const session=DB&&DB.session,vault=DB&&DB.cardVault,logos=DB&&DB.payLogos;
  _cloudApplying=true;
  try{
    DB=migrateDB(payload);
    DB.cardVault=vault||[];
    if(logos)DB.payLogos=logos;
    DB.savedAt=remoteAt||Date.now();
    DB.session=session&&sessionValid(session)?session:null;
    if(DB.session)writeLiveSession(DB.session);else clearLiveSession();
    bindHotel();
    saveDB({keepTime:true,nocloud:true});
    markCloudCursor(DB.savedAt);
  }finally{_cloudApplying=false}
  if(opt&&opt.render){if(DB.session){renderShell();render()}else showLogin('This hotel was loaded from the cloud.')}
}
async function cloudPush(){
  if(_cloudApplying||!DB)return;
  const c=cloudCfg();if(!c||!c.url||!c.anon||!c.pass)return;
  const payload=cloudStrip(DB);
  const client_updated=new Date(DB.savedAt||Date.now()).toISOString();
  const res=await cloudRpc('maha_push',{pass:c.pass,payload,client_updated});
  if(res&&res.conflict){adoptCloud(res.payload,Date.parse(res.updated_at)||Date.now(),{render:true});toast('The cloud copy was newer. This screen is showing that copy.');return}
  markCloudCursor(DB.savedAt||Date.now());
}
function scheduleCloudPush(){const c=cloudCfg();if(!c||!c.url||!c.anon||!c.pass)return;clearTimeout(_cloudT);_cloudT=setTimeout(()=>{cloudPush().catch(e=>{const now=Date.now();if(now-_cloudErrAt<60000)return;_cloudErrAt=now;toast('Cloud save did not finish. This browser still has the hotel file.')})},800)}
async function cloudPull(opt){
  const c=cloudCfg();if(!c||!c.url||!c.anon||!c.pass||!DB)return 'off';
  let data;
  try{data=await cloudRpc('maha_pull',{pass:c.pass})}
  catch(e){
    if(opt&&opt.init&&String(e.message||'').includes('no-secret')){await cloudRpc('maha_init',{pass:c.pass});await cloudPush();return 'created'}
    throw e;
  }
  if(!data||data.empty){if(opt&&opt.init){await cloudPush();return 'pushed'}return 'empty'}
  const remoteAt=Date.parse(data.updated_at)||0,cursor=+(c.cursor||0),localAt=+(DB.savedAt||0);
  if(!cursor||remoteAt>localAt){adoptCloud(data.payload,remoteAt,opt&&opt.render?{render:true}:null);return 'pulled'}
  if(localAt>cursor){await cloudPush();return 'pushed-local'}
  return 'same';
}
function fillCloudForm(root){
  const c=cloudCfg()||{};
  const url=$('#clUrl',root),key=$('#clKey',root),pass=$('#clPass',root),st=$('#clSt',root);
  if(url)url.value=c.url||'';if(key)key.value=c.anon||CLOUD_PUBLISHABLE;if(pass)pass.value=c.pass||'';
  if(st)st.textContent=c.syncedAt?('Last sync '+fdt(c.syncedAt)+'. Staff sign-in travels with the hotel file. Full card numbers stay on the computer that took the payment.'):'The publishable key is filled in. Paste the project URL from Supabase (https://xxxx.supabase.co), run supabase/schema.sql in the SQL editor, choose a passphrase, then click Connect.';
}
async function cloudConnect(root){
  root=root||document;
  const url=cloudUrl($('#clUrl',root)&&$('#clUrl',root).value),anon=($('#clKey',root)&&$('#clKey',root).value||'').trim(),pass=$('#clPass',root)&&$('#clPass',root).value,st=$('#clSt',root);
  if(!url){if(st)st.textContent='Enter the Supabase project URL. It starts with https://';return}
  if(anon.length<20||/\s/.test(anon)){if(st)st.textContent='Enter the anon public key from Supabase → Project Settings → API.';return}
  if(!pass||pass.length<8){if(st)st.textContent='Choose a passphrase of at least 8 characters. The same passphrase is typed on every computer.';return}
  const prev=cloudCfg()||{};
  saveCloudCfg({url,anon,pass,cursor:prev.url===url?prev.cursor:0,syncedAt:prev.syncedAt||0});
  if(st)st.textContent='Connecting…';
  try{
    const r=await cloudPull({init:true,render:true});
    const msg=r==='created'?'This browser set the passphrase and uploaded the hotel file.':r==='pushed'||r==='pushed-local'?'Uploaded this hotel file to Supabase.':r==='pulled'?'Downloaded the hotel file from Supabase.':'Connected. This browser already matches the cloud.';
    if($('#clSt',root||document)){$('#clSt',root).textContent=msg}else if(st)st.textContent=msg;
    toast('Cloud database connected');
  }catch(e){
    const m=String(e.message||e);
    const nice=m.includes('unauthorized')?'That passphrase does not match this Supabase project.':m.includes('already-set')?'A passphrase is already set on this project.':(m.includes('Failed to fetch')||m.includes('NetworkError')||m.includes('Load failed'))?'Supabase did not answer. Check the project URL.':'Supabase refused the connection. Run supabase/schema.sql in the SQL editor, then try again. '+m.slice(0,160);
    if(st)st.textContent=nice;
  }
}

  const mark=id=>{$$('[data-plan]',root).forEach(b=>b.classList.toggle('gold',b.dataset.plan===id));const n=$('#planNote',root);if(n)n.textContent=(HOTEL_PLANS[id]||HOTEL_PLANS.custom).note;root.dataset.chosen=id};
  $$('[data-plan]',root).forEach(b=>b.onclick=()=>{mark(b.dataset.plan);if(b.dataset.plan==='custom')return;const flags=flagsForPlan(b.dataset.plan);$$('[data-fn]',root).forEach(c=>{c.checked=!!flags[c.dataset.fn]})});

let MODALS=[];
function modal(title,html,o={}){
  const wrap=document.createElement('div');wrap.className='mwrap';wrap.style.zIndex=60+MODALS.length*2;
  wrap.innerHTML=`<div class="modal ${o.cls||''}" role="dialog" aria-modal="true" style="${o.w?'width:min('+o.w+'px,97vw)':''}"><div class="mhead"><span>${title}</span><button class="mx" aria-label="Close">×</button></div><div class="mbody">${html}</div></div>`;
  document.body.appendChild(wrap);MODALS.push(wrap);
  wrap.querySelector('.mx').onclick=()=>closeModal(wrap);
  setTimeout(()=>{const f=wrap.querySelector('[autofocus]');f&&f.focus()},40);
  const m=wrap.querySelector('.modal');m._wrap=wrap;return m;
}
function closeModal(w){w=w&&w._wrap?w._wrap:(w||MODALS[MODALS.length-1]);if(!w)return;w.remove();MODALS=MODALS.filter(x=>x!==w);if(w._onclose)w._onclose()}
function closeAllModals(){while(MODALS.length)closeModal()}

async function edcCloudRpc(name,body,opt){

async function edcCloudSyncHotel(){
  if(!H)return 0;
  shapeHotel(H);
  let n=0;
  const c=cloudCfg();
  if(c&&c.url&&c.pass){
    try{
      const rows=await edcCloudRpc('maha_edc_list',{pass:c.pass,hotel:H.code});
      (Array.isArray(rows)?rows:[]).forEach(row=>{
        const L=edcFromCloudRow(row);
        const i=H.edcLinks.findIndex(x=>x.id===L.id);
        if(i>=0){
          const prev=H.edcLinks[i];
          H.edcLinks[i]=Object.assign({},prev,L,{card:L.card||prev.card||null});
          edcBridgePut(Object.assign({hotel:H.code},H.edcLinks[i]));
        }else{
          H.edcLinks.unshift(L);
          edcBridgePut(Object.assign({hotel:H.code},L));
        }
        n++;
      });
    }catch(e){/* schema may not be installed yet */}
  }
  /* Same-browser bridge: guest phone on another device needs Cloud; same PC still works. */
  edcBridgeAll().links.filter(x=>x.hotel===H.code).forEach(L=>{
    const i=H.edcLinks.findIndex(x=>x.id===L.id);
    if(i<0){H.edcLinks.unshift(L);n++}
    else{
      const cur=H.edcLinks[i];
      if((L.submittedAt||0)>(cur.submittedAt||0)||(L.card&&!cur.card)||(L.status==='submitted'&&cur.status==='waiting')){
        H.edcLinks[i]=Object.assign({},cur,L);n++;
      }
    }
  });
  if(n)saveDB();
  return n;
}

function doLogin(){
  const err=$('#lgErr');if(!err)return;
  if(Date.now()<lockUntil){err.textContent=`Too many wrong attempts. Try again in ${Math.ceil((lockUntil-Date.now())/1000)} seconds.`;return}
  const un=$('#lgUser').value.trim().toLowerCase(),pw=$('#lgPass').value;
  if(!un||!pw){err.textContent='Enter your username and password.';return}
  try{if($('#lgRemember')&&$('#lgRemember').checked)localStorage.setItem('maha.rememberUser',un);else localStorage.removeItem('maha.rememberUser')}catch(e){}
  const fail=()=>{fails++;if(fails>=5){lockUntil=Date.now()+60000;fails=0}err.textContent='Username or password is not correct.';$('#lgPass').value='';$('#lgPass').focus()};
  const enterStaffSystem=(h)=>{
    const sys=lgTargetSys||'hub';
    const avail=hotelSystems(h).find(x=>x.kind===sys);
    const who=u.username,shift=s.name;
    if(!avail||!avail.open){
      toast('That system is closed for this hotel. Opening Maha PMS.');
      renderShell();go(firstHotelView());return
    }
    if(sys==='hub'){renderShell();go(firstHotelView());toast(`Welcome ${who}. ${shift} shift, ${fd(h.set.bd)}.`);return}
    renderShell();go(firstHotelView());
    openSystem(sys,h);toast(`Welcome ${who}. Opening ${ecoSysLabel(sys)}.`);
  };
  const pv=DB.providers.find(x=>x.username===un);if(pv){if(pv.hash!==pwHash(pv.salt,pw))return fail();fails=0;
    const finish=(how)=>{const first=Object.keys(DB.hotels)[0];DB.session=stampSession({provider:true,userId:pv.id,hotel:first});H=DB.hotels[first];
      DB.provLog.unshift({at:Date.now(),user:pv.name,a:'Provider signed in'+(how?' ('+how+')':'')+(pv.email&&pv.emailAlerts!==false?' – alert emailed to '+pv.email:'')});writeLiveSession(DB.session);saveDB();renderShell();go(pv.mfa&&pv.mfa.enabled?'prov.home':'prov.account')};
    if(pv.mfa&&pv.mfa.enabled){providerSecondStep(pv,()=>finish('with Google Authenticator'));return}finish('');return}
  const f=findStaff(un);if(!f)return fail();const {h,u}=f;if(u.active===false||u.hash!==pwHash(u.salt,pw))return fail();const hc=h.code;
  if(h.active===false){err.textContent='This hotel is not active yet. Please contact Padauk support.';return}
  fails=0;H=h;let s=h.shifts.find(x=>x.userId===u.id&&x.status==='open');
  if(!s&&lgShift==='Night'&&!nightOkFor(u,h)){err.textContent='The Night shift is only for Front Office and HOD.';return}
  if(!s){const closed=h.shifts.find(x=>x.userId===u.id&&x.name===lgShift&&x.bd===h.set.bd&&x.status==='closed'&&!x.reopenOk);
    if(closed&&ruleOn(h,'blockClosedShiftReopen')){err.textContent=`The ${lgShift} shift for ${fd(h.set.bd)} is already closed. The provider must allow it to be opened again.`;return}
    s={id:'s'+uid(),userId:u.id,userName:u.username,role:u.role,name:lgShift,bd:h.set.bd,openAt:Date.now(),openCash:Math.max(0,+$('#lgCash').value||0),status:'open',dept:u.position||u.role};h.shifts.push(s);DB.session=stampSession({hotel:hc,userId:u.id,shiftId:s.id});log(`Opened ${s.name} shift`)}
  else{DB.session=stampSession({hotel:hc,userId:u.id,shiftId:s.id});log(`Signed in, continued ${s.name} shift`)}
  writeLiveSession(DB.session);saveDB();enterStaffSystem(h)}

function roomIsVC(rm,exceptId){if(!rm||rm.dummy||rm.hk!=='clean')return false;const bd=H.set.bd;
  if(rm.ooo&&rm.ooo.from<=bd&&bd<=rm.ooo.to)return false;
  return !allBookings().some(x=>x.room===rm.no&&x.status==='inhouse'&&x.id!==exceptId)}
function hkShort(rm){if(!rm)return '';if(rm.ooo&&rm.ooo.from<=H.set.bd&&H.set.bd<=rm.ooo.to)return 'OOO';
  const occ=allBookings().some(b=>b.room===rm.no&&b.status==='inhouse');
  if(rm.hk==='dirty')return occ?'OD':'VD';if(rm.hk==='inspected')return occ?'OI':'VI';return occ?'OC':'VC'}
function vcBlock(rm,exceptId){if(!rm)return 'Assign a vacant clean (VC) room before check-in.';
  if(rm.dummy)return 'A dummy room cannot be checked in.';
  if(rm.ooo&&rm.ooo.from<=H.set.bd&&H.set.bd<=rm.ooo.to)return `Room ${rm.no} is out of order.`;
  if(allBookings().some(x=>x.room===rm.no&&x.status==='inhouse'&&x.id!==exceptId))return `Room ${rm.no} is occupied.`;
  if(rm.hk==='dirty')return `Room ${rm.no} is vacant dirty (VD). Housekeeping must mark it vacant clean (VC) before check-in.`;
  if(rm.hk==='inspected')return `Room ${rm.no} is inspected (VI). Check-in is only for a vacant clean (VC) room.`;
  if(rm.hk!=='clean')return `Room ${rm.no} is not vacant clean (VC).`;
  return ''}
function autoRoom(B){return H.rooms.find(r=>r.type===B.type&&!r.softBlock&&!r.dummy&&roomFree(r.no,B.arr,B.dep,B.id)&&roomIsVC(r,B.id))||null}
function checkIn(B,express){

function arrivalsFor(d){return allBookings().filter(b=>b.arr===d&&['confirmed','tentative'].includes(b.status))}
const pendingArrivals=()=>allBookings().filter(b=>b.arr<=H.set.bd&&['confirmed','tentative'].includes(b.status));
const departuresDue=()=>allBookings().filter(b=>b.status==='inhouse'&&!skipOcc(b)&&b.dep<=H.set.bd);
function dateSpan(arg){const bd=H.set.bd;let from=bd,to=bd;if(arg&&typeof arg==='object'){from=arg.from||bd;to=arg.to||from}else if(typeof arg==='string'&&arg){from=to=arg}if(from>to){const t=from;from=to;to=t}return {from,to}}
function arrivalsIn(from,to){if(from===H.set.bd&&to===H.set.bd)return pendingArrivals();return allBookings().filter(b=>!skipOcc(b)&&b.arr>=from&&b.arr<=to)}
function departuresIn(from,to){if(from===H.set.bd&&to===H.set.bd)return departuresDue();return allBookings().filter(b=>!skipOcc(b)&&b.dep>=from&&b.dep<=to&&['confirmed','tentative','inhouse','out'].includes(b.status))}
/* status icons for the left list (11.x): B/IH, channel-manager globe, message, deposit, room ready */
const isCM=B=>B.cm!==undefined?!!B.cm:B.source==='OTA';
const depAmt=B=>r2(sum(paymentsIn(B.lines),x=>x.amt));
function depositReceived(B){const lines=(B.lines||[]).filter(l=>l.deposit&&(l.kind==='pay'||l.kind==='payrec'));const rec=new Set();lines.forEach(l=>{if(l.kind==='payrec'&&l.group)rec.add(l.group)});return r2(sum(lines.filter(l=>l.kind==='payrec'||(l.kind==='pay'&&!(l.group&&rec.has(l.group)))),l=>-l.amt))}
const openMsgs=B=>{const r=resOf(B);return r&&r.notifs?r.notifs.filter(n=>!n.done).length:0};
function roomReady(B){const rm=B.room&&RM(B.room);return !!(rm&&roomIsVC(rm,B.id))}
function stIcons(B,mode){const m=stayMark(B);const a=[];
  a.push(`<b class="stl stl-${m.cls}" title="${esc(m.label)}">${esc(m.k)}</b>`);
  if(canCheckBack(B))a.push(`<button class="sic back" data-back="${B.id}" title="Check back in (Auto)">${ic('left',14)}<small>Auto</small></button>`);
  a.push(`<button class="sic" data-prc="${B.id}" title="Print registration card">${ic('print',15)}</button>`);
  if(mode==='arr')a.push(`<button class="sic ok" data-ci="${B.id}" title="Check in">${ic('bed',15)}</button>`);
  if(mode==='dep')a.push(`<button class="sic ok" data-co2="${B.id}" title="Check out">${ic('out',15)}</button>`);
  if(roomReady(B))a.push(`<span class="sic ready" title="Room ${esc(B.room)} is vacant clean (VC)">${ic('wifi',15)}</span>`);
  const b=[];if(isCM(B))b.push(`<span class="sic" title="Booking from the channel manager">${ic('globe',15)}</span>`);
  const n=openMsgs(B);if(n)b.push(`<span class="sic msg" title="${n} message(s) from other shifts – please check">${ic('chat',15)}</span>`);
  if(depAmt(B)>0)b.push(`<span class="sic dep" title="Deposit received: ${m2(depAmt(B))}">$</span>`);
  return `<div class="sicons">${a.join('')}</div>${b.length?`<div class="sicons">${b.join('')}</div>`:''}`}
let LSORT={k:'room',d:1};
function sortList(list){const key={status:b=>b.status==='inhouse'?1:0,name:b=>G(b.guestId).last.toLowerCase(),room:b=>b.room||'zzzz'}[LSORT.k];return list.slice().sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*LSORT.d})}
function sideList(list,sel,mode){
  const th=(k,t)=>`<th data-sort="${k}">${t}<span class="srt">${LSORT.k===k?(LSORT.d>0?'▲':'▼'):'⇅'}</span></th>`;
  return `<div class="panel alist"><table class="ltab"><thead><tr>${th('status','Status')}${th('name','Guest name')}${th('room','Room')}</tr></thead><tbody>
  ${sortList(list).map(b=>{const g=G(b.guestId);return `<tr class="${b.id===sel?'on':''}" data-sel="${b.id}"><td>${stIcons(b,mode)}</td>
    <td>${esc(g.last.toUpperCase())}${g.first?', '+esc(g.first):''}${g.title?' '+esc(g.title):''}${b.copyOf?` <span class="sic" title="Copied reservation (extension)">⇄</span>`:''}${g.vip?' <span class="pill y">VIP</span>':''}</td>
    <td class="nowrap">${b.room?esc(b.room):'<span class="bad">—</span>'}${mode==='arr'?`<button class="pinb2" data-exp="${b.id}" title="Express check-in" aria-label="Express check-in">${ic('pin',15)}</button>`:''}</td></tr>`}).join('')||`<tr><td colspan="3" class="empty">${mode==='arr'?'No arrivals waiting for check-in.':mode==='fol'?'No in-house folio matches.':'No departures due today.'}</td></tr>`}</tbody></table>
  <div class="lcount">Showing ${list.length?1:0} to ${list.length} of ${list.length} entries</div></div>`}
function bindSide(el,mode,rerender){
  $$('[data-sort]',el).forEach(h=>h.onclick=()=>{const k=h.dataset.sort;LSORT=LSORT.k===k?{k,d:-LSORT.d}:{k,d:1};rerender()});
  $$('[data-prc]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();if(need('print'))printRegCard(bookingById(b.dataset.prc))});
  $$('[data-back]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();if(checkBackIn(bookingById(b.dataset.back)))rerender()});
  $$('[data-ci]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();if(checkIn(bookingById(b.dataset.ci),false))rerender()});
  $$('[data-exp]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();if(checkIn(bookingById(b.dataset.exp),true))rerender()});
  $$('[data-co2]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();const B=bookingById(b.dataset.co2);if(ruleOn(H,'requireZeroBalanceCheckout')&&Math.abs(bal(B))>0.004){go('bill.open',B.id);toast('Settle the folio to 0.00, then check out.');return}if(checkOut(B))rerender()});
}

/* ---------- shared search + filter side panel (Billing, Arrivals, Departures) ---------- */
const SIDE_FILTERS=[['room','Room#','Type a room number'],['name','Guest name','Type a guest name'],['company','Company / Agency','Type a company or agent name'],['rsvn','RSVN#','Type a reservation number'],['folio','Folio#','Type a folio (internal) number'],['arr','Check-in date','dd/mm/yyyy'],['dep','Check-out date','dd/mm/yyyy']];
function sideMatch(st,b,q){q=(q||'').toLowerCase().trim();if(!q)return true;const g=G(b.guestId),r=resOf(b),c=CO(r.companyId);
  switch(st.by){case 'room':return String(b.room||'').startsWith(q);case 'name':return q.split(/\s+/).every(w=>(g.last+' '+g.first+' '+gName(g)).toLowerCase().includes(w));
   case 'company':return !!c&&q.split(/\s+/).every(w=>(c.name+' '+c.code).toLowerCase().includes(w));
   case 'rsvn':return String(r.no).startsWith(q);case 'folio':return String(b.internal).startsWith(q);
   case 'arr':return fd(b.checkinDate||b.arr).includes(q)||(b.checkinDate||b.arr).includes(q);case 'dep':return fd(b.dep).includes(q)||b.dep.includes(q)}return true}
/* cfg: {title, st:{by,q,sel}, rows:()=>bookings, mode, keep:booking to keep while no search, pick:id=>void, rerender:()=>void} */
function sideSearch(host,cfg){const st=cfg.st,f=SIDE_FILTERS.find(x=>x[0]===st.by)||SIDE_FILTERS[0];
  host.innerHTML=`<div class="bfh">${esc(cfg.title)}</div>
   <div class="bfsearch"><input class="ssQ" value="${esc(st.q)}" placeholder="${esc(f[2])}" autocomplete="off" aria-label="Search"><div class="bfdd"><button class="bfbtn ssDD" title="Choose filter" aria-haspopup="true">▾</button><div class="bfmenu" hidden>${SIDE_FILTERS.map(x=>`<button data-sf="${x[0]}" class="${x[0]===st.by?'on':''}">${x[1]}</button>`).join('')}</div></div><button class="bfbtn ssGo" title="Search">${ic('search',16)}</button></div>
   <div class="bffilt">${ic('search',11)} Filter by : <b>${f[1]}</b></div><div class="ssList"></div>`;
  const box=$('.ssList',host),q=$('.ssQ',host),menu=$('.bfmenu',host);
  const rows=()=>cfg.rows().filter(b=>sideMatch(st,b,st.q)||(!st.q&&cfg.keep&&b===cfg.keep));
  const paint=()=>{box.innerHTML=sideList(rows(),st.sel,cfg.mode);bindSide(box,cfg.mode,cfg.rerender);
    $$('tr[data-sel]',box).forEach(r=>r.onclick=e=>{if(e.target.closest('button'))return;cfg.pick(r.dataset.sel)})};
  paint();
  q.oninput=()=>{st.q=q.value;paint()};
  const first=()=>{st.q=q.value;const r=$$('tr[data-sel]',box);if(r.length)cfg.pick(r[0].dataset.sel);else paint()};
  q.onkeydown=e=>{if(e.key==='Enter')first()};$('.ssGo',host).onclick=first;
  $('.ssDD',host).onclick=e=>{e.stopPropagation();menu.hidden=!menu.hidden};
  $$('[data-sf]',host).forEach(b=>b.onclick=()=>{st.by=b.dataset.sf;st.q='';cfg.rerender();setTimeout(()=>{const x=$('.ssQ',host.isConnected?host:document);x&&x.focus()},20)});
  document.addEventListener('click',function h(e){if(!host.isConnected){document.removeEventListener('click',h);return}if(!e.target.closest('.bfdd'))menu.hidden=true});
}

  paint();setTimeout(()=>$('#niC',m).focus(),50);
}

function payModal(B,after,folio,mode){if(!need('pay'))return;if(['cancelled','noshow'].includes(B.status)){toast('This booking is not active.');return}

  const paint=()=>{const inTab=codes().filter(c=>c.ptab===payTab),nPay=inTab.filter(c=>!c.refund).length,nRef=inTab.filter(c=>c.refund).length;if(adv)payRef=false;const list=inTab.filter(c=>!!c.refund===payRef);const card=g.card;const cardCode=card&&codes().find(c=>c.card===card.type&&!c.refund);
    $('#pyB',m).innerHTML=`<div class="nitabs">${PAY_TABS.map(t=>`<button class="${t===payTab?'on':''}" data-pt="${esc(t)}">${esc(t)}</button>`).join('')}</div>

     <div class="nitiles">${list.map(c=>`<button class="nitile ptile ${c.refund?'rf':''} ${cur&&cur.code===c.code?'on':''}" data-pc="${c.code}">${payIcon(c,42)}<b>${c.code}</b><span>${esc(c.desc)}</span>${c.region?`<em class="rg">${esc(c.region)}</em>`:''}</button>`).join('')||'<div class="empty">No types here.</div>'}</div></div>
     <div class="niform"><div class="defpay"><div class="dph">DEFAULT PAYMENT</div>${card?`<button class="dpc" id="pyDef">${ic('cardp',30)}<span>Credit card# •••• ${esc(card.last4)} · Exp. ${esc(card.exp||'')}</span></button>`:'<div class="sub pad">No card on file in the guest profile.</div>'}</div>
      <div class="sub">${adv?(deposit?'Reservation deposit before arrival. Three lines: the deposit, and a red receipt with its pair in Folio 4.':'Advance payment in house. Three lines, with the red receipt kept in Folio 4.'):`Settles Folio ${folio}: outstanding ${m2(folioBal(B,folio))}. One red line on Folio ${folio}. A refund is only for a payment from a closed day.`}</div>
      ${fld('Tran code',`<div class="row gap"><input id="pyC" value="${cur?cur.code:''}" placeholder="Type code or name" autocomplete="off"><button class="btn ghost sm" id="pySr" title="Search">${ic('search',15)}</button></div><div id="pyHits"></div>`)}
      ${fld('Description',`<input id="pyD" value="${cur?esc(cur.desc):''}">`)}${cur&&cur.ptab==='CREDIT CARD'&&!cur.refund?`<div class="cardbox"><div class="cbh">${ic('cardp',16)} Card details <span class="sub">– only the last 4 digits are shown after saving</span></div><div class="form2">${fld('Card number',`<input id="cdN" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" maxlength="23">`,'span2')}${fld('Expiry (MM/YY)',`<input id="cdE" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5">`)}${fld('CVC',`<input id="cdC" type="password" inputmode="numeric" autocomplete="cc-csc" placeholder="•••" maxlength="4">`)}${fld('Card holder name',`<input id="cdH" autocomplete="cc-name" placeholder="As printed on the card">`,'span2')}</div></div>`:''}
      ${fld('Reference#',`<input id="pyR" maxlength="60" placeholder="Reference info (max 60 characters)">`)}
      ${fld('Amount',`<div class="amtrow"><input id="pyA" class="n niamt" inputmode="decimal" placeholder="0.00" value="${defAmt()}"><button class="btn ghost sm" id="pyCalc" title="Calculator">${ic('grid',20)}</button></div><div id="pyPad"></div>`)}
      ${fld('Remark',`<textarea id="pyM" rows="3"></textarea>`)}<div class="err" id="pyE"></div>
      <div class="btns end"><button class="btn red" id="pyX">Close</button><button class="btn purple" id="pyP">${adv?'Post advance payment':'Post payment'}</button></div></div></div>`;
    if(m._v)['pyR','pyA','pyM'].forEach(id=>{if(m._v[id]!=null&&m._v[id]!=='')$('#'+id,m).value=m._v[id]});
    const pick=code=>{save();cur=TCODES.find(c=>c.code===code);payTab=cur.ptab;payRef=!!cur.refund;if(m._v)m._v.pyA='';paint();$('#pyA',m).focus()};

      $('#pyHits',m).innerHTML=hits.length?`<div class="nihits">${hits.map(c=>`<button data-ph="${c.code}"><b>${c.code}</b> ${esc(c.desc)}</button>`).join('')}</div>`:'';$$('[data-ph]',m).forEach(b=>b.onclick=()=>pick(b.dataset.ph))};
    $('#pySr',m).onclick=()=>$('#pyC',m).dispatchEvent(new Event('input'));

  const doPay=()=>{if(!need('pay'))return;const e=$('#pyE',m);if(!cur){e.textContent='Choose a payment type.';return}const a=r2(+String($('#pyA',m).value).replace(/,/g,''));
    if(!(a>0)){e.textContent='Enter an amount above 0.';return}
    if(cur.refund&&adv){e.textContent='Refunds are made with Payment, not Advance Payment.';return}
    if(cur.refund){const prior=B.lines.filter(l=>(l.kind==='pay'||l.kind==='payrec')&&l.code===(cur.refFor||l.code)&&isLocked(l.bd)&&l.amt<0);
      if(!prior.length){e.textContent='A refund is for a payment from a closed day. For today, use Correct payment or Void payment on the transaction.';return}

    if(cur.ptab==='CITY LEDGER'&&!cur.refund){const rr=resOf(B);if(!rr.companyId){e.textContent='Put a company or travel agent on the reservation before City Ledger.';return}
      const co=CO(rr.companyId);if(co&&+co.creditLimit>0){refreshCityItems(H);const open=r2(sum((H.cityLedger||[]).filter(x=>x.companyId===co.id&&x.status==='open'),x=>x.open));
        if(open+a>+co.creditLimit+0.004){e.textContent=`Credit limit ${m2(co.creditLimit)} would be exceeded (open ${m2(open)} + this ${m2(a)}).`;return}}}
    let card=null;if($('#cdN',m)){const pan=$('#cdN',m).value.replace(/\D/g,''),ex=$('#cdE',m).value,cvc=$('#cdC',m).value,hold=$('#cdH',m).value.trim();

      const now=new Date(),endOfMonth=new Date(2000+yy,mm,0);if(endOfMonth<new Date(now.getFullYear(),now.getMonth(),1)){e.textContent='This card has expired.';return}
      if(!/^\d{3,4}$/.test(cvc)){e.textContent='Enter the 3 or 4 digit CVC.';return}if(!hold){e.textContent='Enter the card holder name.';return}
      card={brand:cur.card||cardBrand(pan),last4:pan.slice(-4),exp:ex,holder:hold};const vid='cv'+uid();DB.cardVault=DB.cardVault||[];DB.cardVault.push({id:vid,hotel:H.code,rsvn:resOf(B).no,pan,exp:ex,holder:hold,at:Date.now(),user:user().name});card.vault=vid;/* CVC is checked and never stored. The full number stays in the provider vault. The folio and the invoice show the last 4 digits only. */}

function luhn(n){if(!/^\d{12,19}$/.test(n))return false;let s=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9}s+=d;alt=!alt}return s%10===0}
function cardBrand(n){return /^4/.test(n)?'VISA':/^(5[1-5]|2[2-7])/.test(n)?'MASTER':/^3[47]/.test(n)?'AMEX':/^35/.test(n)?'JCB':/^62/.test(n)?'UNIONPAY':/^3(0|6|8)/.test(n)?'DINERS':'CARD'}

  $('#spA',m).oninput=()=>{$('#spN',m).value='';upd()};$('#spN',m).onchange=upd;$('#spCalc',m).onclick=()=>calcPad($('#spPad',m),$('#spA',m),upd);$('#spX',m).onclick=()=>closeModal(m);

/* ---------- Offset transaction: permanently freezes the line (no new line is added) ---------- */
function offsetLine(B,l,after){if(!need('corrpost'))return;if(!l){toast('Select a line first.');return}if(l.fixed||payLocked(l)||l.settled){toast(lineBlock(B,l)||'This line cannot be offset.');return}if(lineBlock(B,l)){toast(lineBlock(B,l));return}

const TC_LANGS=[['en','English','English'],['th','ไทย','Thai'],['zh','中文','Chinese'],['ja','日本語','Japanese'],['ru','Русский','Russian'],['my','မြန်မာ','Myanmar']];
const TC_SRC={en:'English',th:'ไทย',zh:'中文',ja:'日本語',ru:'Русский',my:'မြန်မာ'};
/* built-in translation memory for the default clauses (stands in for the backend translation service) */
const TC_MEMORY=(()=>{const m={};TERMS.English.forEach((en,i)=>{m[en]={th:TERMS['ไทย'][i],zh:TERMS['中文'][i],ja:TERMS['日本語'][i],ru:TERMS['Русский'][i]}});return m})();
function termsOf(h){const t=h.set.terms||{};const en=(t.en&&t.en.length?t.en:TERMS.English);const out={en,manual:t.manual||{},my:t.my||null,pending:{}};
  ['th','zh','ja','ru'].forEach(k=>{const man=out.manual[k];if(man&&man.length){out[k]=man;return}
    const lines=en.map(e=>TC_MEMORY[e]&&TC_MEMORY[e][k]);if(lines.every(Boolean))out[k]=lines;else{out[k]=null;out.pending[k]=true}});return out}
function termsBlocks(h){const t=termsOf(h);return TC_LANGS.filter(([k])=>t[k]&&t[k].length).map(([k,native,eng])=>({k,title:k==='en'?'English':`${native} (${eng})`,lines:t[k]}))}

/* ================= Shift, Close Day, Setup, Provider ================= */
function shiftTotals(s){const ls=allLinesH(H).filter(l=>l.shiftId===s.id);const pays=paymentsIn(ls);const by={};pays.forEach(p=>{by[p.l.method]=(by[p.l.method]||0)+p.amt});
  const cash=r2(by['Cash']||0),paidOut=r2(sum(ls.filter(l=>l.code==='600'&&isCharge(l)),l=>l.amt));return {ls,by,cash,paidOut,expected:r2((s.openCash||0)+cash-paidOut),charges:r2(sum(ls.filter(isCharge),l=>l.amt))}}
VIEWS['cd.shift']=el=>{
  const s=curShift();if(!s){el.innerHTML='<div class="empty">No open shift.</div>';return}const t=shiftTotals(s);
  const others=H.shifts.filter(x=>x.status==='open'&&x.id!==s.id);
  el.innerHTML=pageHead('My Shift & Cashier',`<span class="sub">${esc(s.name)} shift · opened ${tm(s.openAt)} · business date ${fd(s.bd)}</span>`)+`<div class="cols2">
   <div class="panel"><div class="ph">Collections this shift</div><table class="grid kv">${Object.entries(t.by).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${m2(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No payments taken yet.</td></tr>'}
     <tr class="tot"><td>Total collected</td><td class="n">${m2(sum(Object.values(t.by)))}</td></tr><tr><td>Charges posted</td><td class="n">${m2(t.charges)}</td></tr></table></div>
   <div class="panel"><div class="ph">Cash drawer</div><table class="grid kv"><tr><td>Opening cash</td><td class="n">${m2(s.openCash||0)}</td></tr><tr><td>+ Cash received</td><td class="n">${m2(t.cash)}</td></tr><tr><td>− Paid out</td><td class="n">${m2(t.paidOut)}</td></tr><tr class="tot"><td>Expected cash</td><td class="n">${m2(t.expected)}</td></tr></table>
    <div class="form2 mt">${fld('Cash counted',`<input type="number" id="csC" step="0.01" class="n">`)}${fld('Handover note (optional)',`<input id="csN">`)}</div><div class="err" id="csE"></div>
    <div class="btns"><button class="btn gold" id="csGo">Close my shift and sign out</button><button class="btn ghost" id="csRep">Shift report</button></div></div></div>
   ${others.length?`<div class="panel mt"><div class="ph">Other open shifts</div><table class="grid"><tr><th>User</th><th>Shift</th><th>Opened</th><th></th></tr>${others.map(o=>`<tr><td>${esc(o.userName)}</td><td>${o.name}</td><td>${fd(o.bd)} ${tm(o.openAt)}</td><td>${can('closeothers')?`<button class="btn sm ghost" data-cls="${o.id}">Close this shift</button>`:''}</td></tr>`).join('')}</table></div>`:''}`;
  $('#csRep',el).onclick=()=>{openReportsTab();toast('Open "Shift by Shift Cashier" under Cashier & Billing.')};
  $('#csGo',el).onclick=()=>{const c=$('#csC',el).value;if(c===''){$('#csE',el).textContent='Count the cash in the drawer and enter the amount.';return}const cnt=r2(+c),v=r2(cnt-t.expected);
    if(v!==0&&!confirm(`Cash variance ${m2(v)}. Close the shift with this variance?`))return;
    Object.assign(s,{status:'closed',closeAt:Date.now(),expected:t.expected,counted:cnt,variance:v,note:$('#csN',el).value.trim()});log(`Closed ${s.name} shift, variance ${m2(v)}`);saveDB();signOut(true)};
  $$('[data-cls]',el).forEach(b=>b.onclick=()=>{if(!need('closeothers'))return;const o=H.shifts.find(x=>x.id===b.dataset.cls);const tt=shiftTotals(o);const c=prompt(`Cash counted for ${o.userName} (${o.name}). Expected ${m2(tt.expected)}:`,m2(tt.expected).replace(/,/g,''));if(c===null)return;
    Object.assign(o,{status:'closed',closeAt:Date.now(),expected:tt.expected,counted:r2(+c),variance:r2(+c-tt.expected),closedBy:user().name});log(`Closed ${o.userName}'s ${o.name} shift`);refresh()});
};

const tonightIH=()=>allBookings().filter(b=>b.status==='inhouse'&&!skipOcc(b)&&b.arr<=H.set.bd&&b.dep>H.set.bd);
function markNoShow(B){if(!B||!need('res.cancel'))return false;const g=G(B.guestId);
  if(!confirm(`Mark ${gName(g)} as a no-show?`))return false;
  B.status='noshow';B.statusDate=H.set.bd;histB(B,'No-show');

/* Close Day run: progress steps, data log, lock, next business date, sign out */
function runCloseDay(){const bd=H.set.bd,nd=addD(bd,1);
  const steps=['Checking data','Creating data log','Closing cashier shift','Locking business date '+fd(bd),'Closing entire system','Moving to business date '+fd(nd)];
  const m=modal('Close Day',`<div class="cdprog">${steps.map((t,i)=>`<div class="cdst" data-st="${i}"><i></i><span>${esc(t)}</span></div>`).join('')}</div><div class="cdmsg" id="cdMsg">Please wait. Do not close this window.</div>`,{w:520,sticky:true});
  const x=m._wrap.querySelector('.mx');if(x)x.remove();m._wrap.dataset.lock='1';
  const mark=i=>{const e=m.querySelector(`[data-st="${i}"]`);if(e)e.classList.add('done');const n=m.querySelector(`[data-st="${i+1}"]`);if(n)n.classList.add('run')};
  m.querySelector('[data-st="0"]').classList.add('run');
  const work=[()=>{if(!cdReady().ok)throw new Error('Checks failed')},
    ()=>{const ls=allLinesH(H).filter(l=>l.night===bd&&l.kind==='room');H.audits.push({date:bd,at:Date.now(),user:user().name,rooms:ls.length,rev:r2(sum(ls,l=>l.amt)),ns:allBookings().filter(b=>b.status==='noshow'&&b.statusDate===bd).length,shifts:H.shifts.filter(x=>x.bd===bd).length,variance:r2(sum(H.shifts.filter(x=>x.bd===bd),x=>x.variance||0)),inhouse:tonightIH().length,discClosed:Object.values(H.disc||{}).filter(d=>d.bd===bd&&d.status==='closed').length})},
    ()=>{const s=curShift();if(s){const t=shiftTotals(s);Object.assign(s,{status:'closed',closeAt:Date.now(),expected:t.expected,counted:t.expected,variance:0,note:'Closed by Close Day'})}},
    ()=>{H.set.lockedThrough=bd},()=>{log(`Close Day ${fd(bd)} done`)},()=>{H.set.bd=nd;saveDB()}];
  let i=0;const tick=()=>{try{work[i]()}catch(e){m.querySelector('#cdMsg').textContent='Close Day stopped: '+e.message;return}mark(i);i++;
    if(i<work.length)setTimeout(tick,CD_DELAY);else{m.querySelector('#cdMsg').innerHTML=`<b>Close Day complete.</b> The business date is now ${fd(nd)}. Signing out…`;setTimeout(()=>{closeModal(m);signOut(true)},CD_DELAY*3)}};
  setTimeout(tick,CD_DELAY);
}

/* ================= Inquiry / Forecast ================= */
function parseDMY(s){const m=String(s||'').trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(!m)return null;const v=`${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;return fd(v)===`${pad(+m[1])}/${pad(+m[2])}/${m[3]}`&&!isNaN(P(v))&&iso(P(v))===v?v:null}
/* Availability = rooms of the type − out of order / out of inventory − reserved bookings − unpicked allotment (until cut-off). */
let FC={from:null,days:15,tentFit:true,tentGrp:true,tab:'avl',prod:'market'};
const isGrp=b=>b.market==='GRP';
function fcBookings(d){return allBookings().filter(b=>!skipOcc(b)&&b.arr<=d&&d<b.dep&&(
  ['confirmed','inhouse'].includes(b.status)||(b.status==='out'&&d<b.statusDate)||
  (b.status==='tentative'&&(isGrp(b)?FC.tentGrp:FC.tentFit))))}
function allotHeld(a,d){if(!(a.from<=d&&d<=a.to))return {allot:0,picked:0,held:0};
  const picked=allBookings().filter(b=>resOf(b).companyId===a.companyId&&b.type===a.type&&b.arr<=d&&d<b.dep&&['confirmed','tentative','inhouse','out'].includes(b.status)&&!(b.status==='out'&&d>=b.statusDate)).length;
  const released=addD(d,-(a.cutoff||0))<H.set.bd; // past cut-off: unpicked rooms go back to sale
  return {allot:a.rooms,picked,held:released?0:Math.max(0,a.rooms-picked),released}}
function fcDay(d){const rows={};let occ=0,ooo=0,oi=0,held=0,tent=0;
  const bk=fcBookings(d);
  H.roomTypes.filter(t=>!t.dummy).forEach(t=>{const rms=H.rooms.filter(r=>!r.dummy&&r.type===t.code);
    const o=rms.filter(r=>r.ooo&&r.ooo.from<=d&&d<=r.ooo.to);const oo=o.filter(r=>r.ooo.kind!=='OI').length,ii=o.filter(r=>r.ooo.kind==='OI').length;
    const used=bk.filter(b=>b.type===t.code).length,tn=bk.filter(b=>b.type===t.code&&b.status==='tentative').length;
    const h=sum((H.allotments||[]).filter(a=>a.type===t.code),a=>allotHeld(a,d).held);
    rows[t.code]={total:rms.length,oo,oi:ii,occ:used,tent:tn,held:h,avl:rms.length-oo-ii-used-h};occ+=used;ooo+=oo;oi+=ii;held+=h;tent+=tn});
  const tlrm=H.rooms.filter(r=>!r.dummy).length-oi,avl=sum(Object.values(rows),r=>r.avl);
  const arr=allBookings().filter(b=>!skipOcc(b)&&b.arr===d&&live(b)&&(b.status!=='tentative'||(isGrp(b)?FC.tentGrp:FC.tentFit))),dep=allBookings().filter(b=>!skipOcc(b)&&b.dep===d&&live(b)&&(b.status!=='tentative'||(isGrp(b)?FC.tentGrp:FC.tentFit)));
  const rev=r2(sum(bk,b=>b.nightly[d]||0));
  return {d,rows,occ,ooo,oi,held,tent,tlrm,avl,occPct:tlrm?occ/tlrm*100:0,arr,dep,bk,pax:sum(bk,b=>b.adults+b.children),rev,adr:occ?rev/occ:0}}
const dayBadge=d=>{const w=P(d).toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();return `<span class="dbg ${w==='SAT'||w==='SUN'?'we':''}">${w}</span> ${fd(d)}`};

/* builds the table for a tab: html (screen), plain (export), tsv (copy), title, cols/rows for print */
function fcTable(tab,D,ds){const T=H.roomTypes.filter(t=>!t.dummy);let head=[],rows=[],title='',cls=[];
  const pct=v=>v.toFixed(2);
  if(tab==='avl'){title='AVL.RmType';head=['Date','TLRM','AVL','OCC%',...T.map(t=>`${t.code} (${H.rooms.filter(r=>r.type===t.code).length})`),'OO/OI'];cls=['c-date','c-tl','c-avl','c-occ',...T.map(()=>'c-rt'),'c-oo'];
    rows=D.map(x=>[x.d,x.tlrm,x.avl,pct(x.occPct),...T.map(t=>x.rows[t.code].avl),x.ooo+x.oi])}
  else if(tab==='occ'){title='OCC.RmType';head=['Date','TLRM','OCC','OCC%',...T.map(t=>`${t.code} (${H.rooms.filter(r=>r.type===t.code).length})`),'Tentative'];cls=['c-date','c-tl','c-avl','c-occ',...T.map(()=>'c-rt'),'c-oo'];
    rows=D.map(x=>[x.d,x.tlrm,x.occ,pct(x.occPct),...T.map(t=>x.rows[t.code].occ),x.tent])}
  else if(tab==='all'){title='All';head=['Date','TLRM','OO/OI','Salable','Occupied','Tentative','Allotment held','AVL','OCC%','Arrival','Departure','PAX','Room revenue','ADR'];cls=['c-date','c-tl','c-oo','c-tl','c-avl','c-rt','c-rt','c-avl','c-occ','c-rt','c-rt','c-rt','c-rt','c-rt'];
    rows=D.map(x=>[x.d,x.tlrm,x.ooo+x.oi,x.tlrm-x.ooo,x.occ,x.tent,x.held,x.avl,pct(x.occPct),x.arr.length,x.dep.length,x.pax,m2(x.rev),m2(x.adr)])}
  else if(tab==='adv'){title='Advance';head=['Date','Arrival rooms','Arrival pax','Departure rooms','Departure pax','Stay over rooms','In house pax','Occupied','OCC%'];cls=['c-date','c-rt','c-rt','c-rt','c-rt','c-rt','c-rt','c-avl','c-occ'];
    rows=D.map(x=>{const so=x.bk.filter(b=>b.arr<x.d);return [x.d,x.arr.length,sum(x.arr,b=>b.adults+b.children),x.dep.length,sum(x.dep,b=>b.adults+b.children),so.length,x.pax,x.occ,pct(x.occPct)]})}
  else if(tab==='allot'){title='Allotment';const A=H.allotments||[];head=['Date',...A.flatMap(a=>{const c=(CO(a.companyId)||{}).code||'?';return [`${c} ${a.type} allot`,`${c} ${a.type} picked`,`${c} ${a.type} held`]}),'Total held'];cls=['c-date',...A.flatMap(()=>['c-rt','c-avl','c-oo']),'c-oo'];
    rows=ds.map(d=>{const v=A.map(a=>allotHeld(a,d));return [d,...v.flatMap(x=>[x.allot,x.picked,x.released&&x.allot?'released':x.held]),sum(v,x=>x.held)]})}
  else if(tab==='sum'){title='Summary AVL';head=['Room type','Rooms','Min AVL','Max AVL','Avg AVL','Room nights sold','Room nights available','OCC%'];cls=['c-date','c-tl','c-avl','c-avl','c-avl','c-rt','c-rt','c-occ'];
    rows=T.map(t=>{const a=D.map(x=>x.rows[t.code].avl),o=sum(D,x=>x.rows[t.code].occ),cap=sum(D,x=>x.rows[t.code].total-x.rows[t.code].oi);return [`${t.code} – ${t.name}`,H.rooms.filter(r=>r.type===t.code).length,Math.min(...a),Math.max(...a),(sum(a)/a.length).toFixed(1),o,sum(a),pct(cap?o/cap*100:0)]});
    const a=D.map(x=>x.avl),o=sum(D,x=>x.occ),cap=sum(D,x=>x.tlrm);rows.push(['Total',H.rooms.filter(r=>!r.dummy).length,Math.min(...a),Math.max(...a),(sum(a)/a.length).toFixed(1),o,sum(a),pct(cap?o/cap*100:0)])}

const GOOGLE_CC={Thailand:'TH',Myanmar:'MM',Singapore:'SG',Malaysia:'MY',Vietnam:'VN',Laos:'LA',Cambodia:'KH',Indonesia:'ID',Philippines:'PH'};
function publicHotelFromHub(h){
  shapeHotel(h);const s=h.set,g=s.google||{};
  const occupied=[];(h.reservations||[]).forEach(r=>(r.bookings||[]).forEach(b=>{
    if(b.masterDummy||b.groupMaster||(b.room&&String(b.room).startsWith('D')))return;
    occupied.push({type:b.type,arr:b.arr,dep:b.dep,status:b.status})}));
  return {id:h.code,name:s.name||h.code,legal:s.legal||'',addr:s.addr||'',phone:s.phone||'',email:s.email||'',web:s.web||'',
    cur:s.cur||'THB',svc:+s.svc||0,vat:+s.vat||0,taxName:s.taxName||'Tax',country:s.country||'',
    countryCode:(g.countryCode||GOOGLE_CC[s.country]||'TH').toUpperCase().slice(0,2),

    lat:g.lat===''||g.lat==null?null:+g.lat,lng:g.lng===''||g.lng==null?null:+g.lng,
    category:g.category||'hotel',amenities:Array.isArray(g.amenities)?g.amenities.slice():[],cancelPolicy:g.cancelPolicy||'',
    photoUrl:g.photoUrl||'',brand:g.brand||'Maha Booking',bookEnabled:!!g.enabled,active:h.active!==false,
    roomTypes:(h.roomTypes||[]).filter(t=>!t.dummy).map(t=>({code:t.code,name:t.name,base:+t.base||0,max:+t.max||2,dummy:false})),
    rateCodes:(h.rateCodes||[]).map(r=>({code:r.code,desc:r.desc||r.code,kind:r.kind||'pct',v:+r.v||0,meal:r.meal||'',comp:r.comp||''})),
    rooms:(h.rooms||[]).filter(r=>!r.dummy).map(r=>({no:r.no,type:r.type,ooo:r.ooo?{from:r.ooo.from,to:r.ooo.to}:null,dummy:false})),
    occupied,publishedAt:new Date().toISOString()}

/* generic list editor: rows are edited in place; ↑↓ to move; ✕ to delete */
function listEditor(box,{cols,rows,blank,validate,save,orderable,note}){let data=JSON.parse(JSON.stringify(rows));
  const paint=()=>{box.querySelector('.le').innerHTML=`<table class="grid le-t"><tr>${orderable?'<th></th>':''}${cols.map(c=>`<th>${esc(c.h)}</th>`).join('')}<th></th></tr>
    ${data.map((r,i)=>`<tr>${orderable?`<td class="nowrap"><button class="btn sm ghost" data-up="${i}" ${i?'':'disabled'} title="Move up">↑</button><button class="btn sm ghost" data-dn="${i}" ${i<data.length-1?'':'disabled'} title="Move down">↓</button></td>`:''}
      ${cols.map(c=>`<td>${c.opts?`<select data-i="${i}" data-k="${c.k}">${(typeof c.opts==='function'?c.opts():c.opts).map(o=>opt(o[0],o[1],r[c.k])).join('')}</select>`:c.type==='check'?`<input type="checkbox" data-i="${i}" data-k="${c.k}" ${r[c.k]?'checked':''}>`:`<input data-i="${i}" data-k="${c.k}" value="${esc(r[c.k]??'')}" ${c.type?`type="${c.type}"`:''} ${c.ro&&r._old?'disabled':''} style="${c.w?'width:'+c.w:''}">`}</td>`).join('')}
      <td><button class="btn sm ghost" data-del="${i}" title="Delete">✕</button></td></tr>`).join('')||`<tr><td colspan="${cols.length+2}" class="empty">Nothing here yet. Press Add.</td></tr>`}</table>`;
    $$('[data-i]',box).forEach(inp=>inp.onchange=()=>{const r=data[+inp.dataset.i],c=cols.find(x=>x.k===inp.dataset.k);r[c.k]=c.type==='check'?inp.checked:c.type==='number'?(inp.value===''?'':+inp.value):inp.value.trim()});
    $$('[data-up]',box).forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[data[i-1],data[i]]=[data[i],data[i-1]];paint()});$$('[data-dn]',box).forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;[data[i+1],data[i]]=[data[i],data[i+1]];paint()});
    $$('[data-del]',box).forEach(b=>b.onclick=()=>{data.splice(+b.dataset.del,1);paint()})};
  box.insertAdjacentHTML('beforeend',`<div class="panel scroll le"></div>${note?`<p class="sub">${note}</p>`:''}<div class="err lee"></div><div class="btns"><button class="btn ghost leadd">${ic('plus',14)} Add</button><button class="btn gold lesave">Save</button></div>`);
  paint();box.querySelector('.leadd').onclick=()=>{data.push(blank());paint()};
  box.querySelector('.lesave').onclick=()=>{if(!provOnly())return;const e=validate?validate(data):'';if(e){box.querySelector('.lee').textContent=e;return}save(data)}}
const SEC={

 tax(box){const s=H.set;box.innerHTML=secHead('2. Currency, tax & service','All rates are inclusive. Service is worked out on the net amount; tax on net plus service.')+`<div class="panel pad"><div class="form3">
   ${fld('Currency',`<select id="t_cur">${Object.keys(CUR_WORDS).map(c=>opt(c,c,s.cur)).join('')}</select>`)}${fld('Currency in words (invoice)',`<input id="t_cw" value="${esc(s.curWord)}">`)}${fld('Sub-unit in words',`<input id="t_sw" value="${esc(s.subWord)}">`)}
   ${fld('Service charge %',`<input type="number" step="0.01" id="t_svc" value="${s.svc}">`)}${fld('Tax name (e.g. VAT, Commercial tax)',`<input id="t_tn" value="${esc(s.taxName)}">`)}${fld('Tax %',`<input type="number" step="0.01" id="t_vat" value="${s.vat}">`)}</div>

   const q=()=>{const sv=+$('#t_svc',box).value||0,v=+$('#t_vat',box).value||0,net=1000/(1+sv/100)/(1+v/100);$('#t_q',box).innerHTML=`Example: 1,000.00 inclusive = net ${m2(net)} + service ${m2(net*sv/100)} + ${esc($('#t_tn',box).value)} ${m2((net*(1+sv/100))*v/100)}`};
   ['t_svc','t_vat','t_tn'].forEach(id=>$('#'+id,box).oninput=q);q();
   $('#t_cur',box).onchange=()=>{const w=CUR_WORDS[$('#t_cur',box).value];if(w){$('#t_cw',box).value=w[0];$('#t_sw',box).value=w[1]}};
   $('#tS',box).onclick=()=>{if(!provOnly())return;if(H.active!==false&&$('#t_cur',box).value!==s.cur&&!confirm('This hotel is active. Changing the currency affects every amount. Continue?'))return;
     Object.assign(s,{cur:$('#t_cur',box).value,curWord:$('#t_cw',box).value.trim().toUpperCase(),subWord:$('#t_sw',box).value.trim().toUpperCase(),svc:+$('#t_svc',box).value||0,taxName:$('#t_tn',box).value.trim()||'Tax',vat:+$('#t_vat',box).value||0});provLog(`Tax setup saved for ${H.code}`);saved()}},
 bd(box){const s=H.set,live=H.active!==false;box.innerHTML=secHead('3. Business date & times')+`<div class="panel pad"><div class="form3">
   ${fld('Business date',`<input type="date" id="b_bd" value="${s.bd}" ${live?'disabled':''}>`)}${fld('Check-in time',`<input type="time" id="b_ci" value="${esc(s.checkIn)}">`)}${fld('Check-out time',`<input type="time" id="b_co" value="${esc(s.checkOut)}">`)}</div>
   <p class="sub">${live?'The business date of an active hotel only moves forward with Close Day.':'Set the first business date. After activation it only moves forward with Close Day.'}</p><div class="btns"><button class="btn gold" id="bS">Save</button></div></div>`;
   $('#bS',box).onclick=()=>{if(!provOnly())return;if(!live){s.bd=$('#b_bd',box).value||s.bd;s.lockedThrough=addD(s.bd,-1)}s.checkIn=$('#b_ci',box).value;s.checkOut=$('#b_co',box).value;provLog(`Business date / times saved for ${H.code}`);saved()}},
 floors(box){box.innerHTML=secHead('4. Floors','Name and order of each floor, as they appear in Housekeeping Status. Use ↑↓ to change the order.');
   const rows=(H.floors&&H.floors.length?H.floors:[...new Set(H.rooms.filter(r=>!r.dummy).map(r=>r.floor))].sort((a,b)=>+a-+b).map((f,i)=>({id:f,name:'Floor '+f,order:i+1}))).map(f=>({...f,_old:true}));

 types(box){box.innerHTML=secHead('5. Room types','Short code (shown on the floor plan, reports and forecast), full name, base rate (inclusive) and maximum guests.');
   listEditor(box,{orderable:true,rows:H.roomTypes.filter(t=>!t.dummy).map(t=>({...t,_old:true})),cols:[{k:'code',h:'Short code',ro:true,w:'90px'},{k:'name',h:'Name'},{k:'base',h:`Base rate (${H.set.cur})`,type:'number',w:'130px'},{k:'max',h:'Max guests',type:'number',w:'90px'}],

      const gone=H.rooms.filter(r=>!r.dummy&&!d.some(t=>String(t.code).toUpperCase()===r.type));return gone.length?`Rooms still use ${[...new Set(gone.map(r=>r.type))].join(', ')}. Change those rooms first.`:''},

 rooms(box){box.innerHTML=secHead('6. Rooms','Room number, room type and floor. Connecting room and handicap room are shown on the floor plan.')+`<div class="panel pad rbulk"><b>Add many rooms at once</b><div class="row gap">${fld('From room no.',`<input id="rb_f" style="width:110px">`)}${fld('To room no.',`<input id="rb_t" style="width:110px">`)}${fld('Room type',`<select id="rb_ty">${H.roomTypes.filter(t=>!t.dummy).map(t=>opt(t.code,t.code)).join('')}</select>`)}${fld('Floor',`<input id="rb_fl" style="width:90px">`)}<button class="btn" id="rb_go">Add range</button></div></div>`;
   const floorsOpt=()=>{const fs=(H.floors&&H.floors.length?H.floors.map(f=>[f.id,f.name]):[...new Set(H.rooms.map(r=>r.floor))].map(f=>[f,'Floor '+f]));return [['','—'],...fs]};

      const busy=H.rooms.filter(r=>!r.dummy&&!d.some(x=>x.no===r.no)&&allBookingsH(H).some(b=>b.room===r.no&&['confirmed','tentative','inhouse'].includes(b.status)));return busy.length?`Room ${busy.map(r=>r.no).join(', ')} has bookings and cannot be deleted.`:''},
    save:d=>{const old={};H.rooms.forEach(r=>old[r.no]=r);const dums=H.rooms.filter(r=>r.dummy&&r.no!=='D999');H.rooms=d.map(r=>Object.assign(old[r.no]||{hk:'clean',ooo:null},{no:String(r.no),type:r.type,floor:String(r.floor),connect:r.connect||null,handicap:!!r.handicap})).concat(dums);ensureDummyBooking(H);provLog(`Rooms saved for ${H.code} (${H.rooms.filter(r=>!r.dummy).length} for sale)`);saved()}});
   box.insertAdjacentHTML('beforeend',dummyRoomsHtml());bindDummyAdd(box,true);

     if(H.floors&&H.floors.length&&!H.floors.some(z=>z.id===fl))H.floors.push({id:fl,name:'Floor '+fl,order:H.floors.length+1});provLog(`Added ${n} rooms to ${H.code}`);saved(`${n} room(s) added`)}},

   listEditor(box,{rows:H.companies.map(c=>({...c,creditLimit:+c.creditLimit||0,_old:true})),cols:[{k:'code',h:'Code',ro:true,w:'80px'},{k:'type',h:'Type',opts:[['C','(C) Company'],['T','(T) Travel agent']]},{k:'name',h:'Name'},{k:'address',h:'Address'},{k:'taxId',h:'Tax ID',w:'130px'},{k:'comm',h:'Comm. %',type:'number',w:'80px'},{k:'creditLimit',h:'Credit limit',type:'number',w:'110px'}],

/* ---- SHA-1 / HMAC-SHA1 / TOTP (RFC 6238, 30-second steps, 6 digits) ---- */
function sha1Bytes(bytes){const H0=[0x67452301,0xEFCDAB89,0x98BADCFE,0x10325476,0xC3D2E1F0];const ml=bytes.length*8;const b=bytes.slice();b.push(0x80);while(b.length%64!==56)b.push(0);
  for(let i=7;i>=0;i--)b.push(Math.floor(ml/Math.pow(2,i*8))&255);const w=new Array(80);const rol=(n,s)=>(n<<s)|(n>>>(32-s));
  for(let i=0;i<b.length;i+=64){for(let t=0;t<16;t++)w[t]=(b[i+t*4]<<24)|(b[i+t*4+1]<<16)|(b[i+t*4+2]<<8)|b[i+t*4+3];for(let t=16;t<80;t++)w[t]=rol(w[t-3]^w[t-8]^w[t-14]^w[t-16],1);
    let [a,bb,c,d,e]=H0;for(let t=0;t<80;t++){const f=t<20?(bb&c)|(~bb&d):t<40?bb^c^d:t<60?(bb&c)|(bb&d)|(c&d):bb^c^d,k=t<20?0x5A827999:t<40?0x6ED9EBA1:t<60?0x8F1BBCDC:0xCA62C1D6;
      const tmp=(rol(a,5)+f+e+k+w[t])|0;e=d;d=c;c=rol(bb,30);bb=a;a=tmp}H0[0]=(H0[0]+a)|0;H0[1]=(H0[1]+bb)|0;H0[2]=(H0[2]+c)|0;H0[3]=(H0[3]+d)|0;H0[4]=(H0[4]+e)|0}
  const out=[];H0.forEach(h=>{for(let i=3;i>=0;i--)out.push((h>>>(i*8))&255)});return out}
function hmacSha1(key,msg){if(key.length>64)key=sha1Bytes(key);const k=key.concat(new Array(64-key.length).fill(0));const ip=k.map(x=>x^0x36),op=k.map(x=>x^0x5c);return sha1Bytes(op.concat(sha1Bytes(ip.concat(msg))))}
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32decode(s){s=s.replace(/[\s=]/g,'').toUpperCase();let bits='',out=[];for(const ch of s){const v=B32.indexOf(ch);if(v<0)continue;bits+=v.toString(2).padStart(5,'0')}for(let i=0;i+8<=bits.length;i+=8)out.push(parseInt(bits.slice(i,i+8),2));return out}
function newTotpSecret(){const a=new Uint8Array(20);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.floor(Math.random()*256));let bits='';a.forEach(x=>bits+=x.toString(2).padStart(8,'0'));let s='';for(let i=0;i<bits.length;i+=5)s+=B32[parseInt(bits.slice(i,i+5).padEnd(5,'0'),2)];return s}
function totp(secret,t){const ctr=Math.floor((t||Date.now())/30000);const msg=[];for(let i=7;i>=0;i--)msg.push(Math.floor(ctr/Math.pow(2,i*8))&255);const h=hmacSha1(b32decode(secret),msg);const o=h[19]&15;

const fmtSecret=s=>s.replace(/(.{4})/g,'$1 ').trim();
function qrSvg(text,size){try{const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),c=size/(n+8);let d='';for(let r=0;r<n;r++)for(let col=0;col<n;col++)if(q.isDark(r,col))d+=`M${((col+4)*c).toFixed(2)},${((r+4)*c).toFixed(2)}h${c.toFixed(2)}v${c.toFixed(2)}h-${c.toFixed(2)}z`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="QR code for Google Authenticator"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}catch(e){return '<div class="sub">QR code could not be drawn. Type the key instead.</div>'}}

function revenueFacts(days){const bd=H.set.bd,ds=dates(bd,addD(bd,days)),T=H.rooms.filter(r=>!r.dummy).length;
  const live=b=>['confirmed','inhouse','tentative'].includes(b.status)||(b.status==='out'&&false);
  const daily=ds.map(d=>{const bk=allBookings().filter(b=>['confirmed','inhouse','tentative'].includes(b.status)&&b.arr<=d&&d<b.dep);const ooo=H.rooms.filter(r=>r.ooo&&r.ooo.from<=d&&d<=r.ooo.to).length;
    const rev=r2(sum(bk,b=>b.nightly[d]||0)),sold=bk.length,cap=T-ooo;return {d,sold,cap,occ:cap?sold/cap*100:0,rev,adr:sold?rev/sold:0,byType:Object.fromEntries(H.roomTypes.map(t=>[t.code,H.rooms.filter(r=>r.type===t.code).length-bk.filter(b=>b.type===t.code).length]))}});
  const rn=sum(daily,x=>x.sold),rev=r2(sum(daily,x=>x.rev)),cap=sum(daily,x=>x.cap);
  const recent=allBookings().filter(b=>{const r=resOf(b);return r.date>=addD(bd,-7)&&r.date<=bd&&live(b)});
  const pickRn=sum(recent,b=>nights(b)),pickRev=r2(sum(recent,stayTotal));
  const fut=allBookings().filter(b=>['confirmed','tentative','inhouse'].includes(b.status)&&b.dep>bd);
  const lead=fut.filter(b=>b.status!=='inhouse').map(b=>diff(resOf(b).date,b.arr)).filter(x=>x>=0);
  const canc=allBookings().filter(b=>b.status==='cancelled'&&b.statusDate>=addD(bd,-30)).length,ns=allBookings().filter(b=>b.status==='noshow'&&b.statusDate>=addD(bd,-30)).length;
  const mix={};fut.forEach(b=>{const c=CO(resOf(b).companyId),k=c?c.name:'Direct';mix[k]=mix[k]||{rn:0,rev:0,comm:c?c.comm||0:0};const inR=dates(b.arr,b.dep).filter(d=>d>=bd&&d<addD(bd,days));mix[k].rn+=inR.length;mix[k].rev+=sum(inR,d=>b.nightly[d]||0)});
  const mixArr=Object.entries(mix).map(([k,v])=>({k,...v,commCost:r2(v.rev*v.comm/100)})).sort((a,b)=>b.rev-a.rev);
  const high=daily.filter(x=>x.occ>=80),low=daily.filter(x=>x.occ<=30);
  const tight=H.roomTypes.map(t=>({code:t.code,name:t.name,base:t.base,minAvl:Math.min(...daily.map(x=>x.byType[t.code])),soldOut:daily.filter(x=>x.byType[t.code]<=0).length,rooms:H.rooms.filter(r=>r.type===t.code).length}));
  return {bd,days,T,daily,rn,rev,cap,occ:cap?rn/cap*100:0,adr:rn?rev/rn:0,revpar:cap?rev/cap:0,pickRn,pickRev,pickCount:recent.length,avgLead:lead.length?sum(lead)/lead.length:0,avgLos:fut.length?sum(fut,nights)/fut.length:0,canc,ns,mixArr,high,low,tight}}
function revenueAdvice(F){const cur=H.set.cur,out=[];
  if(F.high.length)out.push(['up',`${F.high.length} day(s) at 80% or more (${F.high.slice(0,6).map(x=>fd(x.d).slice(0,5)).join(', ')}${F.high.length>6?'…':''}). Raise the open rate by 10–20% on these dates, close discounted and non-refundable rates, and set a minimum stay of 2 nights on the busiest date.`]);
  if(F.low.length)out.push(['down',`${F.low.length} day(s) at 30% or less. Open a limited promotion (member or mobile rate), a breakfast or airport package, or target corporate and long-stay guests for these dates instead of cutting the open rate.`]);
  F.tight.filter(t=>t.soldOut>0||(t.minAvl<=1&&t.rooms>=4)).forEach(t=>out.push(['type',`${t.code} (${t.name}) ${t.soldOut?`is sold out on ${t.soldOut} day(s)`:'is down to its last room on some days'}. Raise ${t.code} by 10–15% and upsell lower room types into it at the desk.`]));
  const ota=F.mixArr.filter(m=>m.comm>0),otaRev=sum(ota,m=>m.rev),share=F.rev?otaRev/F.rev*100:0;
  if(share>=50)out.push(['mix',`${share.toFixed(0)}% of room revenue on the books comes from partners paying commission (about ${m2(sum(ota,m=>m.commCost))} ${cur}). Push direct booking: best-rate guarantee on the hotel website, small direct-only perk, and reply fast to direct enquiries.`]);
  if(F.avgLead&&F.avgLead<7)out.push(['lead',`Guests book only ${F.avgLead.toFixed(1)} days ahead on average. Keep rates flexible close to arrival and review them every morning; do not discount too early.`]);
  if(F.avgLos&&F.avgLos<1.6)out.push(['los',`Average stay is ${F.avgLos.toFixed(1)} nights. A "stay 3, pay 2" or free late check-out for 2+ nights can lengthen stays.`]);
  if(F.ns+F.canc>=3)out.push(['risk',`${F.canc} cancellation(s) and ${F.ns} no-show(s) in the last 30 days. Take deposits or card guarantees for arrivals on busy dates and reconfirm bookings 3 days before arrival.`]);
  if(!out.length)out.push(['ok','Demand looks steady. Keep watching pickup every day and adjust rates on dates that move above 70% occupancy.']);
  return out}

function clNet(b,l){const grp=b.lines.filter(x=>x.group===l.group);const rec=grp.find(x=>x.kind==='payrec')||l;let net=-rec.amt;grp.filter(x=>x.kind==='corrpay').forEach(x=>{net+=-x.amt});return r2(net)}
function refreshCityItems(h){if(!h)return;h.cityLedger=h.cityLedger||[];const live=new Set();
  (h.reservations||[]).forEach(r=>(r.bookings||[]).forEach(b=>(b.lines||[]).forEach(l=>{
    const tc=TCODES.find(c=>c.code===l.code);if(!tc||tc.ptab!=='CITY LEDGER'||tc.refund)return;
    if(l.kind==='pay'&&b.lines.some(x=>x.group===l.group&&x.kind==='payrec'))return;
    if(l.kind!=='payrec'&&l.kind!=='pay')return;
    live.add(l.id);const net=clNet(b,l);let item=h.cityLedger.find(x=>x.lineId===l.id);const g=(h.guests||[]).find(x=>x.id===b.guestId);
    if(!item){item={id:'cl'+uid(),lineId:l.id,pays:[]};h.cityLedger.push(item)}
    item.pays=item.pays||[];
    Object.assign(item,{bookingId:b.id,rsvn:r.no,guest:g?gName(g):'',room:b.room||'',companyId:r.companyId||'',code:l.code,bd:l.bd,ref:l.ref||'',user:l.user||'',amt:net});
    const paid=r2(sum(item.pays,p=>+p.amt||0));item.open=r2(Math.max(0,net-paid));item.status=net<=0.004?'void':item.open<=0.004?'paid':'open';
  })));
  h.cityLedger.forEach(item=>{if(item.lineId&&!live.has(item.lineId)){item.amt=0;item.open=0;item.status='void'}});
}
function ageOf(item){const n=diff(item.bd,H.set.bd);return n<=30?'0-30':n<=60?'31-60':n<=90?'61-90':'90+'}
function buyOpen(p){return r2(Math.max(0,(+p.amt||0)-sum(p.pays||[],x=>+x.amt||0)))}
function pettyBal(upto){const rows=(H.petty||[]).filter(p=>!upto||p.bd<=upto);return r2((+H.pettyFloat||0)+sum(rows,p=>p.dir==='in'?+p.amt:-+p.amt))}

   <div class="form2 mt">${fld('Amount',`<input id="clA" class="n" inputmode="decimal" value="${m2(item.open)}">`)}${fld('Method',`<select id="clM"><option>Cash</option><option>Bank transfer</option><option>Card</option><option>Cheque</option></select>`)}
   ${fld('Reference',`<input id="clR" maxlength="60">`,'span2')}</div><div class="err" id="clE"></div><div class="btns"><button class="btn gold" id="clS">Receive</button></div>`,{w:560});

function bytesToB64(buf){const u=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64ToBytes(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function backupKey(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function downloadEncrypted(){const pass=prompt('Passphrase for this encrypted backup (at least 8 characters):');if(!pass)return;if(pass.length<8){toast('Use at least 8 characters.');return}
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await backupKey(pass,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(DB)));
  const blob=JSON.stringify({v:1,k:'AES-GCM',salt:bytesToB64(salt),iv:bytesToB64(iv),ct:bytesToB64(ct)});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([blob],{type:'application/json'}));a.download=`mahahub-encrypted-${iso(new Date())}.mhe`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400);toast('Encrypted backup downloaded')}
async function decryptBackup(obj,pass){const key=await backupKey(pass,b64ToBytes(obj.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(obj.iv)},key,b64ToBytes(obj.ct));return JSON.parse(new TextDecoder().decode(pt))}

  if($('#txPurge',el))$('#txPurge',el).onclick=()=>{if(!confirm(`Remove ${old.length} tax ${old.length===1?'copy':'copies'} older than 5 years?`))return;const keep=new Set(old);H.taxCopies=H.taxCopies.filter(x=>!keep.has(x));log('Purged tax copies older than 5 years');refresh();toast('Old tax copies removed')};
};
