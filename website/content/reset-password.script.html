<script>
/* Password set / reset page. The emailed link carries a short-lived sign-in token in the address after the
   "#"; it is read once, removed from the address bar, kept only in memory, and used to set the password.
   Nothing here is stored or logged. Keep URL and KEY the same as MAHA_AUTH_CONFIG in ecosystem/index.html. */
(function () {
  'use strict';
  var URL_BASE = 'https://wragaoglvksbbgmfjyzp.supabase.co';
  var KEY = 'sb_publishable_ZBa3rioiS97esdCkJZjuYA_wVArOAnD';

  var $ = function (id) { return document.getElementById(id); };
  var show = function (id, on) { var el = $(id); if (el) el.style.display = on ? '' : 'none'; };

  function parseHash() {
    var out = {};
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) return out;
    h.split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i < 0) return;
      try { out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); } catch (e) {}
    });
    return out;
  }

  var params = parseHash();
  var token = params.access_token || '';
  var linkError = params.error_code || params.error || '';
  /* remove the token from the address bar and history straight away */
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  function api(method, path, body) {
    return fetch(URL_BASE + path, {
      method: method,
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    });
  }

  function bad(text) {
    show('rp-loading', false); show('rp-form', false);
    $('rp-bad-text').textContent = text;
    show('rp-bad', true);
    $('rp-title').textContent = 'Link not valid';
  }

  if (linkError || !token || params.type && params.type !== 'recovery' && params.type !== 'invite' && params.type !== 'signup') {
    bad(linkError === 'otp_expired' || linkError === 'access_denied'
      ? 'This link has expired or was already used.'
      : 'This page needs the link from your email. Open the email and press the link again.');
    return;
  }

  var username = '';
  api('GET', '/auth/v1/user').then(function (r) {
    if (!r.ok || !r.data || !r.data.id) { bad('This link has expired or was already used.'); return; }
    username = String((r.data.user_metadata && r.data.user_metadata.maha_username) || '').toLowerCase();
    if (username) $('rp-who').textContent = 'Setting the password for: ' + username;
    show('rp-loading', false); show('rp-form', true);
    $('rp-new').focus();
  }, function () { bad('The service did not answer. Check your connection and press the link in your email again.'); });

  function passwordProblem(pw) {
    if (pw.length < 10) return 'Use at least 10 characters.';
    if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return 'Use letters and numbers.';
    if (username && pw.toLowerCase().indexOf(username) >= 0) return 'Do not include your username in the password.';
    if (pw === 'Padauk@2026' || pw === 'Maha@2026') return 'Choose your own new password.';
    return '';
  }
  function flag(fieldId, errId, message) {
    var field = $(fieldId).parentNode;
    if (message) { $(errId).textContent = message; field.classList.add('bad'); } else { field.classList.remove('bad'); }
  }

  $('rp-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('rp-new').value, again = $('rp-again').value;
    var problem = passwordProblem(pw);
    flag('rp-new', 'rp-new-err', problem);
    flag('rp-again', 'rp-again-err', !problem && pw !== again ? 'The two passwords are not the same.' : '');
    $('rp-send-err').style.display = 'none';
    if (problem || pw !== again) return;
    var btn = $('rp-go'); btn.disabled = true; btn.textContent = 'Saving...';
    api('PUT', '/auth/v1/user', { password: pw }).then(function (r) {
      if (r.ok) {
        /* the link signed this browser in; end that session now so the password is used at the real sign-in */
        api('POST', '/auth/v1/logout?scope=local').then(function () {}, function () {});
        token = ''; $('rp-new').value = ''; $('rp-again').value = '';
        show('rp-form', false); $('rp-title').textContent = 'Password saved';
        $('rp-done').classList.add('show');
        return;
      }
      btn.disabled = false; btn.textContent = 'Save password';
      var code = r.data && (r.data.error_code || r.data.code || r.data.msg || '');
      var msg = 'The password could not be saved. Try again in a moment.';
      if (r.status === 401 || r.status === 403) { bad('This link has expired or was already used.'); return; }
      if (/same_password/.test(String(code))) msg = 'Choose a password you have not used before.';
      else if (/weak_password/.test(String(code))) msg = 'That password is too easy to guess. Use a longer one with letters and numbers.';
      var box = $('rp-send-err'); box.textContent = msg; box.style.display = 'block';
    }, function () {
      btn.disabled = false; btn.textContent = 'Save password';
      var box = $('rp-send-err'); box.textContent = 'The service did not answer. Check your connection and try again.'; box.style.display = 'block';
    });
  });
})();
</script>
