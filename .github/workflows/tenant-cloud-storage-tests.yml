name: Tenant cloud storage SQL tests

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/**'
      - 'docs/USERNAME_AUTH_IMPLEMENTATION.md'
      - '.github/workflows/tenant-cloud-storage-tests.yml'
  push:
    branches:
      - codex/cloud-pms-auth-sync
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/tenant-cloud-storage-tests.yml'

jobs:
  tenant-cloud-storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: maha_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Auth compatibility schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/tenant_cloud_test_bootstrap.sql
      - name: Apply tenant schema migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261009_001_tenant_identity_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261009_002_property_cloud_storage.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261009_003_username_auth_owner_boundary.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261009_004_global_property_code_atomic_provision.sql
      - name: Run tenant isolation and concurrency smoke tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/tenant_cloud_storage_test.sql
      - name: Run username privacy and owner boundary smoke tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/username_auth_owner_boundary_test.sql
      - name: Run provisioning and property code tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/provision_and_property_code_test.sql
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check --no-lock supabase/functions/username-auth/index.ts supabase/functions/platform-admin-provision/index.ts supabase/functions/tenant-cloud/index.ts
