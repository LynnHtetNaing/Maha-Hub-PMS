name: Stripe Worker Tests

on:
  pull_request:
    paths:
      - "workers/stripe/**"
      - ".github/workflows/stripe-worker-tests.yml"
  push:
    branches:
      - "codex/maha-hub-hardening"
    paths:
      - "workers/stripe/**"
      - ".github/workflows/stripe-worker-tests.yml"

permissions:
  contents: read

jobs:
  stripe-worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/stripe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Stripe Worker tests
        run: npm test
