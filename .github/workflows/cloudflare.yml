# Deploy Hub Worker (maha-hub-pms), Pages, and the Stripe Worker.
# GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
# Wrangler is installed globally so it is not uploaded with the site.
# A local install drops node_modules/workerd (about 122 MB), which Cloudflare rejects.

name: Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hub-worker:
    name: Deploy Worker (maha-hub-pms)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Hub Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set. Skipping."
            exit 0
          fi
          npm install -g wrangler@4
          wrangler deploy

  pages:
    name: Deploy Pages (maha-hub)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set. Skipping."
            exit 0
          fi
          npm install -g wrangler@4
          wrangler pages project create maha-hub --production-branch main || true
          mkdir -p /tmp/maha-pages
          tar -cf - --exclude .git --exclude node_modules --exclude .wrangler --exclude .github . | tar -xf - -C /tmp/maha-pages
          wrangler pages deploy /tmp/maha-pages --project-name=maha-hub --commit-dirty=true --branch=main

  stripe-worker:
    name: Deploy Stripe Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Worker
        working-directory: workers/stripe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set. Skipping."
            exit 0
          fi
          npm install -g wrangler@4
          wrangler deploy
