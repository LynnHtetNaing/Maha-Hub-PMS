<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Maha Sales - not plugged in yet</title>
<link rel="icon" href="/icons/maha-mark-sq.png">
<style>
:root{--sky1:#ffd9a0;--sky2:#ffeccc;--sky3:#fff7e8;--sun:#fff3c4;--far:#e9b98a;--mid:#dfa573;--near:#d19562;--sand:#efc58f;--sand2:#e3b178;--cact:#3f8a5a;--cact2:#2f6f47;--cactl:#58a574;--ink:#3b2a1d;--accent:#d2561f;--btn:#176B50;--cable1:#e8742b;--cable2:#2f7fd0;--skin:#e0a678;--shirt:#c9b27a;--vest:#8a6a3a;--short:#9b8b5a;--hat:#d8c48a;--hatd:#b8a06a;--beard:#4a3222;--boot:#4a3526;--shadow:rgba(80,40,10,.22);--star:0}
@media (prefers-color-scheme: dark){:root{--sky1:#1a1033;--sky2:#35224f;--sky3:#6b3a62;--sun:#f3efd0;--far:#4a2c52;--mid:#3d2445;--near:#33203b;--sand:#5a3a4a;--sand2:#4a2f3d;--cact:#2f7a52;--cact2:#235c3d;--cactl:#46996a;--ink:#f3e9dc;--accent:#ffb454;--btn:#1f8a66;--cable1:#ff9a3d;--cable2:#5aa8ff;--skin:#d69a6c;--shirt:#a89466;--vest:#6e5430;--short:#7d7048;--hat:#bba974;--hatd:#9a8858;--beard:#2f1f14;--boot:#2d2119;--shadow:rgba(0,0,0,.35);--star:1}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 46%,var(--sky3) 100%);overflow:hidden;position:relative}
.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:68%;display:block}
.stars{opacity:var(--star)}
.wrap{position:relative;z-index:2;text-align:center;padding:5.5vh 20px 0}
.code{font:800 clamp(64px,12vw,132px)/1 Inter,system-ui,sans-serif;letter-spacing:.04em;color:var(--accent);margin:0;text-shadow:0 4px 0 var(--shadow)}
h1{font:700 clamp(20px,3.2vw,32px)/1.25 Inter,system-ui,sans-serif;margin:6px 0 8px}
p{margin:0 auto;max-width:520px;font-size:clamp(14px,1.8vw,17px);line-height:1.5;opacity:.82}
.back{display:inline-block;margin-top:18px;padding:11px 22px;border-radius:10px;background:var(--btn);color:#fff;text-decoration:none;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.back:hover{filter:brightness(1.08)}
.brand{position:absolute;z-index:3;left:20px;top:16px;font:800 13px/1 Inter,system-ui,sans-serif;letter-spacing:.16em;opacity:.8}
.spark{animation:sp 1.1s steps(2,end) infinite}
@keyframes sp{0%{opacity:1}50%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.spark{animation:none}}
@media (max-width:640px){.scene{height:58%}}
</style>
</head>
<body>
<div class="brand">MAHA SALES</div>
<div class="wrap">
  <div class="code">404</div>
  <h1>Maha Sales for hotels is not plugged in yet</h1>
  <p>Our explorer is still trying to connect the cables. Please come back soon.</p>
  <a class="back" href="https://solutions.maha-hub.com/">Back to Maha Solutions</a>
</div>

  </g>
  <!-- little rocks and a tumbleweed -->
  <ellipse cx="700" cy="528" rx="26" ry="9" fill="var(--near)"/><ellipse cx="716" cy="522" rx="14" ry="7" fill="var(--mid)"/>
