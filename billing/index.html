<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Maha Hub Billing</title>
<link rel="icon" href="/favicon.ico">
<script src="/brand/maha/maha-loader.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--a1:#059669;--a2:#0D9488;--a3:#2563EB;--bg:#ECF6F1;--card:#fff;--line:#D3E6DC;--ink:#0D2A24;--mut:#52705F;--side:#0B3D2E;--sidei:#E8F3EC;--act:#D49A38;--actink:#1c1405;--red:#B3261E;--ok:#0E7A4F;--warn:#A8650A;--link:#176B50}
:root[data-mode=dark]{--bg:#0E1A17;--card:#15241F;--line:#25382F;--ink:#E7F1EC;--mut:#93AEA1;--side:#0A1512;--link:#6FD0A6;--red:#FF9C95;--ok:#6FD0A6;--warn:#F2B766}
*{box-sizing:border-box}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans",system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Manrope,"Noto Sans",sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}
.signin{max-width:380px;margin:60px auto;padding:0 16px}
/* sign-in: the same screen as the CRM (sky and pagoda background, grey box, gate logo) */
#auth{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;overflow:auto;background:linear-gradient(180deg,#cfeee2 0%,#eef8f4 60%,#fbfdfc 100%);font-family:Inter,"Noto Sans",system-ui,sans-serif;color:#1f2d36}
#auth::before{content:"";position:absolute;inset:0;background:url(/brand/maha/scene-light.svg) 50% 100%/100% auto no-repeat;opacity:.7;pointer-events:none}
.au-box{position:relative;width:min(560px,100%);background:#eceff0;color:#1f2d36;border-radius:24px;padding:44px 52px 40px;box-shadow:0 40px 60px -18px rgba(8,40,30,.38),0 14px 26px rgba(8,40,30,.16)}
.au-brand{display:flex;align-items:center;gap:14px;margin-bottom:6px}.au-brand img{width:56px;height:auto;filter:brightness(.4) saturate(3.4) contrast(1.35)}.au-brand b{font:800 28px/1 Inter,system-ui,sans-serif;letter-spacing:.14em;color:#0b3d2e}
.au-full{margin:0 0 24px 70px;font:600 16px/1.3 Inter,system-ui,sans-serif;letter-spacing:.04em;color:#556470}
.au-box h1{margin:0 0 10px;font:700 30px/1.2 Inter,system-ui,sans-serif;color:#1f2d36}
.au-sub{margin:0 0 16px;color:#556470;font-size:15px}
.au-box .f{display:block;margin:14px 0}.au-box .f span{display:block;color:#556470;font-size:13.5px;font-weight:600;margin-bottom:4px}
.au-box input{width:100%;border:1px solid #c5d0d8;background:#fff;color:#1a272f;border-radius:8px;min-height:48px;padding:8px 14px;font-size:16px}
.au-err{min-height:1.3em;margin:8px 0;color:#b3261e;font-size:14px;font-weight:600}
.au-go{display:block;width:100%;min-height:50px;font-size:16px;margin-top:6px;border:0;border-radius:10px;background:#176B50;color:#fff;font-weight:700;cursor:pointer}.au-go:hover{background:#0B3D2E}.au-go:disabled{opacity:.6;cursor:default}
@media (max-width:560px){.au-box{padding:30px 22px 28px}.au-full{margin-left:0}}
/* page titles with their icon, and the menu icons */
.pgt{display:flex;align-items:center;gap:12px;margin-bottom:2px}.pgt h1{margin:0}.pgi{display:grid;place-items:center;color:var(--a1)}.pgi svg{width:30px;height:30px}
.nav button svg{width:19px;height:19px;flex:none}
.side{display:flex;flex-direction:column}.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:16px}
.side-foot button{border:1px solid #ffffff30;background:#ffffff14;color:var(--sidei);border-radius:10px;padding:8px 10px;font-weight:600;cursor:pointer}
@media (hover:hover){.side-foot button:hover{background:#ffffff26}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.signin h1{font-size:22px;margin-bottom:4px}.signin p{color:var(--mut);margin:0 0 14px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.go{display:block;width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#1c1824;color:#fff;font-weight:700;cursor:pointer}
:root[data-mode=dark] .go{background:#E7EDF3;color:#10161C}
.err{color:var(--red);min-height:20px;margin-top:8px}
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--side);color:var(--sidei);padding:18px 12px;flex:none}
.who{text-align:center;padding:6px 6px 16px}
.av{width:50px;height:50px;border-radius:12px;background:var(--act);color:var(--actink);display:grid;place-items:center;font:800 18px Manrope,sans-serif;margin:0 auto 8px}
.who b{display:block;font:700 15px Manrope,sans-serif}.who small{opacity:.75}
.who select{margin-top:8px;background:#ffffff14;color:var(--sidei);border-color:#ffffff30;padding:6px 8px}
.who select option{color:#0D2A24}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nav button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;color:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600}
.nav button.on{background:var(--act);color:var(--actink)}
@media (hover:hover){.nav button:not(.on):hover{background:#ffffff18}}
.main{flex:1;min-width:0;padding:22px 26px}
.main h1{font-size:22px}.sub{color:var(--mut);margin:2px 0 18px}
.sec{font:700 17px Manrope,sans-serif;margin:22px 0 10px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}td.n,th.n{text-align:right}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--mut) 16%,var(--card))}
.pill.paid,.pill.active,.pill.accepted{color:var(--ok)}.pill.open{color:var(--warn)}.pill.void,.pill.declined,.pill.ended{color:var(--red)}
.big{font:800 26px Manrope,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dot{display:inline-block;width:4px;height:16px;border-radius:2px;vertical-align:-3px;margin-right:8px}
.empty{color:var(--mut);padding:22px;text-align:center}
.pay{color:var(--link);font-weight:700;text-decoration:none;margin-left:12px;padding-left:12px;border-left:1px solid var(--line)}
.foot{margin-top:26px;color:var(--mut);font-size:13px}
.soon{background:color-mix(in srgb,var(--act) 18%,var(--card));border:1px solid color-mix(in srgb,var(--act) 50%,var(--card));border-radius:12px;padding:10px 14px;margin-bottom:14px}
.soon.late{background:color-mix(in srgb,#d64541 14%,var(--card));border-color:color-mix(in srgb,#d64541 45%,var(--card))}
@media (max-width:800px){.app{flex-direction:column}.side{width:auto;padding:10px}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap}.who{display:flex;align-items:center;gap:10px;text-align:left}.av{margin:0}.main{padding:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* Maha Hub Billing: one page for every Maha system. It opens in its own tab (Renew Now / Billing in the PMS, Reach, Connect, Booking, Sales).
   A hotel sees only its own records (the server enforces it); the provider records them in the Provider console. */
(function(){
const CFG={url:'https://wragaoglvksbbgmfjyzp.supabase.co',key:'sb_publishable_ZBa3rioiS97esdCkJZjuYA_wVArOAnD'};
const KEY='maha.billing.auth',$=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,c)=>(c||'USD')+' '+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=s=>{if(!s)return '-';const d=new Date(s+'T00:00:00');return isNaN(d)?esc(s):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const I=(d)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const ICO={home:I('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'),quotes:I('<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h5"/>'),subscriptions:I('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/>'),invoices:I('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),payments:I('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>'),statements:I('<path d="M4 5h16M4 10h16M4 15h10M4 20h7"/>')};
const ttl=(k,txt)=>'<div class="pgt"><span class="pgi">'+ICO[k]+'</span><h1>'+txt+'</h1></div>';
const ST={t:null,props:[],pid:'',docs:[],tab:'home',admin:false};
const store=()=>{try{return sessionStorage}catch(e){return null}};
const rd=()=>{try{const t=JSON.parse(store().getItem(KEY)||'null');return t&&t.access_token&&t.expires_at>Date.now()?t:null}catch(e){return null}};
const wr=t=>{try{t?store().setItem(KEY,JSON.stringify(t)):store().removeItem(KEY)}catch(e){}};
function mode(m){document.documentElement.dataset.mode=m;if($('#tm'))$('#tm').textContent=m==='dark'?'Light mode':'Dark mode';try{localStorage.setItem('maha.billing.mode',m)}catch(e){}}
try{mode(localStorage.getItem('maha.billing.mode')==='dark'?'dark':'light')}catch(e){mode('light')}
function chrome(){const tm=$('#tm'),so=$('#so');if(tm){tm.textContent=document.documentElement.dataset.mode==='dark'?'Light mode':'Dark mode';tm.onclick=()=>mode(document.documentElement.dataset.mode==='dark'?'light':'dark')}if(so)so.onclick=()=>{wr(null);ST.t=null;signin()}}
async function api(path,opt){const t=ST.t;const r=await fetch(CFG.url+path,Object.assign({headers:{apikey:CFG.key,Authorization:'Bearer '+(t?t.access_token:CFG.key),Accept:'application/json','Content-Type':'application/json'}},opt||{}));let d=null;try{d=await r.json()}catch(e){}return {ok:r.ok,status:r.status,d}}
const keep=d=>({access_token:d.access_token,expires_at:Date.now()+Math.max(60,+d.expires_in||3600)*1000});
function signin(msg){
  if(window.MahaLoader)MahaLoader.hide();
  $('#root').innerHTML=`<div id="auth"><div class="au-box"><div class="au-brand"><img src="/brand/maha/gate-gold.png" alt=""><b>BILLING</b></div><div class="au-full">Maha Hub Billing</div><h1>Sign in</h1><p class="au-sub">Use the same username and password as your Maha system.</p>
  <label class="f"><span>Username</span><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label class="f"><span>Password</span><input id="p" type="password" autocomplete="current-password"></label>
  <div class="au-err" id="e" role="alert">${esc(msg||'')}</div><button class="au-go" id="go" type="button">Sign in</button></div></div>`;
  const go=async()=>{const u=$('#u').value.trim(),p=$('#p').value;if(!u||!p){$('#e').textContent='Enter your username and password.';return}
    $('#go').disabled=true;$('#e').textContent='';
    let r;try{r=await api('/functions/v1/username-auth',{method:'POST',body:JSON.stringify({action:'login',username:u,password:p,device_id:dev()})})}catch(e){$('#e').textContent='The sign-in service did not answer. Try again.';$('#go').disabled=false;return}
    if(r.ok&&r.d&&r.d.needs_code&&r.d.challenge)return code(u,r.d);
    if(!r.ok||!r.d||!r.d.access_token){$('#e').textContent=r.status===401||r.status===400?'Username or password is not correct.':'Sign-in is not available right now. Try again in a moment.';$('#go').disabled=false;return}
    done(keep(r.d))};
  $('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()};$('#u').focus()}
function dev(){try{const v=localStorage.getItem('maha.deviceId');if(/^[A-Za-z0-9_-]{16,64}$/.test(v||''))return v}catch(e){}return 'billing-'+Math.random().toString(36).slice(2,12)+Math.random().toString(36).slice(2,12)}
function code(u,d,again){
  $('#root').innerHTML=`<div id="auth"><div class="au-box"><div class="au-brand"><img src="/brand/maha/gate-gold.png" alt=""><b>BILLING</b></div><div class="au-full">Maha Hub Billing</div><h1>Check your email</h1><p class="au-sub">We sent a 6-digit code to <b>${esc(d.sent_to||'your email')}</b>. It is valid for 10 minutes. Look in the junk folder if it does not arrive.</p>
  <label class="f"><span>Code</span><input id="c" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><div class="au-err" id="e" role="alert">${esc(again||'')}</div><button class="au-go" id="go" type="button">Continue</button></div></div>`;
  const go=async()=>{const c=$('#c').value.replace(/\s+/g,'');if(!/^\d{6}$/.test(c)){$('#e').textContent='Enter the 6 digits from the email.';return}
    const r=await api('/functions/v1/username-auth',{method:'POST',body:JSON.stringify({action:'verify_code',username:u,challenge:d.challenge,code:c,remember:true,device_id:dev()})});
    if(r.ok&&r.d&&r.d.access_token)return done(keep(r.d));
    if(r.status===401&&r.d&&r.d.error==='code_wrong')return code(u,d,'That code is not correct. Use the newest code from the email.');
    signin('The code could not be checked. Sign in again.')};
  $('#go').onclick=go;$('#c').onkeydown=e=>{if(e.key==='Enter')go()};$('#c').focus()}
async function done(t){wr(t);ST.t=t;await load()}
async function load(){
  if(window.MahaLoader)MahaLoader.show({name:'Maha Billing',dark:document.documentElement.dataset.mode==='dark'});else $('#root').innerHTML='<div class="signin"><div class="card">Loading...</div></div>';
  const [p,a]=await Promise.all([api('/rest/v1/maha_properties?select=id,property_code,name&property_code=not.is.null&order=property_code'),api('/rest/v1/rpc/maha_is_platform_admin',{method:'POST',body:'{}'})]);
  if(p.status===401){wr(null);return signin('Your sign-in has ended. Sign in again.')}
  ST.admin=a.ok&&a.d===true;ST.props=Array.isArray(p.d)?p.d:[];
  const want=new URLSearchParams(location.search).get('hotel');const hit=want&&ST.props.find(x=>String(x.property_code).toUpperCase()===want.toUpperCase());
  ST.pid=(hit||ST.props[0]||{}).id||'';
  await docs()}
async function docs(){
  ST.docs=[];ST.err='';
  if(ST.pid){const r=await api('/rest/v1/maha_billing_docs?select=*&property_id=eq.'+encodeURIComponent(ST.pid)+'&order=doc_date.desc,created_at.desc');
    if(r.ok&&Array.isArray(r.d))ST.docs=r.d;else ST.err=r.status===404?'Billing is not switched on yet. Please contact your provider.':'Billing records could not be loaded. Try again in a moment.'}
  ST.files={};if(ST.docs.length){const f=await api('/rest/v1/maha_billing_files?select=doc_id,path,file_name&property_id=eq.'+encodeURIComponent(ST.pid)+'&order=created_at');if(f.ok&&Array.isArray(f.d))f.d.forEach(x=>(ST.files[x.doc_id]=ST.files[x.doc_id]||[]).push(x))}
  draw()}
async function openFile(path){const w=window.open('','_blank');try{const r=await api('/storage/v1/object/sign/billing-files/'+path.split('/').map(encodeURIComponent).join('/'),{method:'POST',body:JSON.stringify({expiresIn:60})});if(!r.ok||!r.d||!r.d.signedURL)throw new Error('not available');const u=CFG.url+'/storage/v1'+r.d.signedURL;if(w){w.opener=null;w.location=u}else window.open(u,'_blank')}catch(e){try{if(w)w.close()}catch(x){}alert('The file could not be opened. Try again.')}}
const kind=k=>ST.docs.filter(d=>d.kind===k);
const pill=s=>`<span class="pill ${esc(s)}">${esc(s.charAt(0).toUpperCase()+s.slice(1))}</span>`;
function table(cols,rows){const hf=rows.some(r=>(ST.files||{})[r.id]);const fb=r=>((ST.files||{})[r.id]||[]).map(f=>`<button type="button" class="go" style="width:auto;margin:0 4px 0 0;padding:4px 10px" data-bf="${esc(f.path)}" title="${esc(f.file_name)}">Open</button>`).join('');return rows.length?`<div class="card tw"><table><thead><tr>${cols.map(c=>`<th class="${c[2]||''}">${c[0]}</th>`).join('')}${hf?'<th>Files</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c[2]||''}">${c[1](r)}</td>`).join('')}${hf?`<td>${fb(r)}</td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="card empty">Nothing here yet.</div>'}
const TAB={
 home(){
  const cur={};ST.docs.forEach(d=>{const c=cur[d.currency]||(cur[d.currency]={due:0,n:0,credit:0});if(d.kind==='invoice'&&d.status==='open'){c.due+=+d.amount;c.n++}if(d.kind==='payment'&&d.status==='open')c.credit+=+d.amount});
  const rows=Object.keys(cur);const last=kind('payment').filter(d=>d.status!=='void')[0];
  const sub=kind('subscription').filter(s=>s.status==='active'&&s.period_to).sort((a,b)=>a.period_to<b.period_to?1:-1)[0];
  let note='';if(sub){const n=Math.round((new Date(sub.period_to+'T00:00:00')-new Date(new Date().toDateString()))/864e5);if(n<=30)note=`<div class="soon ${n<=7?'late':''}"><b>${n<0?'Your subscription ended on ':'Your subscription ends on '}${dt(sub.period_to)}.</b> ${n<0?'Please pay the open invoice or contact us to renew.':'Avoid any disruption to your guests and operations.'}</div>`}
  const h=ST.props.find(x=>x.id===ST.pid)||{};
  return `${ttl('home','Hello '+esc(h.name||'')+'!')}<div class="sub">Happy billing with Maha Hub</div>${note}
  <div class="sec">Balance Summary</div>${rows.length?`<div class="card tw"><table><thead><tr><th>Currency</th><th class="n"><i class="dot" style="background:var(--ok)"></i>Available Credits</th><th class="n"><i class="dot" style="background:var(--act)"></i>Balance Payable</th></tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(c)}</td><td class="n">${money(cur[c].credit,c)}</td><td class="n">${money(cur[c].due,c)}${cur[c].due?`<a class="pay" href="/contact.html" target="_blank" rel="noopener">Pay &rarr;</a>`:''}<br><small style="color:var(--mut)">Number of Invoices : ${cur[c].n}</small></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">No balance yet.</div>'}
  <div class="sec">Last Payment Made</div>${last?`<div class="card" style="max-width:520px"><div class="big">${money(last.amount,last.currency)}</div><div style="color:var(--mut)">${last.paid_for?'Paid for '+esc(last.paid_for):''}</div><div class="grid" style="margin-top:10px"><div><small style="color:var(--mut)">Paid On</small><br><b>${dt(last.doc_date)}</b></div><div><small style="color:var(--mut)">Payment #</small><br><b>${esc(last.no)}</b></div></div></div>`:'<div class="card empty">No payment recorded yet.</div>'}
  <div class="sec">My Details</div><div class="card" style="max-width:520px"><h3>${esc(h.name||'')}</h3><div style="color:var(--mut)">Property Code: <b>${esc(h.property_code||'')}</b></div></div>
  <div class="foot"><b>Maha Hub</b><br>Questions about a bill? <a href="/contact.html" target="_blank" rel="noopener">Contact billing</a></div>`},
 quotes(){return ttl('quotes','Quotes')+'<div class="sub">Quotes sent to you</div>'+table([['Quote #',r=>esc(r.no)],['Date',r=>dt(r.doc_date)],['Valid until',r=>dt(r.due_date)],['Status',r=>pill(r.status)],['Amount',r=>money(r.amount,r.currency),'n']],kind('quote'))},
 subscriptions(){return ttl('subscriptions','Subscriptions')+'<div class="sub">Your plans and their dates</div>'+table([['Plan',r=>esc(r.no)],['From',r=>dt(r.period_from)],['Until',r=>dt(r.period_to)],['Status',r=>pill(r.status)],['Amount',r=>money(r.amount,r.currency),'n'],['Note',r=>esc(r.note||'')]],kind('subscription'))},
 invoices(){return ttl('invoices','Tax Invoices')+'<div class="sub">All tax invoices</div>'+table([['Tax Invoice #',r=>esc(r.no)],['Date',r=>dt(r.doc_date)],['Due',r=>dt(r.due_date)],['Status',r=>pill(r.status)],['Amount',r=>money(r.amount,r.currency),'n']],kind('invoice'))},
 payments(){return ttl('payments','Payments Made')+'<div class="sub">Payments we received</div>'+table([['Payment #',r=>esc(r.no)],['Date',r=>dt(r.doc_date)],['Paid for',r=>esc(r.paid_for||'-')],['Status',r=>pill(r.status)],['Amount',r=>money(r.amount,r.currency),'n']],kind('payment'))},
 statements(){
  const ev=ST.docs.filter(d=>(d.kind==='invoice'||d.kind==='payment')&&d.status!=='void').sort((a,b)=>a.doc_date<b.doc_date?-1:a.doc_date>b.doc_date?1:a.created_at<b.created_at?-1:1);
  const bal={};const rows=ev.map(d=>{const c=d.currency;bal[c]=(bal[c]||0)+(d.kind==='invoice'?+d.amount:-d.amount);return Object.assign({},d,{run:bal[c]})}).reverse();
  return ttl('statements','Statements')+'<div class="sub">Invoices and payments in date order, with the running balance</div>'+table([['Date',r=>dt(r.doc_date)],['Type',r=>r.kind==='invoice'?'Invoice':'Payment'],['No.',r=>esc(r.no)],['Charged',r=>r.kind==='invoice'?money(r.amount,r.currency):'','n'],['Paid',r=>r.kind==='payment'?money(r.amount,r.currency):'','n'],['Balance',r=>money(r.run,r.currency),'n']],rows)}
};
const NAV=[['home','Home'],['quotes','Quotes'],['subscriptions','Subscriptions'],['invoices','Tax Invoices'],['payments','Payments Made'],['statements','Statements']];
function draw(){
  if(window.MahaLoader)MahaLoader.hide();
  const h=ST.props.find(x=>x.id===ST.pid);
  if(!h){$('#root').innerHTML='<div class="signin"><div class="card"><h1>No hotel found</h1><p>This account is not linked to a hotel yet. Please contact your provider.</p></div></div>';return}
  const ini=(h.name||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  $('#root').innerHTML=`<div class="app"><aside class="side"><div class="who"><div class="av">${esc(ini)}</div><div><b>${esc(h.name)}</b><small>${esc(h.property_code)}</small>${ST.props.length>1?`<select id="hp" aria-label="Hotel">${ST.props.map(p=>`<option value="${esc(p.id)}"${p.id===ST.pid?' selected':''}>${esc(p.property_code)} - ${esc(p.name)}</option>`).join('')}</select>`:''}</div></div>
  <nav class="nav">${NAV.map(n=>`<button type="button" data-t="${n[0]}" class="${ST.tab===n[0]?'on':''}">${ICO[n[0]]}${n[1]}</button>`).join('')}</nav><div class="side-foot"><button type="button" id="tm">Dark mode</button><button type="button" id="so">Sign out</button></div></aside>
  <main class="main">${ST.err?`<div class="soon late">${esc(ST.err)}</div>`:''}${TAB[ST.tab]()}</main></div>`;
  chrome();document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{ST.tab=b.dataset.t;draw()});
  document.querySelectorAll('[data-bf]').forEach(x=>x.onclick=()=>openFile(x.dataset.bf));
  const hp=$('#hp');if(hp)hp.onchange=()=>{ST.pid=hp.value;docs()}}
window.__billing={ST,draw,docs:d=>{ST.docs=d;ST.props=ST.props.length?ST.props:[{id:'x',property_code:'DEMO',name:'Demo Hotel'}];ST.pid=ST.pid||ST.props[0].id;draw()}};
const t=rd();if(t){ST.t=t;load()}else signin();
})();
</script>
</body>
