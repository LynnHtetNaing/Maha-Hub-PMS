function originalPage(title){
 const actualTitles={'Manager Dashboard':'Dashboard : All floors','Hotel Status':'Dashboard : All floors','Post Room / Close Day':'Closing the day','Help':'In-app Support'};
 const actualTitle=actualTitles[title]||title;
 const cfg=MODULES[title];
 if(!cfg) return heading(actualTitle,exactOriginalSubtitles[title]||'',btn('Refresh view','Refresh sample view'))+panel('Workspace overview','Sample operational view','<div class="empty-state">This page has no dedicated content definition yet.</div>');
 const kpis=metrics(cfg.k.map(m=>[m[0],m[1],m[2],m[3]]));
 const rows=cfg.rows.map(r=>r.map((v,j)=>j===r.length-1&&/status/i.test(cfg.cols[cfg.cols.length-1])?status(v,/active|approved|available|ready|in house|enabled|settled/i.test(v)?'ready':/pending|review|awaiting|partial|upcoming|attention|overdue|blocked|expired/i.test(v)?'pending':'arriving'):v));
 const tools='<div class="page-tools" style="padding:0 18px 14px"><input class="field searchfield" placeholder="Search '+actualTitle.toLowerCase()+'…" data-module-search><select class="field"><option>All statuses</option><option>Active / ready</option><option>Pending review</option><option>Closed / inactive</option></select><button class="btn" data-toast="Filter options opened — sample preview">Filters</button></div>';
 const primary=heading(actualTitle,exactOriginalSubtitles[title]||cfg.sub,btn('Export','Export '+actualTitle+' preview')+btn('＋ '+(/reservation|folio|rate|staff|room|company|group|purchase|petty cash/i.test(title)?'Add new':'New entry'),'Create '+actualTitle+' preview',true))+kpis+panel(cfg.section,cfg.note,tools+table(cfg.cols,rows));
 const side=panel(cfg.side,'Recommended operational checks',cfg.items.map((it,i)=>'<div class="setting-row"><div><strong>'+it[0]+'</strong><p>'+it[1]+'</p></div><button class="btn" data-toast="'+it[0]+' — preview only">Review</button></div>').join(''));
 const secondary=panel('Recent activity','Illustrative audit trail','<div class="activity"><div class="activity-item"><div class="activity-dot">✓</div><div class="activity-text"><b>Workspace reviewed</b><div class="activity-time">Today · sample activity only</div></div></div><div class="activity-item"><div class="activity-dot">↻</div><div class="activity-text"><b>Latest record available for review</b><div class="activity-time">No live PMS record has been changed</div></div></div></div>');
 return primary+'<div class="bottom-grid" style="grid-template-columns:minmax(0,1.25fr) minmax(280px,.8fr);margin-top:15px">'+side+secondary+'</div>';
}
function render(view){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view||(view==='Dashboard'&&b.dataset.view==='Dashboard : All floors')));const activeNav=document.querySelector('[data-view].active');document.querySelectorAll('.nav-group').forEach(group=>{const open=!!activeNav&&group.contains(activeNav);group.classList.toggle('open',open);const toggle=group.querySelector('.nav-group-toggle');if(toggle)toggle.setAttribute('aria-expanded',String(open))});content.innerHTML=(views[view]||(()=>originalPage(view)) )()+'<div class="footer-note"><span>MAHA PMS · MULTI-SCREEN REDESIGN CONCEPT · FICTIONAL SAMPLE DATA</span><span>Preview only — existing PMS logic and database are not connected.</span></div>';const renderedTitle=content.querySelector('.welcome h1');document.getElementById('crumb-title').textContent=renderedTitle?renderedTitle.textContent:view;wireView(view)}
function wireView(view){content.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>notify(b.dataset.toast+' — preview only; no live data changed.')));content.querySelectorAll('[data-view-link]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.viewLink)));content.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{content.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');notify('Filter selected: '+b.dataset.filter+' (sample preview)')}));const rs=document.getElementById('reservation-search');if(rs)rs.addEventListener('input',()=>{const q=rs.value.toLowerCase();const filtered=reservations.filter(r=>r.join(' ').toLowerCase().includes(q));document.getElementById('reservation-table').innerHTML=table(['Confirmation','Guest','Room type','Stay dates','Status','Total',''],filtered.map(r=>[r[0],guest(r[1],r[4],r[1].split(' ').map(x=>x[0]).join('')),r[2],r[3],status(r[5],r[6]),'<b>'+r[7]+'</b>','<button class="text-link" data-toast="Reservation detail preview">Open ↗</button>']));wireToastsOnly()})}
function wireToastsOnly(){content.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>notify(b.dataset.toast+' — preview only; no live data changed.')))}
document.querySelectorAll('.nav-group-toggle').forEach(toggle=>toggle.addEventListener('click',()=>{const group=toggle.closest('.nav-group');const willOpen=!group.classList.contains('open');document.querySelectorAll('.nav-group').forEach(other=>{other.classList.remove('open');const t=other.querySelector('.nav-group-toggle');if(t)t.setAttribute('aria-expanded','false')});if(willOpen){group.classList.add('open');toggle.setAttribute('aria-expanded','true')}}));
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{render(b.dataset.view);if(window.matchMedia('(max-width: 700px)').matches){document.querySelector('.sidebar').classList.remove('mobile-open');document.querySelector('.mobile-menu').setAttribute('aria-expanded','false')}}));
const mobileMenu=document.querySelector('.mobile-menu');
mobileMenu.addEventListener('click',()=>{const sidebar=document.querySelector('.sidebar');const open=sidebar.classList.toggle('mobile-open');mobileMenu.setAttribute('aria-expanded',String(open));mobileMenu.setAttribute('aria-label',open?'Close menu':'Open menu')});
document.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>notify(b.dataset.toast+' — preview only.')));
document.getElementById('global-search').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim())notify('Search concept: '+e.target.value.trim()+' — sample data only.')});
render('Dashboard');
</script>
