 occupied and out-of-order rooms stay locked. After check-out the Auto button checks the guest back in once the room is VC, until Close Day. After Close Day the folio is read-only in Folio Inquiry. In-house from an earlier day shows as IH."},th:{t:"เช็คเอาท์และห้องว่างสกปรก",b:"เช็คเอาท์ (O) ทำให้ห้องเป็นว่างสกปรก (VD) เช็คอิน (I) ได้เฉพาะห้องว่างสะอาด (VC) ห้องที่ตรวจแล้ว สกปรก มีแขก หรือปิดซ่อม เช็คอินไม่ได้ หลังเช็คเอาท์ ปุ่ม Auto เช็คกลับเข้าได้เมื่อห้องเป็น VC และก่อนปิดวัน หลังปิดวัน โฟลิโออ่านได้อย่างเดียว แขกที่เข้าพักจากวันก่อนแสดงเป็น IH"},my:{t:"ချက်အောက်နှင့် အခန်းညစ်ပတ်",b:"ချက်အောက် (O) သည် အခန်းကို နေသူမရှိ ညစ်ပတ် (VD) ဖြစ်စေသည်။ ချက်အင် (I) သည် နေသူမရှိ သန့်ရှင်း (VC) အခန်းတွင်သာရသည်။ စစ်ဆေးပြီး၊ ညစ်ပတ်၊ နေသူရှိ၊ ပိတ်ထားသောအခန်းကို ချက်အင်မရပါ။ ချက်အောက်ပြီး Auto ခလုတ်ဖြင့် VC ဖြစ်မှ Close Day မတိုင်မီ ပြန်ချက်အင်နိုင်သည်။ Close Day ပြီးလျှင် folio ကို ဖတ်ရန်သာဖြစ်သည်။ ယခင်နေ့မှ နေထိုင်သူကို IH ပြသည်။"}},{id:"shift",en:{t:"Shifts",b:"Shifts belong to a department through the person’s position. The Night shift can be opened by Front Office and HOD (managers and the owner included). A closed shift for that business date cannot be opened again unless the provider allows it in Security Center. Checked-out rows show in red as C/O."},th:{t:"กะ",b:"กะผูกกับแผนกตามตำแหน่ง กะดึกเปิดได้เฉพาะฟร้อนท์ออฟฟิศและ HOD (รวมผู้จัดการและเจ้าของ) กะที่ปิดแล้วของวันนั้นเปิดซ้ำไม่ได้ เว้นแต่ผู้ให้บริการอนุญาตใน Security Center แถวที่เช็คเอาท์แสดงสีแดงเป็น C/O"},my:{t:"အလှည့်",b:"အလှည့်သည် ရာထူးအလိုက် ဌာနနှင့်ဆိုင်သည်။ ညအလှည့်ကို Front Office နှင့် HOD သာဖွင့်နိုင်သည်။ ပိတ်ပြီးသောအလှည့်ကို ထိုရက်အတွက် ပြန်ဖွင့်၍မရပါ။ ပံ့ပိုးသူက Security Center တွင် ခွင့်ပြုမှသာရသည်။ ချက်အောက်ပြီးသောအတန်းသည် အနီရောင် C/O ဖြစ်သည်။"}},{id:"rb",en:{t:"Room and breakfast",b:"On an RB rate, Post room deducts adult breakfast from the room charge on Folio 1 and shows that breakfast on Folio 2 so the guest still owes the package. Hotel F&B revenue is posted once, as a plus, on dummy room D999. Dummy rooms are rate 0 and are left out of occupancy."},th:{t:"ห้องพร้อมอาหารเช้า",b:"เรท RB ตอน Post room หักอาหารเช้าผู้ใหญ่ออกจากค่าห้องบน Folio 1 และแสดงอาหารเช้าบน Folio 2 เพื่อให้แขกค้างแพ็กเกจครบ รายได้ F&B ของโรงแรมลงครั้งเดียวเป็นยอดบวกที่ห้องจำลอง D999 ห้องจำลองเรท 0 และไม่นับเข้าอัตราเข้าพัก"},my:{t:"အခန်းနှင့် မနက်စာ",b:"RB နှုန်းတွင် Post room သည် လူကြီးမနက်စာကို Folio 1 အခန်းခမှနှုတ်ပြီး Folio 2 တွင် ပြသဖြင့် ဧည့်သည်က ပက်ကေ့ချ်အပြည့်ပေးရသည်။ ဟိုတယ် F&B ဝင်ငွေကို D999 အတုအခန်းတွင် အပေါင်းတစ်ကြောင်းသာတင်သည်။ အတုအခန်းနှုန်းသည် 0 ဖြစ်ပြီး နေရာယူမှုတွင်မပါပါ။"}},{id:"corr",en:{t:"Corrections",b:"Adjust (+) is only when the folio is overpaid (balance below zero). A posted amount can be edited until Close Day. A rebate after Close Day needs approval. Correct payment and void payment are for the same business date. A refund is for a payment from a day that is already closed."},th:{t:"การแก้ไข",b:"Adjust (+) ใช้เมื่อรับเงินเกิน (ยอดติดลบ) เท่านั้น แก้ยอดที่โพสต์ได้จนถึงปิดวัน ส่วนลดหลังปิดวันต้องได้รับการอนุมัติ แก้การชำระและยกเลิกการชำระได้ในวันเดียวกัน คืนเงินใช้กับการชำระของวันที่ปิดแล้ว"},my:{t:"ပြင်ဆင်မှု",b:"Adjust (+) သည် ငွေပိုပေးထားသော folio (လက်ကျန် အနှုတ်) အတွက်သာဖြစ်သည်။ တင်ပြီးပမာဏကို Close Day မတိုင်မီ ပြင်နိုင်သည်။ Close Day ပြီးမှ လျှော့ငွေသည် အတည်ပြုချက်လိုသည်။ ငွေပေးချေမှုပြင်ခြင်းနှင့် ပယ်ဖျက်ခြင်းသည် ထိုရက်အတွက်သာဖြစ်သည်။ ပြန်အမ်းငွေသည် ပိတ်ပြီးသောနေ့၏ ငွေပေးချေမှုအတွက်ဖြစ်သည်။"}},{id:"tax",en:{t:"Tax file",b:"TM.30 lists foreign guests. e-Tax downloads invoice data as CSV. Each printed tax invoice keeps a copy for 5 years. Copies older than that can be removed from Tax copies after you confirm. They are not deleted by themselves."},th:{t:"แฟ้มภาษี",b:"TM.30 คือรายชื่อแขกต่างชาติ e-Tax ดาวน์โหลดข้อมูลใบกำกับเป็น CSV ทุกครั้งที่พิมพ์ใบกำกับจะเก็บสำเนา 5 ปี สำเนาที่เก่ากว่านั้นลบได้จากหน้า Tax copies หลังยืนยัน และจะไม่ถูกลบเอง"},my:{t:"အခွန်ဖိုင်",b:"TM.30 သည် နိုင်ငံခြားဧည့်သည်စာရင်းဖြစ်သည်။ e-Tax သည် ဘောင်ချာအချက်အလက်ကို CSV ဆွဲသည်။ ပုံနှိပ်သောအ
